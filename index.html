<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ferco Farma | Galactic Master ERP v11.1</title>
    
    <!-- Motores de Estilo y UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- React y Dependencias de Datos -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Motores de Gráficos y Excel -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-apexcharts@1.4.1/dist/react-apexcharts.iife.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'space-purple': '#9333ea',
                        'space-orange': '#f97316',
                        'space-bg': '#020206',
                        'cyber-green': '#39ff14',
                        'hades-gold': '#ffd700'
                    }
                }
            }
        }
    </script>

    <style type="text/css">
        body { background-color: #020206; color: white; margin: 0; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        #bg-nasa { z-index: 0; position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
        #root { z-index: 10; position: relative; min-height: 100vh; }

        .glass-panel { 
            background: rgba(10, 10, 18, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            backdrop-filter: blur(40px);
        }

        .btn-primary-nasa {
            width: 100%;
            background: linear-gradient(135deg, #9333ea 0%, #f97316 100%);
            color: white;
            font-weight: 900;
            padding: 1.25rem;
            border-radius: 0.75rem;
            text-transform: uppercase;
            font-style: italic;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 25px rgba(147, 51, 234, 0.3);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-primary-nasa:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(249, 115, 22, 0.5); border-color: white; }
        .btn-primary-nasa:disabled { opacity: 0.2; grayscale: 1; cursor: not-allowed; }

        .scanline {
            position: fixed; inset: 0; pointer-events: none; opacity: 0.015; z-index: 50;
            background: linear-gradient(to bottom, transparent 0%, #9333ea 50%, transparent 100%);
            animation: scan 12s linear infinite;
        }
        @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #020206; }
        ::-webkit-scrollbar-thumb { background: #9333ea; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="bg-nasa">
        <img src="logo.jpg" alt="Logo" style="width: 100%; height: 100%; object-fit: cover; opacity: 0.07; filter: blur(2px) brightness(0.3);" onerror="this.style.display='none';" />
        <div style="position: absolute; inset: 0; background: radial-gradient(circle, transparent 10%, #020206 90%);"></div>
        <div class="scanline"></div>
    </div>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, addDoc, deleteDoc, query, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB8Ei-GTiqedjsFy09XVujGb94mzkBmVOU",
            authDomain: "ferco-farma.firebaseapp.com",
            projectId: "ferco-farma",
            storageBucket: "ferco-farma.firebasestorage.app",
            messagingSenderId: "974529589553",
            appId: "1:974529589553:web:a2944444e7689dec514010"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "ferco-farma-wms";

        const { useState, useEffect, useMemo, useRef } = React;
        const ReactApexChart = window.ReactApexCharts ? (window.ReactApexCharts.default || window.ReactApexCharts) : null;

        const App = () => {
            const [user, setUser] = useState(null);
            const [productos, setProductos] = useState([]);
            const [ventas, setVentas] = useState([]);
            const [sujetos, setSujetos] = useState([]);
            const [view, setView] = useState('dashboard');
            const [loading, setLoading] = useState(true);
            const [isSyncing, setIsSyncing] = useState(false);
            const fileInputRef = useRef(null);

            // POS States
            const [carrito, setCarrito] = useState([]);
            const [pagos, setPagos] = useState([]);
            const [itemActual, setItemActual] = useState({ productoId: '', sku: '', nombre: '', cantidad: '', valorUnitario: 0 });
            const [metodoActual, setMetodoActual] = useState({ metodo: 'Efectivo', monto: '' });
            const [datosVenta, setDatosVenta] = useState({ 
                entidad: 'Cliente', nombreEntidad: '', entregaDomicilio: false, domiciliarioAsignado: 'Cris', 
                valorDomicilio: 0, canal: 'Ferco Farma', descontarStockHades: true, aplicarDescuento: false, valorDescuento: 0, 
                responsable: '' 
            });

            // Management States
            const [newProduct, setNewProduct] = useState({ id: null, sku: '', nombre: '', precioCosto: '', precioCliente: '', precioSocio: '', stockInicial: '', categoria: 'Producto Final' });
            const [newSujeto, setNewSujeto] = useState({ id: null, nombre: '', tipo: 'Cliente' });

            useEffect(() => {
                const init = async () => {
                    await signInAnonymously(auth);
                    onAuthStateChanged(auth, (u) => { setUser(u); if(u) setLoading(false); });
                };
                init();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubProd = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'productos'), (s) => setProductos(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubVentas = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'ventas'), (s) => setVentas(s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0))));
                const unsubSujetos = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'sujetos'), (s) => setSujetos(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                return () => { unsubProd(); unsubVentas(); unsubSujetos(); };
            }, [user]);

            // --- CRITICAL CALCULATIONS (Fix ReferenceErrors) ---
            const totalOp = useMemo(() => {
                const sub = carrito.reduce((s, i) => s + (parseFloat(i.cantidad) * parseFloat(i.valorUnitario) || 0), 0);
                const desc = (datosVenta.entidad === 'Cliente' && datosVenta.aplicarDescuento) ? (parseFloat(datosVenta.valorDescuento) || 0) : 0;
                const dom = (datosVenta.entregaDomicilio) ? (parseFloat(datosVenta.valorDomicilio) || 0) : 0;
                return Math.max(0, sub - desc) + dom;
            }, [carrito, datosVenta]);

            const totalAbonado = useMemo(() => pagos.reduce((s, p) => s + (parseFloat(p.monto) || 0), 0), [pagos]);

            const hadesSplit = useMemo(() => {
                if (datosVenta.canal !== 'Hades' || carrito.length === 0) return { ferco: 0, hades: 0 };
                let totalCostoSocio = 0;
                let totalVentaHades = 0;
                carrito.forEach(it => {
                    const p = productos.find(x => x.id === it.productoId);
                    const costoSocio = p?.precioSocio || 0;
                    totalCostoSocio += (costoSocio * it.cantidad);
                    totalVentaHades += (it.valorUnitario * it.cantidad);
                });
                const dom = datosVenta.entregaDomicilio ? (parseFloat(datosVenta.valorDomicilio) || 0) : 0;
                return { ferco: totalCostoSocio + dom, hades: totalVentaHades - totalCostoSocio };
            }, [carrito, datosVenta, productos]);

            const metrics = useMemo(() => {
                const res = ventas.reduce((acc, v) => {
                    const val = parseFloat(v.totalVenta) || 0;
                    if (v.entidad === 'Cliente') acc.cli += val;
                    else if (v.entidad === 'Distribuidor') acc.dist += val;
                    else if (v.entidad === 'Proveedor') acc.prov += val;
                    return acc;
                }, { cli: 0, dist: 0, prov: 0 });
                const valorBodega = productos.reduce((s,p) => s + ((parseFloat(p.stockActual) || 0) * (parseFloat(p.precioCosto) || 0)), 0);
                return { ...res, valorBodega };
            }, [ventas, productos]);

            const rankingClientes = useMemo(() => {
                const stats = ventas.filter(v => v.entidad === 'Cliente').reduce((acc, v) => {
                    if (!acc[v.nombreEntidad]) acc[v.nombreEntidad] = { nombre: v.nombreEntidad, count: 0, total: 0 };
                    acc[v.nombreEntidad].count += 1;
                    acc[v.nombreEntidad].total += v.totalVenta || 0;
                    return acc;
                }, {});
                return Object.values(stats).sort((a,b) => b.total - a.total).slice(0, 5);
            }, [ventas]);

            // --- BUSINESS LOGIC ---
            const getNextSKU = (cat) => {
                const prefixMap = { 'Producto Final': 'PFNASA-', 'Insumo': 'INASA-', 'Empaque': 'ENASA-' };
                const prefix = prefixMap[cat];
                const nums = productos.filter(p => p.sku?.startsWith(prefix)).map(p => {
                    const m = p.sku.match(/\d+/);
                    return m ? parseInt(m[0]) : 0;
                });
                const next = Math.max(0, ...nums) + 1;
                return `${prefix}${String(next).padStart(3, '0')}`;
            };

            useEffect(() => {
                const term = itemActual.sku.trim().toUpperCase();
                if (term.length > 1) {
                    const p = productos.find(x => x.sku.toUpperCase() === term);
                    if (p && !itemActual.productoId) {
                        let v = 0;
                        if (datosVenta.canal === 'Hades') v = p.precioSocio || 0;
                        else if (datosVenta.entidad === 'Cliente') v = p.precioCliente || 0;
                        else v = p.precioSocio || 0;
                        setItemActual(prev => ({ ...prev, productoId: p.id, nombre: p.nombre, valorUnitario: v }));
                    }
                }
            }, [itemActual.sku, datosVenta.entidad, datosVenta.canal, productos]);

            const confirmarDespacho = async (e) => {
                e.preventDefault();
                if (carrito.length === 0 || (totalAbonado < totalOp && datosVenta.entidad !== 'Proveedor')) return;
                try {
                    const ahora = new Date();
                    const transaccion = {
                        ...datosVenta, items: carrito, pagos, totalVenta: totalOp, split: hadesSplit,
                        timestamp: Date.now(), fecha: ahora.toLocaleDateString(), hora: ahora.toLocaleTimeString(),
                        auditLog: `OP: ${user.uid} | CANAL: ${datosVenta.canal}`
                    };
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'ventas'), transaccion);
                    
                    if (datosVenta.descontarStockHades || datosVenta.canal === 'Ferco Farma') {
                        for (const it of carrito) {
                            const pRef = doc(db, 'artifacts', appId, 'public', 'data', 'productos', it.productoId);
                            const pData = productos.find(x => x.id === it.productoId);
                            if (pData) {
                                const stockPrev = parseFloat(pData.stockActual) || 0;
                                const cambio = parseFloat(it.cantidad);
                                const nuevoStock = datosVenta.entidad === 'Proveedor' ? (stockPrev + cambio) : (stockPrev - cambio);
                                await updateDoc(pRef, { stockActual: nuevoStock });
                            }
                        }
                    }
                    setCarrito([]); setPagos([]);
                    setDatosVenta({ entidad: 'Cliente', nombreEntidad: '', entregaDomicilio: false, domiciliarioAsignado: 'Cris', valorDomicilio: 0, canal: 'Ferco Farma', descontarStockHades: true, aplicarDescuento: false, valorDescuento: 0, responsable: '' });
                } catch (err) { alert("Falla de Enlace."); }
            };

            const upsertProd = async (e) => {
                e.preventDefault();
                const skuF = newProduct.sku.trim() || getNextSKU(newProduct.categoria);
                const data = { 
                    sku: skuF, nombre: newProduct.nombre.toUpperCase(), 
                    precioCosto: parseFloat(newProduct.precioCosto) || 0,
                    precioCliente: newProduct.categoria === 'Empaque' ? 0 : parseFloat(newProduct.precioCliente) || 0,
                    precioSocio: parseFloat(newProduct.precioSocio) || 0,
                    stockActual: parseFloat(newProduct.stockInicial) || 0, stockInicial: parseFloat(newProduct.stockInicial) || 0, 
                    categoria: newProduct.categoria, timestamp: Date.now()
                };
                if (newProduct.id) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'productos', newProduct.id), data);
                else await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'productos'), data);
                setNewProduct({ id: null, sku: '', nombre: '', precioCosto: '', precioCliente: '', precioSocio: '', stockInicial: '', categoria: 'Producto Final' });
            };

            const handleExcelUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    setIsSyncing(true);
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                        for (const row of data) {
                            const skuE = String(row.SKU || "").trim().toUpperCase();
                            if (skuE) {
                                const exist = productos.find(p => p.sku.toUpperCase() === skuE);
                                if (exist) {
                                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'productos', exist.id), { 
                                        stockActual: parseFloat(row.Stock || 0), 
                                        precioCosto: parseFloat(row.Costo || exist.precioCosto),
                                        precioCliente: parseFloat(row.Precio_Cliente || exist.precioCliente),
                                        precioSocio: parseFloat(row.Precio_Socio || exist.precioSocio)
                                    });
                                }
                            }
                        }
                        alert("Sincronización masiva exitosa.");
                    } catch (err) { alert("Excel inválido."); }
                    finally { setIsSyncing(false); e.target.value = null; }
                };
                reader.readAsBinaryString(file);
            };

            // --- EXPORT FUNCTIONS (Fixing ReferenceError) ---
            const exportarPlantilla = () => {
                const data = productos.length > 0 
                    ? productos.map(p => ({ SKU: p.sku, Nombre: p.nombre, Costo: p.precioCosto, Precio_Cliente: p.precioCliente, Precio_Socio: p.precioSocio, Stock: p.stockActual })) 
                    : [{ SKU: "EJEMPLO-001", Nombre: "PRODUCTO", Costo: 1000, Precio_Cliente: 1500, Precio_Socio: 1200, Stock: 10 }];
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Inventario");
                XLSX.writeFile(wb, "Ferco_Inventario_Master.xlsx");
            };

            const exportarVentas = () => {
                const data = ventas.map(v => ({
                    ID: v.id, FECHA: v.fecha, HORA: v.hora, CANAL: v.canal, TIPO: v.entidad, SUJETO: v.nombreEntidad,
                    VALOR_FERCO: v.split?.ferco || v.totalVenta, VALOR_HADES: v.split?.hades || 0, TOTAL: v.totalVenta,
                    METODO: v.pagos?.map(p => p.metodo).join(', '), DOMI: v.domiciliarioAsignado, AUDIT: v.auditLog
                }));
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Finanzas");
                XLSX.writeFile(wb, `FINANZAS_FERCO_${Date.now()}.xlsx`);
            };

            useEffect(() => {
                if (!loading && window.lucide) window.lucide.createIcons();
            }, [loading, view, productos, ventas, carrito, datosVenta, sujetos]);

            if (loading) return <div className="flex h-screen items-center justify-center bg-[#020206] text-space-purple font-black animate-pulse uppercase tracking-[0.5em]">Iniciando ERP Galáctico...</div>;

            return (
                <div className="max-w-[1600px] mx-auto p-4 md:p-6 lg:p-8">
                    {/* Header */}
                    <header className="flex flex-col lg:flex-row justify-between items-center mb-8 gap-6 border-b border-white/5 pb-6">
                        <div className="flex items-center gap-4">
                            <div className="p-3 glass-panel border-space-purple/30 shadow-[0_0_25px_rgba(147,51,234,0.15)]">
                                <img src="logo.jpg" alt="L" className="w-10 h-10 rounded-lg" />
                            </div>
                            <div>
                                <h1 className="text-3xl font-black italic tracking-tighter text-white uppercase">Ferco <span className="text-space-orange">ERP</span></h1>
                                <p className="text-[7px] uppercase tracking-[0.5em] font-black text-space-purple opacity-60 italic text-center md:text-left">Intelligence Master Hub</p>
                            </div>
                        </div>
                        <nav className="flex flex-wrap gap-2 p-1 bg-white/5 rounded-xl border border-white/5">
                            {['dashboard', 'despacho', 'gestion', 'directorio'].map(v => (
                                <button key={v} onClick={() => setView(v)} className={`px-5 py-2 rounded-lg font-black text-[9px] uppercase transition-all ${view===v?'bg-white text-black shadow-xl':'text-slate-500 hover:text-white'}`}>{v}</button>
                            ))}
                        </nav>
                        <button onClick={exportarVentas} className="px-5 py-2.5 rounded-lg bg-cyber-green text-black font-black text-[10px] uppercase hover:scale-105 transition-all flex items-center gap-2"><i data-lucide="download-cloud"></i> Descargar Log</button>
                    </header>

                    {view === 'dashboard' ? (
                        <div className="space-y-6 animate-in fade-in duration-500">
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                {[ 
                                    { l: 'Caja Clientes', v: metrics.cli, c: '#39ff14', i: 'trending-up' }, 
                                    { l: 'Caja Aliados', v: metrics.dist, c: '#9333ea', i: 'users' }, 
                                    { l: 'Balance Proveedores', v: metrics.prov, c: '#f97316', i: 'shopping-cart' }, 
                                    { l: 'Capital en Stock', v: metrics.valorBodega, c: '#00f3ff', i: 'package' } 
                                ].map((m, i) => (
                                    <div key={i} className="glass-panel p-5 border-l-4" style={{borderColor: m.c}}>
                                        <div className="flex justify-between items-center mb-2">
                                            <p className="text-[9px] font-black text-slate-500 uppercase tracking-widest">{m.l}</p>
                                            <i data-lucide={m.i} className="w-3 h-3 opacity-30" style={{color: m.c}}></i>
                                        </div>
                                        <p className="text-2xl font-black italic" style={{color: m.c}}>${(m.v || 0).toLocaleString()}</p>
                                    </div>
                                ))}
                            </div>
                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                                <div className="lg:col-span-4 glass-panel p-6">
                                    <h3 className="text-[10px] font-black uppercase mb-6 flex items-center gap-2 text-space-purple italic border-b border-white/5 pb-4"><i data-lucide="award"></i> Top Clientes VIP</h3>
                                    <div className="space-y-3">
                                        {rankingClientes.map((c, i) => (
                                            <div key={i} className="flex justify-between items-center bg-white/5 p-3 rounded-xl border border-white/5 hover:border-space-purple/40 transition-all">
                                                <div><p className="text-[10px] font-black uppercase text-white">{c.nombre}</p><p className="text-[8px] opacity-40">{c.count} Compras</p></div>
                                                <p className="font-black text-cyber-green italic text-xs">${c.total.toLocaleString()}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="lg:col-span-8 glass-panel p-6 min-h-[400px] flex items-center justify-center">
                                    {ReactApexChart && <ReactApexChart options={{ labels: ['Clientes', 'Aliados', 'Proveedores'], colors: ['#39ff14', '#9333ea', '#f97316'], theme: { mode: 'dark' }, chart: { background: 'transparent' }, stroke: { show: false }, legend: { position: 'bottom', fontStyle: 'italic', fontWeight: 900 } }} series={[metrics.cli, metrics.dist, metrics.prov]} type="donut" width="100%" height={340} />}
                                </div>
                            </div>
                        </div>
                    ) : view === 'despacho' ? (
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 animate-in fade-in duration-500">
                            <div className="lg:col-span-5 space-y-6">
                                <div className="glass-panel p-6 space-y-5">
                                    <div className="grid grid-cols-2 gap-2 p-1 bg-black/40 rounded-xl border border-white/10">
                                        {['Ferco Farma', 'Hades'].map(c => <button key={c} onClick={()=>setDatosVenta({...datosVenta, canal:c, entidad: 'Cliente'})} className={`py-3 rounded-lg text-[10px] font-black uppercase transition-all ${datosVenta.canal===c?'bg-space-orange text-white':'text-slate-600 hover:text-white'}`}>{c}</button>)}
                                    </div>

                                    {datosVenta.canal !== 'Hades' && (
                                        <div className="flex p-1 bg-black/40 rounded-xl border border-white/10">
                                            {['Cliente', 'Distribuidor', 'Proveedor'].map(ent => (
                                                <button key={ent} onClick={() => { setDatosVenta({...datosVenta, entidad: ent, entregaDomicilio: false}); setPagos([]); }} className={`flex-1 py-2 rounded-lg text-[8px] font-black uppercase transition-all ${datosVenta.entidad === ent ? 'bg-white text-black shadow-lg' : 'text-slate-600'}`}>{ent}</button>
                                            ))}
                                        </div>
                                    )}

                                    <div className="p-4 bg-white/5 rounded-2xl border border-white/5 space-y-3">
                                        <p className="text-[8px] font-black uppercase text-space-purple tracking-widest italic">Responsable del Registro:</p>
                                        <div className="grid grid-cols-2 gap-2 max-h-24 overflow-y-auto pr-1">
                                            {sujetos.filter(s => s.tipo === datosVenta.entidad).map(s => (
                                                <button key={s.id} onClick={()=>setDatosVenta({...datosVenta, nombreEntidad: s.nombre})} className={`py-2 rounded-lg text-[8px] font-black border transition-all ${datosVenta.nombreEntidad===s.nombre?'bg-space-purple text-white border-space-purple shadow-lg':'border-white/5 text-slate-500'}`}>{s.nombre}</button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="space-y-3">
                                        <div className="relative">
                                            <input list="despSkus" value={itemActual.sku} onChange={e=>setItemActual({...itemActual, sku: e.target.value, productoId:''})} placeholder="SKU / NOMBRE PRODUCTO..." className="w-full p-3 bg-black/60 rounded-xl text-xs border border-white/10 focus:border-space-purple outline-none font-bold uppercase text-white" />
                                            <datalist id="despSkus">{productos.map(p => <option key={p.id} value={p.sku}>{p.nombre}</option>)}</datalist>
                                        </div>
                                        <div className="grid grid-cols-2 gap-2">
                                            <input type="number" value={itemActual.cantidad} onChange={e=>setItemActual({...itemActual, cantidad:e.target.value})} placeholder="CANT" className="bg-black/60 p-3 rounded-xl text-xs border border-white/5 font-black text-white" />
                                            <input type="number" value={itemActual.valorUnitario} onChange={e=>setItemActual({...itemActual, valorUnitario:e.target.value})} placeholder="VALOR $" className="bg-black/60 p-3 rounded-xl text-xs text-cyber-green font-black border border-white/5" />
                                        </div>
                                        <button onClick={()=>{ if(!itemActual.productoId || !itemActual.cantidad) return; setCarrito([...carrito, { ...itemActual, idT: Date.now() }]); setItemActual({sku:'', nombre:'', productoId:'', cantidad:'', valorUnitario:0}); }} className="w-full py-3 bg-space-purple/10 text-space-purple border border-space-purple/30 rounded-xl text-[9px] font-black uppercase">+ INYECTAR ITEM</button>
                                    </div>

                                    {datosVenta.canal === 'Hades' && (
                                        <div className="p-4 bg-hades-gold/5 rounded-2xl border border-hades-gold/20 space-y-2">
                                            <div className="flex justify-between text-[9px] font-black uppercase"><span>Saldo Ferco Farma:</span><span className="text-cyber-green">${hadesSplit.ferco.toLocaleString()}</span></div>
                                            <div className="flex justify-between text-[9px] font-black uppercase border-t border-white/5 pt-2"><span>Utilidad Hades:</span><span>${hadesSplit.hades.toLocaleString()}</span></div>
                                        </div>
                                    )}

                                    <div className="p-4 bg-black/30 rounded-2xl border border-white/5 space-y-3">
                                        <div className="flex justify-between items-center text-[9px] font-black uppercase">
                                            <span>¿Domicilio?</span>
                                            <button onClick={()=>setDatosVenta({...datosVenta, entregaDomicilio: !datosVenta.entregaDomicilio})} className={`w-9 h-4 rounded-full relative transition-all ${datosVenta.entregaDomicilio?'bg-cyan-500':'bg-slate-800'}`}><div className={`absolute top-0.5 w-3 h-3 bg-white rounded-full transition-all ${datosVenta.entregaDomicilio?'right-0.5':'left-0.5'}`}></div></button>
                                        </div>
                                        {datosVenta.entregaDomicilio && (
                                            <div className="space-y-2 animate-in fade-in">
                                                <div className="grid grid-cols-3 gap-1">{['Cris', 'Pipe', 'Valentino', 'Jhon', 'Delivery'].map(s => <button key={s} type="button" onClick={()=>setDatosVenta({...datosVenta, domiciliarioAsignado: s})} className={`py-1.5 rounded text-[7px] border font-black uppercase ${datosVenta.domiciliarioAsignado===s?'bg-cyan-600 text-white border-cyan-600':'border-white/5 text-slate-500'}`}>{s}</button>)}</div>
                                                <input type="number" value={datosVenta.valorDomicilio} onChange={e=>setDatosVenta({...datosVenta, valorDomicilio:e.target.value})} placeholder="VALOR DOMICILIO $" className="w-full p-2.5 bg-black/50 border border-white/10 rounded-lg text-xs text-cyber-green font-black outline-none" />
                                            </div>
                                        )}
                                    </div>

                                    <div className="p-4 bg-black/40 rounded-2xl border border-white/10 space-y-4">
                                        <div className="grid grid-cols-2 gap-1.5">
                                            {['Efectivo', 'Transferencia', 'Datáfono', 'Crédito', ...(datosVenta.entidad === 'Distribuidor' ? ['Cruce'] : [])].map(m => (
                                                <button key={m} type="button" onClick={()=>setMetodoActual({...metodoActual, metodo: m})} className={`py-2 rounded-lg text-[8px] font-black uppercase border transition-all ${metodoActual.metodo === m ? 'bg-space-purple text-white border-space-purple' : 'border-white/5 text-slate-600 hover:text-white'}`}>{m}</button>
                                            ))}
                                        </div>
                                        <div className="flex gap-2">
                                            <input type="number" value={metodoActual.monto} onChange={e=>setMetodoActual({...metodoActual, monto:e.target.value})} placeholder="MONTO $" className="flex-1 bg-black/60 p-2.5 rounded-lg text-xs font-black text-cyber-green border border-white/5 outline-none" />
                                            <button type="button" onClick={() => { if(!metodoActual.monto) return; setPagos([...pagos, {...metodoActual, id: Date.now()}]); setMetodoActual({metodo:'Efectivo', monto:''}); }} className="p-2.5 bg-space-orange text-white rounded-lg shadow-lg hover:scale-105 transition-all"><i data-lucide="plus"></i></button>
                                        </div>
                                        <div className="flex flex-wrap gap-1.5">
                                            {pagos.map(p => <span key={p.id} className="text-[7px] px-2 py-1 rounded bg-white/5 border border-white/10 font-black uppercase flex items-center gap-1.5">{p.metodo}: ${parseFloat(p.monto).toLocaleString()} <button onClick={()=>setPagos(pagos.filter(x=>x.id!==p.id))} className="text-red-500">x</button></span>)}
                                        </div>
                                    </div>

                                    <form onSubmit={confirmarDespacho} className="space-y-4">
                                        <input type="text" value={datosVenta.responsable} onChange={e=>setDatosVenta({...datosVenta, responsable:e.target.value})} placeholder="NOMBRE DE QUIEN ENTREGA" className="w-full p-4 bg-black/60 rounded-xl text-[10px] border border-white/10 font-bold uppercase focus:border-space-orange outline-none text-white shadow-inner" required />
                                        <div className="bg-black/90 p-5 rounded-2xl border-2 border-space-purple/30 flex justify-between items-center">
                                            <div><p className="text-[7px] font-black uppercase opacity-40 italic">Abono:</p><p className={`text-xs font-black ${totalAbonado >= totalOp ? 'text-cyber-green' : 'text-red-500 animate-pulse'}`}>${totalAbonado.toLocaleString()}</p></div>
                                            <div className="text-right"><p className="text-[8px] font-black uppercase text-space-purple tracking-widest">TOTAL:</p><p className="text-3xl font-black italic text-white">${totalOp.toLocaleString()}</p></div>
                                        </div>
                                        <button type="submit" disabled={carrito.length === 0} className="btn-primary-nasa">
                                            <i data-lucide="zap" className="w-5 h-5 inline mr-1 fill-current"></i> Confirmar Operación
                                        </button>
                                    </form>
                                </div>
                            </div>
                            <div className="lg:col-span-7 h-[850px] flex flex-col text-white">
                                <div className="glass-panel h-full flex flex-col overflow-hidden border-white/5">
                                    <div className="p-5 bg-white/5 font-black uppercase text-[10px] flex justify-between border-b border-white/5"><span>Log Operativo Cloud</span><div className="w-2 h-2 bg-red-500 rounded-full animate-ping"></div></div>
                                    <div className="overflow-x-auto flex-1 table-container">
                                        <table className="w-full text-left text-[9px]">
                                            <thead className="bg-[#101018] text-slate-500 uppercase font-black sticky top-0 text-white"><tr><th className="p-5 py-4">Fecha/Canal</th><th className="p-5 py-4">Sujeto</th><th className="p-5 py-4 text-center">Monto</th><th className="p-5 py-4 text-right text-white">Admin</th></tr></thead>
                                            <tbody className="divide-y divide-white/5 text-white">
                                                {ventas.map(v => (
                                                    <tr key={v.id} className="hover:bg-white/5 transition-all border-l-4 border-l-transparent hover:border-l-space-purple text-white">
                                                        <td className="p-5 opacity-40 uppercase font-black text-[8px]">{v.hora}<br/>{v.fecha}<br/><span className="text-space-orange">{v.canal}</span></td>
                                                        <td className="p-5 font-black uppercase truncate max-w-[140px]">{v.nombreEntidad}</td>
                                                        <td className="p-5 text-center font-black text-cyber-green italic text-sm">${(v.totalVenta || 0).toLocaleString()}</td>
                                                        <td className="p-5 text-right"><button onClick={async ()=>{ if(confirm('¿Anular?')) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'ventas', v.id)); }} className="text-slate-800 hover:text-red-500 p-2 transition-transform hover:scale-125"><i data-lucide="trash-2" className="w-4 h-4 text-white"></i></button></td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ) : view === 'gestion' ? (
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 animate-in fade-in duration-500">
                            <div className="lg:col-span-4 space-y-6">
                                <div className="glass-panel p-6 border-space-orange/30">
                                    <h2 className="text-[10px] font-black mb-6 uppercase text-space-orange italic border-l-4 border-space-purple pl-3">Nueva Entrada SKU</h2>
                                    <form onSubmit={upsertProd} className="space-y-4">
                                        <div className="grid grid-cols-3 gap-1.5 p-1 bg-black/50 rounded-xl border border-white/5 shadow-inner">
                                            {['Producto Final', 'Insumo', 'Empaque'].map(cat => (
                                                <button key={cat} type="button" onClick={()=>setNewProduct({...newProduct, categoria: cat})} className={`py-2 rounded-lg text-[7px] font-black transition-all ${newProduct.categoria === cat ? 'bg-white text-black shadow-lg' : 'text-slate-600 hover:text-white'}`}>{cat.toUpperCase()}</button>
                                            ))}
                                        </div>
                                        <div className="relative text-white">
                                            <input list="mSkus" value={newProduct.sku} onChange={e=>setNewProduct({...newProduct, sku:e.target.value})} placeholder="SKU (AUTO-CONSECUTIVO)" className="w-full p-3 bg-black/60 rounded-xl text-xs border border-white/10 text-white font-bold uppercase focus:border-white shadow-inner" />
                                            <datalist id="mSkus">{productos.map(p => <option key={p.id} value={p.sku}>{p.nombre}</option>)}</datalist>
                                        </div>
                                        <input value={newProduct.nombre} onChange={e=>setNewProduct({...newProduct, nombre:e.target.value})} placeholder="NOMBRE COMERCIAL" className="w-full p-3 bg-black/60 rounded-xl text-xs border border-white/10 font-black uppercase focus:border-white shadow-inner text-white" required />
                                        
                                        <div className="space-y-2 bg-white/5 p-4 rounded-2xl border border-white/10">
                                            <input type="number" value={newProduct.precioCosto} onChange={e=>setNewProduct({...newProduct, precioCosto:e.target.value})} placeholder="COSTO PRODUCCIÓN $" className="w-full bg-black/60 p-2.5 rounded-lg text-xs font-black border border-white/5 text-cyber-green outline-none" required />
                                            {newProduct.categoria !== 'Empaque' && (
                                                <input type="number" value={newProduct.precioCliente} onChange={e=>setNewProduct({...newProduct, precioCliente:e.target.value})} placeholder="PRECIO PÚBLICO $" className="w-full bg-black/60 p-2.5 rounded-lg text-xs font-black border border-white/5 text-white outline-none" required />
                                            )}
                                            <input type="number" value={newProduct.precioSocio} onChange={e=>setNewProduct({...newProduct, precioSocio:e.target.value})} placeholder="PRECIO SOCIO / DIST $" className="w-full bg-black/60 p-2.5 rounded-lg text-xs font-black border border-white/5 text-white outline-none" required />
                                        </div>

                                        <input type="number" value={newProduct.stockInicial} onChange={e=>setNewProduct({...newProduct, stockInicial:e.target.value})} placeholder="UNIDADES DE ENTRADA" className="w-full bg-black/60 p-3.5 rounded-xl text-xs font-black border border-white/10 text-white shadow-inner" required />
                                        <button type="submit" className="w-full bg-space-orange text-white font-black py-4 rounded-xl uppercase shadow-xl hover:scale-105 active:scale-95 transition-all text-xs tracking-widest">Sincronizar Cloud</button>
                                    </form>
                                </div>
                                <div className="glass-panel p-6 border-cyber-green/30 text-center space-y-4">
                                    <h3 className="text-[10px] font-black uppercase text-cyber-green italic tracking-widest flex items-center justify-center gap-2"><i data-lucide="upload-cloud"></i> Gestión Masiva</h3>
                                    <input type="file" ref={fileInputRef} onChange={handleExcelUpload} className="hidden" accept=".xlsx, .xls" />
                                    <div className="grid grid-cols-2 gap-2">
                                        <button onClick={() => fileInputRef.current.click()} disabled={isSyncing} className="py-3 bg-cyber-green/10 border border-cyber-green/40 rounded-xl font-black uppercase text-[8px] text-cyber-green hover:bg-cyber-green hover:text-black transition-all">Subir Excel</button>
                                        <button onClick={exportarPlantilla} className="py-3 bg-white/5 border border-white/10 rounded-xl font-black uppercase text-[8px] text-white hover:bg-white/10 transition-all">Plantilla</button>
                                    </div>
                                </div>
                            </div>
                            <div className="lg:col-span-8 space-y-6 h-[850px] overflow-y-auto pr-2 table-container">
                                {['Producto Final', 'Insumo', 'Empaque'].map(cat => (
                                    <div key={cat} className="glass-panel overflow-hidden border-white/5 mb-6">
                                        <div className="p-4 bg-white/5 font-black uppercase text-[10px] border-b border-white/5 flex justify-between">
                                            <span>Master Feed: {cat}</span>
                                            <span className="text-space-purple opacity-40 font-mono text-white">{productos.filter(p=>p.categoria===cat).length} Items</span>
                                        </div>
                                        <div className="overflow-x-auto text-white">
                                            <table className="w-full text-left text-xs text-white">
                                                <thead className="bg-black/50 text-space-orange uppercase font-black text-[9px]"><tr><th className="p-4">SKU</th><th className="p-4">Nombre</th><th className="p-4 text-center">Stock</th><th className="p-4 text-right">Admin</th></tr></thead>
                                                <tbody className="divide-y divide-white/5 text-white">
                                                    {productos.filter(p => p.categoria === cat).map(p => (
                                                        <tr key={p.id} className="hover:bg-white/5 font-black uppercase transition-all text-white"><td className="p-4 font-mono text-space-purple text-[10px]">{p.sku}</td><td className="p-4 italic text-white text-[10px] truncate max-w-[200px]">{p.nombre}</td><td className={`p-4 text-center font-black ${p.stockActual<10?'text-red-500 animate-pulse':'text-cyber-green'}`}>{p.stockActual}</td><td className="p-4 text-right flex justify-end gap-2 text-white"><button onClick={()=>setNewProduct({id:p.id, sku:p.sku, nombre:p.nombre, precioCosto:p.precioCosto, precioCliente:p.precioCliente, precioSocio:p.precioSocio, stockInicial:p.stockActual, categoria:p.categoria})} className="text-blue-500 hover:scale-125 transition-transform"><i data-lucide="edit-3"></i></button><button onClick={async ()=>{ if(confirm('¿Borrar?')) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'productos', p.id)); }} className="text-red-900 hover:scale-125 transition-transform"><i data-lucide="trash-2" className="text-white"></i></button></td></tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 animate-in fade-in duration-500">
                            <div className="lg:col-span-4 glass-panel p-8 border-white/10">
                                <h2 className="text-lg font-black mb-8 italic uppercase border-l-4 border-white pl-4 text-white">Directorio Core</h2>
                                <form onSubmit={async (e)=>{ 
                                    e.preventDefault(); 
                                    if(newSujeto.id) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sujetos', newSujeto.id), {nombre:newSujeto.nombre.toUpperCase(), tipo:newSujeto.tipo}); 
                                    else await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'sujetos'), {nombre:newSujeto.nombre.toUpperCase(), tipo:newSujeto.tipo, timestamp: Date.now()}); 
                                    setNewSujeto({id:null, nombre:'', tipo:'Cliente'}); 
                                }} className="space-y-6">
                                    <div className="grid grid-cols-3 gap-1.5 p-1.5 bg-black/40 rounded-xl">
                                        {['Cliente', 'Proveedor', 'Distribuidor'].map(t => <button key={t} type="button" onClick={()=>setNewSujeto({...newSujeto, tipo:t})} className={`py-3 rounded-lg text-[8px] font-black uppercase transition-all ${newSujeto.tipo===t?'bg-white text-black shadow-xl':'text-slate-600 hover:text-white'}`}>{t}</button>)}
                                    </div>
                                    <input value={newSujeto.nombre} onChange={e=>setNewSujeto({...newSujeto, nombre:e.target.value})} placeholder="NOMBRE / ENTIDAD COMERCIAL" className="w-full p-4 bg-black/60 rounded-xl text-xs font-black uppercase border border-white/5 outline-none focus:border-white shadow-inner text-white" required />
                                    <button type="submit" className="w-full bg-white text-black font-black py-4 rounded-xl uppercase tracking-widest shadow-2xl hover:scale-105 transition-all text-xs">
                                        {newSujeto.id ? 'Actualizar Registro' : '+ Inyectar al Directorio'}
                                    </button>
                                </form>
                            </div>
                            <div className="lg:col-span-8 glass-panel overflow-hidden h-[700px] flex flex-col border-white/5">
                                <div className="p-6 bg-white/5 font-black uppercase text-[10px] border-b border-white/5">Aliados y Clientes Registrados</div>
                                <div className="overflow-x-auto flex-1 table-container">
                                    <table className="w-full text-left text-xs">
                                        <thead className="bg-[#101018] text-slate-500 uppercase font-black sticky top-0 text-[9px]"><tr><th className="p-6 py-4">Tipo</th><th className="p-6 py-4">Nombre de Entidad</th><th className="p-6 py-4 text-right">Admin</th></tr></thead>
                                        <tbody className="divide-y divide-white/5 text-white">
                                            {sujetos.map(s => (
                                                <tr key={s.id} className="hover:bg-white/10 font-black uppercase italic transition-all group text-white">
                                                    <td className="p-6"><span className={`px-3 py-1 rounded-md text-[7px] font-black border ${s.tipo==='Cliente'?'text-cyber-green border-cyber-green/30':s.tipo==='Proveedor'?'text-space-orange border-space-orange/30':'text-space-purple border-space-purple/30'}`}>{s.tipo}</span></td>
                                                    <td className="p-6 text-white text-[11px] font-bold transition-all">{s.nombre}</td>
                                                    <td className="p-6 text-right flex justify-end gap-3 opacity-30 group-hover:opacity-100 transition-opacity">
                                                        <button onClick={()=>setNewSujeto({id:s.id, nombre:s.nombre, tipo:s.tipo})} className="text-blue-400 hover:scale-125 transition-transform"><i data-lucide="edit-3" className="w-4 h-4 text-white"></i></button>
                                                        <button onClick={async ()=>{ if(confirm('¿Anular registro?')) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sujetos', s.id)); }} className="text-red-600 hover:scale-125 transition-transform text-white"><i data-lucide="trash-2" className="w-4 h-4 text-white"></i></button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'productos'), () => {
             setTimeout(() => { if(window.lucide) lucide.createIcons(); }, 500);
        });
    </script>
</body>
</html>
