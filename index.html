<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferco Farma | WMS Cloud Interface</title>
    
    <!-- Tailwind CSS v4 (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React y Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style type="text/tailwindcss">
        @theme {
            --color-cyber-blue: #00f3ff;
            --color-cyber-pink: #ff00ff;
            --color-cyber-green: #39ff14;
            --color-cyber-bg: #050507;
            --color-cyber-card: #101014;
        }

        @layer base {
            body {
                @apply bg-[#050507] text-[#00f3ff] font-sans selection:bg-[#ff00ff] selection:text-white;
            }
        }

        .cyber-panel {
            @apply bg-[#101014] border border-[#00f3ff]/20 rounded-3xl shadow-[0_0_20px_rgba(0,243,255,0.05)];
        }

        .neon-text-blue {
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        .neon-text-pink {
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #050507; }
        ::-webkit-scrollbar-thumb { background: #00f3ff33; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #00f3ff; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, addDoc, deleteDoc, query } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Configuración Ferco Farma
        const firebaseConfig = {
            apiKey: "AIzaSyB8Ei-GTiqedjsFy09XVujGb94mzkBmVOU",
            authDomain: "ferco-farma.firebaseapp.com",
            projectId: "ferco-farma",
            storageBucket: "ferco-farma.firebasestorage.app",
            messagingSenderId: "974529589553",
            appId: "1:974529589553:web:a2944444e7689dec514010"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "ferco-farma-wms";

        const { useState, useEffect, useMemo } = React;

        const App = () => {
            const [user, setUser] = useState(null);
            const [productos, setProductos] = useState([]);
            const [ventas, setVentas] = useState([]);
            const [view, setView] = useState('despacho');
            const [searchTerm, setSearchTerm] = useState('');
            const [carrito, setCarrito] = useState([]);
            const [loading, setLoading] = useState(true);

            const [itemActual, setItemActual] = useState({
                productoId: '', nombre: '', sku: '', cantidad: '', valorUnitario: ''
            });

            const [datosVenta, setDatosVenta] = useState({
                cliente: '', tipoCliente: 'Nuevo', descuento: 0, valorDomicilio: 0
            });

            const [newProduct, setNewProduct] = useState({ sku: '', nombre: '', precio: '', stockInicial: '' });

            useEffect(() => {
                const init = async () => {
                    await signInAnonymously(auth);
                    onAuthStateChanged(auth, (u) => { 
                        setUser(u); 
                        if(u) setLoading(false); 
                    });
                };
                init();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubProd = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'productos'), (s) => 
                    setProductos(s.docs.map(d => ({ id: d.id, ...d.data() })))
                );
                const unsubVentas = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'ventas'), (s) => 
                    setVentas(s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0)))
                );
                return () => { unsubProd(); unsubVentas(); };
            }, [user]);

            // Forzar actualización de iconos Lucide
            useEffect(() => {
                if (!loading) {
                    setTimeout(() => {
                        if (window.lucide) window.lucide.createIcons();
                    }, 500);
                }
            }, [loading, view, productos, ventas, carrito]);

            const inventario = useMemo(() => productos.map(p => {
                const vendidas = ventas.reduce((acc, v) => {
                    const items = v.items?.filter(i => i.productoId === p.id) || [];
                    return acc + items.reduce((s, i) => s + (parseFloat(i.cantidad) || 0), 0);
                }, 0);
                return { ...p, stockActual: (p.stockInicial || 0) - vendidas };
            }), [productos, ventas]);

            const filtrados = useMemo(() => {
                const t = searchTerm.toLowerCase().trim();
                return t && !itemActual.productoId ? inventario.filter(p => p.nombre?.toLowerCase().includes(t) || p.sku?.includes(t)) : [];
            }, [searchTerm, inventario, itemActual.productoId]);

            const totalVenta = useMemo(() => {
                const sub = carrito.reduce((s, i) => s + (i.subtotal || 0), 0);
                const d = datosVenta.tipoCliente === 'Preferencial' ? parseFloat(datosVenta.descuento) || 0 : 0;
                return Math.max(0, sub - d) + (parseFloat(datosVenta.valorDomicilio) || 0);
            }, [carrito, datosVenta]);

            // FUNCIÓN CORREGIDA PARA EL ERROR DE REFERENCIA
            const ejecutarDespacho = async (e) => {
                if (e) e.preventDefault();
                if (carrito.length === 0) return;
                
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'ventas'), {
                        cliente: datosVenta.cliente,
                        tipoCliente: datosVenta.tipoCliente,
                        descuento: datosVenta.descuento,
                        valorDomicilio: datosVenta.valorDomicilio,
                        items: carrito,
                        totalVenta: totalVenta,
                        timestamp: Date.now(),
                        estado: 'Pendiente',
                        fecha: new Date().toLocaleDateString(),
                        hora: new Date().toLocaleTimeString()
                    });
                    setCarrito([]);
                    setDatosVenta({ cliente: '', tipoCliente: 'Nuevo', descuento: 0, valorDomicilio: 0 });
                } catch (err) {
                    console.error("Error al despachar:", err);
                    alert("Error de conexión con la nube.");
                }
            };

            if (loading) return (
                <div className="flex flex-col h-screen items-center justify-center bg-[#050507] gap-4">
                    <div className="text-[#00f3ff] font-black italic text-2xl tracking-tighter animate-pulse neon-text-blue uppercase">Cargando Ferco Cloud</div>
                    <div className="w-48 h-1 bg-white/5 rounded-full overflow-hidden">
                        <div className="h-full bg-[#ff00ff] animate-[loading_1.5s_infinite]"></div>
                    </div>
                    <style>{`@keyframes loading { 0% { transform: translateX(-100%) } 100% { transform: translateX(100%) } }`}</style>
                </div>
            );

            return (
                <div className="max-w-7xl mx-auto p-4 md:p-10">
                    <header className="flex flex-col md:flex-row justify-between items-center mb-10 gap-6 border-b border-[#00f3ff]/10 pb-8">
                        <div>
                            <h1 className="text-4xl font-black italic tracking-tighter flex items-center gap-3">
                                <span className="p-2 bg-[#00f3ff]/10 rounded-xl border border-[#00f3ff]/20">
                                    <i data-lucide="layers" className="text-[#ff00ff] w-8 h-8"></i>
                                </span>
                                FERCO <span className="text-[#ff00ff] neon-text-pink">WMS</span>
                            </h1>
                            <div className="flex items-center gap-2 mt-2 opacity-50">
                                <div className="w-2 h-2 bg-[#39ff14] rounded-full animate-pulse"></div>
                                <span className="text-[9px] uppercase tracking-widest font-bold">Cloud Synced: {user?.uid?.substring(0,6)}</span>
                            </div>
                        </div>
                        <nav className="flex gap-3">
                            <button onClick={() => setView('despacho')} className={`px-6 py-3 rounded-2xl font-black text-[10px] uppercase tracking-widest transition-all ${view==='despacho'?'bg-[#00f3ff] text-black shadow-[0_0_20px_rgba(0,243,255,0.3)]':'border border-[#00f3ff]/20 text-cyan-800'}`}>Despachos</button>
                            <button onClick={() => setView('gestion')} className={`px-6 py-3 rounded-2xl font-black text-[10px] uppercase tracking-widest transition-all ${view==='gestion'?'bg-[#ff00ff] text-white shadow-[0_0_20px_rgba(255,0,255,0.3)]':'border border-[#ff00ff]/20 text-magenta-900'}`}>Inventario</button>
                        </nav>
                    </header>

                    {view === 'despacho' ? (
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 animate-in fade-in duration-500">
                            <div className="lg:col-span-5 xl:col-span-4 space-y-6">
                                <div className="cyber-panel p-6 space-y-6">
                                    <div className="bg-black/40 p-4 rounded-2xl border border-white/5">
                                        <h3 className="text-[10px] font-black uppercase text-[#00f3ff] mb-4 tracking-widest flex items-center gap-2 italic">
                                            <i data-lucide="plus-circle" className="w-3 h-3"></i> Añadir Ítem
                                        </h3>
                                        <div className="space-y-4">
                                            <div className="relative">
                                                <i data-lucide="search" className="absolute left-3 top-3.5 w-4 h-4 text-cyan-900"></i>
                                                <input type="text" value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} placeholder="SKU o Nombre..." className="w-full pl-10 pr-4 py-3 bg-[#1a1a24] rounded-xl text-xs outline-none border border-white/5 focus:border-[#00f3ff] transition-all" />
                                                {filtrados.length > 0 && (
                                                    <div className="absolute z-50 w-full mt-2 bg-[#1a1a24] border border-[#00f3ff]/30 rounded-2xl shadow-2xl max-h-48 overflow-y-auto">
                                                        {filtrados.map(p => (
                                                            <div key={p.id} onClick={()=>{ setItemActual({...itemActual, productoId:p.id, nombre:p.nombre, sku:p.sku, valorUnitario:p.precio}); setSearchTerm(p.nombre); }} className="p-4 hover:bg-[#00f3ff]/10 cursor-pointer border-b border-white/5 last:border-0">
                                                                <p className="text-[10px] font-black text-[#ff00ff]">{p.sku}</p>
                                                                <p className="text-xs font-bold text-white">{p.nombre} <span className="opacity-40 ml-1">({p.stockActual})</span></p>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                            <div className="grid grid-cols-2 gap-3">
                                                <input type="number" value={itemActual.cantidad} onChange={e=>setItemActual({...itemActual, cantidad:e.target.value})} placeholder="Cant." className="bg-[#1a1a24] p-3 rounded-xl text-xs outline-none border border-white/5 font-bold" />
                                                <input type="number" value={itemActual.valorUnitario} onChange={e=>setItemActual({...itemActual, valorUnitario:e.target.value})} placeholder="Precio" className="bg-[#1a1a24] p-3 rounded-xl text-xs text-[#39ff14] outline-none border border-white/5 font-black" />
                                            </div>
                                            <button onClick={()=>{ if(!itemActual.productoId || !itemActual.cantidad) return; setCarrito([...carrito, {...itemActual, idT:Date.now(), subtotal:itemActual.cantidad*itemActual.valorUnitario}]); setItemActual({productoId:'',nombre:'',sku:'',cantidad:'',valorUnitario:''}); setSearchTerm(''); }} className="w-full py-3 bg-[#00f3ff]/5 border border-[#00f3ff]/20 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-[#00f3ff] hover:text-black transition-all">+ Añadir al Pedido</button>
                                        </div>
                                    </div>

                                    {carrito.length > 0 && (
                                        <div className="space-y-2 max-h-32 overflow-y-auto pr-1">
                                            {carrito.map(it => (
                                                <div key={it.idT} className="flex justify-between items-center bg-white/5 p-3 rounded-xl border border-white/5">
                                                    <span className="text-[10px] font-bold text-white truncate max-w-[140px] italic uppercase">{it.nombre} x{it.cantidad}</span>
                                                    <div className="flex items-center gap-3">
                                                        <span className="text-[#39ff14] font-black text-xs">${it.subtotal.toLocaleString()}</span>
                                                        <button onClick={()=>setCarrito(carrito.filter(i=>i.idT!==it.idT))} className="text-red-900 hover:text-red-500"><i data-lucide="x" className="w-3 h-3"></i></button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    <form onSubmit={ejecutarDespacho} className="pt-6 border-t border-white/5 space-y-4">
                                        <div className="grid grid-cols-3 gap-1">
                                            {['Nuevo', 'Consumo', 'VIP'].map(t => (
                                                <button key={t} type="button" onClick={()=>setDatosVenta({...datosVenta, tipoCliente:t})} className={`py-2 rounded-lg text-[8px] font-black uppercase border transition-all ${datosVenta.tipoCliente===t?'bg-[#ff00ff] text-white border-[#ff00ff] shadow-[0_0_10px_#ff00ff55]':'border-white/10 text-cyan-900'}`}>{t}</button>
                                            ))}
                                        </div>
                                        <input type="text" value={datosVenta.cliente} onChange={e=>setDatosVenta({...datosVenta, cliente:e.target.value})} placeholder="Identificación Cliente" className="w-full p-4 bg-[#1a1a24] rounded-xl text-xs outline-none border border-white/5 focus:border-[#ff00ff]" required />
                                        <div className="bg-black/60 p-5 rounded-2xl border-2 border-[#00f3ff]/20 shadow-inner">
                                            <div className="flex justify-between items-center">
                                                <span className="text-[10px] font-black uppercase tracking-widest italic opacity-50">Total Cloud:</span>
                                                <span className="text-2xl font-black text-[#39ff14] neon-text-blue">${totalVenta.toLocaleString()}</span>
                                            </div>
                                        </div>
                                        <button type="submit" disabled={carrito.length===0} className="w-full bg-gradient-to-r from-[#ff00ff] to-[#00f3ff] text-black font-black py-5 rounded-2xl italic uppercase tracking-tighter shadow-2xl active:scale-95 transition-all disabled:opacity-20 disabled:grayscale">
                                            Confirmar Despacho Cloud
                                        </button>
                                    </form>
                                </div>
                            </div>

                            <div className="lg:col-span-7 xl:col-span-8">
                                <div className="cyber-panel overflow-hidden">
                                    <div className="p-5 border-b border-white/5 bg-white/5 font-black uppercase italic text-xs tracking-widest text-white flex items-center gap-2">
                                        <i data-lucide="activity" className="w-4 h-4 text-[#ff00ff]"></i> Monitor de Operaciones
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-[10px]">
                                            <thead className="bg-black/50 text-cyan-900 uppercase font-black tracking-widest">
                                                <tr><th className="p-5">Sello</th><th className="p-5">Cliente</th><th className="p-5">Detalle</th><th className="p-5">Total</th><th className="p-5 text-center">Status</th><th className="p-5 text-right">Anular</th></tr>
                                            </thead>
                                            <tbody className="divide-y divide-white/5">
                                                {ventas.length === 0 ? (
                                                    <tr><td colSpan="6" className="p-20 text-center opacity-20 italic">No hay registros en la nube</td></tr>
                                                ) : (
                                                    ventas.map(v => (
                                                        <tr key={v.id} className="hover:bg-[#00f3ff]/5 transition-colors border-l-4 border-l-transparent hover:border-l-[#00f3ff]">
                                                            <td className="p-5 opacity-40 font-mono italic">{v.hora}<br/>{v.fecha}</td>
                                                            <td className="p-5 font-black uppercase text-white">{v.cliente}</td>
                                                            <td className="p-5 max-w-[180px]">
                                                                {v.items?.map((it,idx) => <p key={idx} className="truncate opacity-60">[{it.sku}] {it.nombre} x{it.cantidad}</p>)}
                                                            </td>
                                                            <td className="p-5 font-black text-[#39ff14] text-xs italic">${v.totalVenta.toLocaleString()}</td>
                                                            <td className="p-5 text-center">
                                                                <button onClick={async ()=>{
                                                                    const n = v.estado==='Pagado'?'Pendiente':'Pagado';
                                                                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'ventas', v.id), {estado:n}, {merge:true});
                                                                }} className={`px-4 py-1.5 rounded-lg border text-[8px] font-black uppercase tracking-widest ${v.estado==='Pagado'?'text-[#39ff14] border-[#39ff14]/30 bg-[#39ff14]/5':'text-[#ff00ff] border-[#ff00ff]/30 bg-[#ff00ff]/5'}`}>
                                                                    {v.estado}
                                                                </button>
                                                            </td>
                                                            <td className="p-5 text-right">
                                                                <button onClick={async ()=>{ if(confirm('¿Anular permanentemente?')) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'ventas', v.id)); }} className="text-red-900 hover:text-red-500 transition-colors">
                                                                    <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))
                                                )}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-10 animate-in fade-in duration-300">
                            <div className="lg:col-span-4 cyber-panel p-8 border-[#ff00ff]/30">
                                <h2 className="text-xl font-black mb-8 italic uppercase text-white border-l-4 border-[#00f3ff] pl-4">Vincular SKU Cloud</h2>
                                <form onSubmit={async (e)=>{ 
                                    e.preventDefault(); 
                                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'productos'), {
                                        sku: newProduct.sku,
                                        nombre: newProduct.nombre,
                                        precio: parseFloat(newProduct.precio) || 0,
                                        stockInicial: parseInt(newProduct.stockInicial) || 0
                                    }); 
                                    setNewProduct({sku:'',nombre:'',precio:'',stockInicial:''}); 
                                }} className="space-y-5">
                                    <div className="space-y-1">
                                        <label className="text-[9px] uppercase font-black ml-1 opacity-50">Código Maestro</label>
                                        <input value={newProduct.sku} onChange={e=>setNewProduct({...newProduct, sku:e.target.value})} placeholder="SKU" className="w-full p-4 bg-[#1a1a24] rounded-2xl text-xs outline-none border border-white/5 focus:border-[#ff00ff] transition-all text-white font-bold" required />
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-[9px] uppercase font-black ml-1 opacity-50">Descripción Comercial</label>
                                        <input value={newProduct.nombre} onChange={e=>setNewProduct({...newProduct, nombre:e.target.value})} placeholder="Nombre del Producto" className="w-full p-4 bg-[#1a1a24] rounded-2xl text-xs outline-none border border-white/5 focus:border-[#ff00ff] transition-all text-white font-bold" required />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4">
                                        <input type="number" value={newProduct.precio} onChange={e=>setNewProduct({...newProduct, precio:e.target.value})} placeholder="Precio Base" className="bg-[#1a1a24] p-4 rounded-2xl text-xs outline-none border border-white/5" required />
                                        <input type="number" value={newProduct.stockInicial} onChange={e=>setNewProduct({...newProduct, stockInicial:e.target.value})} placeholder="Stock Inicial" className="bg-[#1a1a24] p-4 rounded-2xl text-xs outline-none border border-white/5" required />
                                    </div>
                                    <button type="submit" className="w-full bg-[#ff00ff] text-white font-black py-5 rounded-2xl uppercase tracking-tighter shadow-[0_0_30px_rgba(255,0,255,0.2)] hover:scale-[1.02] active:scale-95 transition-all">
                                        + Inyectar a Cloud Master
                                    </button>
                                </form>
                            </div>
                            <div className="lg:col-span-8 cyber-panel overflow-hidden border-[#ff00ff]/10">
                                <table className="w-full text-left text-xs">
                                    <thead className="bg-[#1a1a24] text-[#ff00ff] uppercase font-black tracking-widest border-b border-white/5">
                                        <tr><th className="p-6">Identificador SKU</th><th className="p-6">Nombre de Producto</th><th className="p-6">Balance Stock</th><th className="p-6 text-right">Acción</th></tr>
                                    </thead>
                                    <tbody className="divide-y divide-[#ff00ff]/5">
                                        {inventario.map(p => (
                                            <tr key={p.id} className="hover:bg-[#ff00ff]/5 transition-colors">
                                                <td className="p-6 font-mono font-bold text-[#00f3ff] uppercase tracking-tighter">{p.sku}</td>
                                                <td className="p-6 font-bold text-white uppercase italic">{p.nombre}</td>
                                                <td className={`p-6 font-black ${p.stockActual < 10 ? 'text-red-500 animate-pulse' : 'text-[#39ff14]'}`}>
                                                    <span className="flex items-center gap-2">
                                                        <i data-lucide={p.stockActual < 10 ? "alert-triangle" : "check-circle"} className="w-4 h-4"></i>
                                                        {p.stockActual} UNIDADES
                                                    </span>
                                                </td>
                                                <td className="p-6 text-right">
                                                    <button onClick={async ()=>{ if(confirm('¿Eliminar permanentemente?')) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'productos', p.id)); }} className="text-magenta-900 hover:text-red-500 p-2 transition-transform hover:scale-125">
                                                        <i data-lucide="trash-2" className="w-5 h-5"></i>
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
