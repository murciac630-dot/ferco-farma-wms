<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ferco Farma | Galactic Intelligence Hub</title>
    
    <!-- Tailwind CSS v4 (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React y Dependencias Críticas -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- FIX: Cargamos PropTypes antes de los gráficos -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.js"></script>
    
    <!-- Babel para procesamiento JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- ApexCharts -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-apexcharts@1.4.1/dist/react-apexcharts.iife.min.js"></script>

    <style type="text/tailwindcss">
        @theme {
            --color-space-purple: #7c3aed;
            --color-space-orange: #f97316;
            --color-space-bg: #020205;
            --color-space-card: rgba(15, 15, 25, 0.85);
        }
        @layer base {
            body { 
                @apply bg-[#020205] text-white font-sans selection:bg-[#f97316] overflow-x-hidden; 
            }
        }
        .cyber-panel { 
            @apply bg-[rgba(15,15,25,0.75)] border border-white/10 rounded-[2.5rem] backdrop-blur-2xl shadow-2xl; 
        }
        .btn-galactic { 
            @apply px-5 py-2.5 rounded-2xl font-black text-[10px] uppercase tracking-widest transition-all border flex items-center gap-2; 
        }
        .scanline {
            @apply fixed inset-0 pointer-events-none opacity-[0.03] z-50;
            background: linear-gradient(to bottom, transparent 0%, #00f3ff 50%, transparent 100%);
            animation: scan 4s linear infinite;
        }
        @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #020205; }
        ::-webkit-scrollbar-thumb { background: #7c3aed44; border-radius: 10px; }
    </style>
</head>
<body>
    <!-- CAPA DE FONDO: LOGO TRASLÚCIDO -->
    <div class="fixed inset-0 -z-10 overflow-hidden bg-[#020205]">
        <img 
            src="logo.jpg" 
            alt="Fondo Ferco" 
            class="w-full h-full object-cover opacity-[0.08] scale-110 blur-[1px] brightness-[0.4]" 
            onerror="this.style.display='none';" 
        />
        <div class="absolute inset-0 bg-gradient-to-b from-[#020205]/95 via-transparent to-[#020205]/95"></div>
        <div class="scanline"></div>
    </div>
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, addDoc, deleteDoc, query } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB8Ei-GTiqedjsFy09XVujGb94mzkBmVOU",
            authDomain: "ferco-farma.firebaseapp.com",
            projectId: "ferco-farma",
            storageBucket: "ferco-farma.firebasestorage.app",
            messagingSenderId: "974529589553",
            appId: "1:974529589553:web:a2944444e7689dec514010"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "ferco-farma-wms";

        const { useState, useEffect, useMemo } = React;

        const ReactApexChart = window.ReactApexCharts ? (window.ReactApexCharts.default || window.ReactApexCharts) : null;

        const App = () => {
            const [user, setUser] = useState(null);
            const [productos, setProductos] = useState([]);
            const [ventas, setVentas] = useState([]);
            const [distribuidores, setDistribuidores] = useState([]);
            const [view, setView] = useState('dashboard');
            const [loading, setLoading] = useState(true);

            // Estados de Formulario
            const [searchTerm, setSearchTerm] = useState('');
            const [carrito, setCarrito] = useState([]);
            const [itemActual, setItemActual] = useState({ productoId: '', nombre: '', sku: '', cantidad: '', valorUnitario: '' });
            
            // ACTUALIZACIÓN: Incluimos domiciliario en el estado inicial
            const [datosVenta, setDatosVenta] = useState({ 
                entidad: 'Cliente', 
                nombreEntidad: '', 
                tipoCliente: 'Nuevo', 
                descuento: 0, 
                valorDomicilio: 0, 
                estadoTransaccion: 'Pagado',
                entregaDomicilio: false,
                domiciliarioAsignado: ''
            });

            const [newProduct, setNewProduct] = useState({ sku: '', nombre: '', precio: '', stockInicial: '' });
            const [newDist, setNewDist] = useState({ nombre: '', contacto: '', telefono: '', categoria: 'Principal' });

            // Lista oficial de domiciliarios
            const staffDomiciliarios = ['Cris', 'Jhon', 'Felipe', 'Cesar'];

            useEffect(() => {
                const init = async () => {
                    await signInAnonymously(auth);
                    onAuthStateChanged(auth, (u) => { 
                        setUser(u); 
                        if(u) setLoading(false); 
                    });
                };
                init();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubProd = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'productos'), (s) => setProductos(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubVentas = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'ventas'), (s) => setVentas(s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0))));
                const unsubDist = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'distribuidores'), (s) => setDistribuidores(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                return () => { unsubProd(); unsubVentas(); unsubDist(); };
            }, [user]);

            useEffect(() => {
                if (!loading && window.lucide) window.lucide.createIcons();
            }, [loading, view, productos, ventas, carrito, datosVenta.entidad, datosVenta.entregaDomicilio]);

            const inventarioActual = useMemo(() => {
                return productos.map(p => {
                    const vendidas = ventas.reduce((acc, v) => {
                        const items = (v.items || []).filter(i => i.productoId === p.id);
                        return acc + items.reduce((s, i) => s + (parseFloat(i.cantidad) || 0), 0);
                    }, 0);
                    return { ...p, stockActual: (parseFloat(p.stockInicial) || 0) - vendidas };
                });
            }, [productos, ventas]);

            const metrics = useMemo(() => {
                const cli = ventas.filter(v => v.entidad === 'Cliente').reduce((s,v) => s + (parseFloat(v.totalVenta) || 0), 0);
                const dist = ventas.filter(v => v.entidad === 'Distribuidor').reduce((s,v) => s + (parseFloat(v.totalVenta) || 0), 0);
                const prov = ventas.filter(v => v.entidad === 'Proveedor').reduce((s,v) => s + (parseFloat(v.totalVenta) || 0), 0);
                const valorTotalBodega = inventarioActual.reduce((s,p) => s + (p.stockActual * (parseFloat(p.precio) || 0)), 0);
                const criticos = inventarioActual.filter(p => p.stockActual < 10).length;
                return { cli, dist, prov, valorTotalBodega, criticos };
            }, [ventas, inventarioActual]);

            const filtrados = useMemo(() => {
                const t = searchTerm.toLowerCase().trim();
                return t && !itemActual.productoId ? inventarioActual.filter(p => p.nombre?.toLowerCase().includes(t) || p.sku?.toLowerCase().includes(t)) : [];
            }, [searchTerm, inventarioActual, itemActual.productoId]);

            const totalOperacion = useMemo(() => {
                const sub = carrito.reduce((s, i) => s + i.subtotal, 0);
                const d = datosVenta.entidad === 'Cliente' && datosVenta.tipoCliente === 'Preferencial' ? parseFloat(datosVenta.descuento) || 0 : 0;
                // Sumamos el valor del domicilio si aplica
                const dom = datosVenta.entregaDomicilio ? (parseFloat(datosVenta.valorDomicilio) || 0) : 0;
                return Math.max(0, sub - d) + dom;
            }, [carrito, datosVenta]);

            const ejecutarConfirmacion = async (e) => {
                e.preventDefault();
                if (carrito.length === 0) return;
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'ventas'), {
                        ...datosVenta,
                        items: carrito,
                        totalVenta: totalOperacion,
                        timestamp: Date.now(),
                        estado: datosVenta.entidad === 'Proveedor' ? datosVenta.estadoTransaccion : 'Pendiente',
                        fecha: new Date().toLocaleDateString(),
                        hora: new Date().toLocaleTimeString()
                    });
                    setCarrito([]);
                    setDatosVenta({ 
                        entidad: 'Cliente', 
                        nombreEntidad: '', 
                        tipoCliente: 'Nuevo', 
                        descuento: 0, 
                        valorDomicilio: 0, 
                        estadoTransaccion: 'Pagado',
                        entregaDomicilio: false,
                        domiciliarioAsignado: ''
                    });
                } catch (err) { alert("Error de Uplink Cloud."); }
            };

            if (loading) return (
                <div className="flex h-screen items-center justify-center bg-[#020205]">
                    <div className="text-white font-black italic text-2xl animate-pulse tracking-widest uppercase">Estableciendo Link NASA-Ferco...</div>
                </div>
            );

            return (
                <div className="max-w-7xl mx-auto p-4 md:p-10">
                    <header className="flex flex-col lg:flex-row justify-between items-center mb-12 gap-8 border-b border-white/5 pb-10">
                        <div className="flex flex-col md:flex-row items-center gap-6">
                            <img src="logo.jpg" alt="Logo" className="w-24 md:w-36 h-auto rounded-3xl shadow-[0_0_30px_rgba(124,58,237,0.3)] border border-white/10" onError={(e) => e.target.style.display='none'} />
                            <div>
                                <h1 className="text-4xl font-black italic tracking-tighter text-white uppercase">Ferco <span className="text-space-orange">Farma</span></h1>
                                <p className="text-[9px] uppercase tracking-[0.4em] font-black text-space-purple mt-1">PRODUCTOS CERTIFICADOS POR LA NASA</p>
                            </div>
                        </div>
                        <nav className="flex flex-wrap gap-2 justify-center">
                            <button onClick={() => setView('despacho')} className={`btn-galactic ${view==='despacho'?'bg-space-purple text-white border-white/20 shadow-[0_0_20px_#7c3aed44]':'border-white/10 text-slate-500'}`}><i data-lucide="zap" className="w-3 h-3"></i> Despachos</button>
                            <button onClick={() => setView('gestion')} className={`btn-galactic ${view==='gestion'?'bg-space-orange text-white border-white/20 shadow-[0_0_20px_#f9731644]':'border-white/10 text-slate-500'}`}><i data-lucide="package" className="w-3 h-3"></i> Inventario</button>
                            <button onClick={() => setView('distribuidores')} className={`btn-galactic ${view==='distribuidores'?'border-white text-white':'border-white/10 text-slate-500'}`}><i data-lucide="users" className="w-3 h-3"></i> Distribuidores</button>
                            <button onClick={() => setView('dashboard')} className={`btn-galactic ${view==='dashboard'?'bg-white text-black shadow-[0_0_20px_white/30]':'border-white/10 text-slate-500'}`}><i data-lucide="bar-chart-3" className="w-3 h-3"></i> Dashboard</button>
                        </nav>
                    </header>

                    {view === 'dashboard' ? (
                        <div className="space-y-8 animate-in fade-in zoom-in duration-700">
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                                <div className="cyber-panel p-6 border-l-4 border-l-[#39ff14] flex flex-col justify-between h-32">
                                    <p className="text-[10px] font-black text-slate-500 uppercase tracking-widest text-center">Ingresos Clientes</p>
                                    <p className="text-3xl font-black italic text-[#39ff14] text-center">${metrics.cli.toLocaleString()}</p>
                                </div>
                                <div className="cyber-panel p-6 border-l-4 border-l-space-purple flex flex-col justify-between h-32">
                                    <p className="text-[10px] font-black text-slate-500 uppercase tracking-widest text-center">Cartera Distribuidores</p>
                                    <p className="text-3xl font-black italic text-space-purple text-center">${metrics.dist.toLocaleString()}</p>
                                </div>
                                <div className="cyber-panel p-6 border-l-4 border-l-space-orange flex flex-col justify-between h-32">
                                    <p className="text-[10px] font-black text-slate-500 uppercase tracking-widest text-center">Info Proveedores</p>
                                    <p className="text-3xl font-black italic text-space-orange text-center">${metrics.prov.toLocaleString()}</p>
                                </div>
                                <div className="cyber-panel p-6 border-l-4 border-l-red-600 flex flex-col justify-between h-32">
                                    <p className="text-[10px] font-black text-slate-500 uppercase tracking-widest text-center">Stock Críticos</p>
                                    <p className="text-3xl font-black italic text-red-600 text-center">{metrics.criticos}</p>
                                </div>
                            </div>
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                <div className="cyber-panel p-8">
                                    <h3 className="text-sm font-black italic uppercase mb-8 flex items-center gap-2"><i data-lucide="pie-chart" className="text-space-purple"></i> Distribución Operativa</h3>
                                    <div className="min-h-[350px] flex items-center justify-center">
                                        {ReactApexChart ? (
                                            <ReactApexChart 
                                                options={{
                                                    labels: ['Clientes', 'Distribuidores', 'Proveedores'],
                                                    colors: ['#39ff14', '#7c3aed', '#f97316'],
                                                    theme: { mode: 'dark' },
                                                    chart: { background: 'transparent' },
                                                    legend: { position: 'bottom', fontStyle: 'italic', fontWeight: 900 },
                                                    stroke: { show: false }
                                                }}
                                                series={[metrics.cli, metrics.dist, metrics.prov]}
                                                type="donut" width="100%" height={350}
                                            />
                                        ) : <p className="opacity-20 italic">Cargando motor gráfico...</p>}
                                    </div>
                                </div>
                                <div className="cyber-panel p-8 flex flex-col justify-center items-center text-center">
                                    <h3 className="text-sm font-black italic uppercase mb-10 flex items-center gap-2"><i data-lucide="trending-up" className="text-space-orange"></i> Valorización de Activos</h3>
                                    <p className="text-[10px] uppercase font-bold opacity-30 tracking-[0.3em] mb-2">Inventario Valorizado</p>
                                    <p className="text-6xl font-black italic text-white">${metrics.valorTotalBodega.toLocaleString()}</p>
                                    <div className="w-full bg-white/5 h-2 rounded-full mt-10 overflow-hidden">
                                        <div className="h-full bg-gradient-to-r from-space-purple to-space-orange" style={{ width: '85%' }}></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    ) : view === 'despacho' ? (
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 animate-in fade-in duration-500">
                            <div className="lg:col-span-5 xl:col-span-4 space-y-6">
                                <div className="cyber-panel p-8 space-y-6">
                                    <div className="flex p-1 bg-black/40 rounded-xl border border-white/10">
                                        {['Cliente', 'Distribuidor', 'Proveedor'].map(ent => (
                                            <button key={ent} onClick={() => setDatosVenta({...datosVenta, entidad: ent})} className={`flex-1 py-2.5 rounded-lg text-[9px] font-black uppercase transition-all ${datosVenta.entidad === ent ? (ent==='Proveedor'?'bg-space-purple text-white':ent==='Distribuidor'?'bg-[#39ff14] text-black':'bg-white text-black') : 'text-slate-600'}`}>{ent}</button>
                                        ))}
                                    </div>

                                    <div className="space-y-4">
                                        <input type="text" value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} placeholder="Escanear Producto..." className="w-full pl-4 pr-4 py-3.5 bg-black/50 rounded-2xl text-xs outline-none border border-white/5 focus:border-space-purple" />
                                        {filtrados.length > 0 && (
                                            <div className="bg-[#101015] border border-white/20 rounded-2xl shadow-2xl max-h-48 overflow-y-auto">
                                                {filtrados.map(p => (
                                                    <div key={p.id} onClick={()=>{ setItemActual({...itemActual, productoId:p.id, nombre:p.nombre, sku:p.sku, valorUnitario:p.precio}); setSearchTerm(p.nombre); }} className="p-4 hover:bg-space-purple/10 cursor-pointer border-b border-white/5 text-xs font-bold uppercase"><span className="text-space-orange">[{p.sku}]</span> {p.nombre} ({p.stockActual})</div>
                                                ))}
                                            </div>
                                        )}
                                        <div className="grid grid-cols-2 gap-3">
                                            <input type="number" value={itemActual.cantidad} onChange={e=>setItemActual({...itemActual, cantidad:e.target.value})} placeholder="Cant." className="bg-black/50 p-4 rounded-2xl text-xs outline-none border border-white/5 font-bold" />
                                            <input type="number" value={itemActual.valorUnitario} onChange={e=>setItemActual({...itemActual, valorUnitario:e.target.value})} placeholder="$ Valor" className="bg-black/50 p-4 rounded-2xl text-xs text-[#39ff14] outline-none border border-white/5 font-black" />
                                        </div>
                                        <button onClick={()=>{ if(!itemActual.productoId || !itemActual.cantidad) return; setCarrito([...carrito, {...itemActual, idT:Date.now(), subtotal:parseFloat(itemActual.cantidad)*parseFloat(itemActual.valorUnitario)}]); setItemActual({productoId:'',nombre:'',sku:'',cantidad:'',valorUnitario:''}); setSearchTerm(''); }} className="w-full py-4 bg-space-purple/10 text-space-purple border border-space-purple/30 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-space-purple hover:text-white">Añadir Producto</button>
                                    </div>

                                    {/* MÓDULO DOMICILIARIOS (SOLO PARA CLIENTE) */}
                                    {datosVenta.entidad === 'Cliente' && (
                                        <div className="space-y-4 pt-4 border-t border-white/5">
                                            <div className="flex justify-between items-center">
                                                <label className="text-[10px] font-black uppercase tracking-widest text-slate-500 flex items-center gap-2 italic">
                                                    <i data-lucide="bike" className="w-3 h-3 text-[#39ff14]"></i> ¿Es Domicilio?
                                                </label>
                                                <button 
                                                    onClick={() => setDatosVenta({...datosVenta, entregaDomicilio: !datosVenta.entregaDomicilio})}
                                                    className={`w-12 h-6 rounded-full transition-all relative ${datosVenta.entregaDomicilio ? 'bg-[#39ff14]' : 'bg-slate-800'}`}
                                                >
                                                    <div className={`absolute top-1 w-4 h-4 rounded-full bg-white transition-all ${datosVenta.entregaDomicilio ? 'right-1' : 'left-1'}`}></div>
                                                </button>
                                            </div>

                                            {datosVenta.entregaDomicilio && (
                                                <div className="space-y-4 animate-in slide-in-from-top-4 duration-300">
                                                    <div className="grid grid-cols-2 gap-2">
                                                        {staffDomiciliarios.map(name => (
                                                            <button 
                                                                key={name}
                                                                onClick={() => setDatosVenta({...datosVenta, domiciliarioAsignado: name})}
                                                                className={`py-2 rounded-xl text-[9px] font-black uppercase border transition-all ${datosVenta.domiciliarioAsignado === name ? 'bg-space-orange border-space-orange text-white' : 'border-white/10 text-slate-500'}`}
                                                            >
                                                                {name}
                                                            </button>
                                                        ))}
                                                    </div>
                                                    <input 
                                                        type="number" 
                                                        value={datosVenta.valorDomicilio} 
                                                        onChange={e=>setDatosVenta({...datosVenta, valorDomicilio: e.target.value})} 
                                                        placeholder="Costo de Envío $" 
                                                        className="w-full p-3 bg-black/50 border border-[#39ff14]/30 rounded-xl text-xs outline-none text-[#39ff14] font-black"
                                                    />
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    <form onSubmit={ejecutarConfirmacion} className="space-y-5">
                                        <input type="text" value={datosVenta.nombreEntidad} onChange={e=>setDatosVenta({...datosVenta, nombreEntidad:e.target.value})} placeholder={`Identificación de ${datosVenta.entidad}`} className="w-full p-4 bg-black/50 rounded-2xl text-xs outline-none border border-white/5 focus:border-space-orange" required />
                                        <div className="bg-black/80 p-6 rounded-[2.5rem] border-2 border-space-purple/30 flex justify-between items-center shadow-inner"><span className="text-[10px] font-black uppercase opacity-40 italic">Balance:</span><span className="text-3xl font-black text-[#39ff14]">${totalOperacion.toLocaleString()}</span></div>
                                        <button type="submit" disabled={carrito.length===0} className={`w-full text-black font-black py-5 rounded-2xl italic uppercase tracking-tighter shadow-2xl transition-all disabled:opacity-20 ${datosVenta.entidad==='Proveedor' ? 'bg-space-purple text-white' : 'bg-gradient-to-br from-space-purple to-space-orange'}`}>Confirmar Despacho Cloud</button>
                                    </form>
                                </div>
                            </div>
                            <div className="lg:col-span-7 xl:col-span-8">
                                <div className="cyber-panel overflow-hidden border-white/5">
                                    <div className="p-6 border-b border-white/5 bg-white/5 font-black uppercase italic text-[10px] text-white flex items-center justify-between"><span>Log de Operaciones</span><div className="w-2 h-2 bg-red-500 rounded-full animate-ping"></div></div>
                                    <div className="overflow-x-auto"><table className="w-full text-left text-[10px]"><thead className="bg-black/80 text-slate-500 uppercase font-black tracking-widest border-b border-white/5"><tr><th className="p-6">Nodo</th><th className="p-6">Sujeto</th><th className="p-6 text-center">Entrega</th><th className="p-6 text-center">Monto</th><th className="p-6 text-center">Estado</th><th className="p-6 text-right">Borrar</th></tr></thead>
                                        <tbody className="divide-y divide-white/5">{ventas.map(v => (
                                            <tr key={v.id} className="hover:bg-white/5 transition-colors border-l-4 border-l-transparent hover:border-l-space-orange">
                                                <td className="p-6 font-black uppercase text-[9px]"><span className="opacity-40">{v.entidad}</span></td>
                                                <td className="p-6 font-black uppercase text-white truncate max-w-[120px]">{v.nombreEntidad}</td>
                                                <td className="p-6 text-center">
                                                    {v.entregaDomicilio ? (
                                                        <span className="text-[#39ff14] font-black italic flex items-center justify-center gap-1"><i data-lucide="truck" className="w-3 h-3"></i> {v.domiciliarioAsignado}</span>
                                                    ) : <span className="opacity-20">Mostrador</span>}
                                                </td>
                                                <td className="p-6 text-center font-black text-[#39ff14] italic text-xs">${(parseFloat(v.totalVenta) || 0).toLocaleString()}</td>
                                                <td className="p-6 text-center"><span className={`px-4 py-1.5 rounded-xl border text-[8px] font-black uppercase ${v.estado === 'Pagado' ? 'text-[#39ff14] border-[#39ff14]/30' : 'text-space-orange border-space-orange/30'}`}>{v.estado}</span></td>
                                                <td className="p-6 text-right"><button onClick={async ()=>{ if(confirm('¿Anular?')) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'ventas', v.id)); }} className="text-slate-800 hover:text-red-500 transition-colors"><i data-lucide="trash-2" className="w-4 h-4"></i></button></td>
                                            </tr>))}</tbody>
                                    </table></div>
                                </div>
                            </div>
                        </div>
                    ) : view === 'gestion' ? (
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-10 animate-in fade-in duration-500">
                            <div className="lg:col-span-4 cyber-panel p-8 border-space-orange/30">
                                <h2 className="text-xl font-black mb-8 italic uppercase text-white border-l-4 border-space-purple pl-4">Vincular SKU</h2>
                                <form onSubmit={async (e)=>{ e.preventDefault(); await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'productos'), { sku: newProduct.sku, nombre: newProduct.nombre, precio: parseFloat(newProduct.precio) || 0, stockInicial: parseInt(newProduct.stockInicial) || 0 }); setNewProduct({sku:'',nombre:'',precio:'',stockInicial:''}); }} className="space-y-5">
                                    <input value={newProduct.sku} onChange={e=>setNewProduct({...newProduct, sku:e.target.value})} placeholder="SKU NASA" className="w-full p-4 bg-black/50 rounded-2xl text-xs outline-none border border-white/5 focus:border-space-purple text-white font-bold uppercase" required />
                                    <input value={newProduct.nombre} onChange={e=>setNewProduct({...newProduct, nombre:e.target.value})} placeholder="Nombre Comercial" className="w-full p-4 bg-black/50 rounded-2xl text-xs outline-none border border-white/5 focus:border-space-purple text-white font-bold" required />
                                    <div className="grid grid-cols-2 gap-4">
                                        <input type="number" value={newProduct.precio} onChange={e=>setNewProduct({...newProduct, precio:e.target.value})} placeholder="Base $" className="bg-black/50 p-4 rounded-2xl text-xs outline-none border border-white/5" required />
                                        <input type="number" value={newProduct.stockInicial} onChange={e=>setNewProduct({...newProduct, stockInicial:e.target.value})} placeholder="Initial Stock" className="bg-black/50 p-4 rounded-2xl text-xs outline-none border border-white/5" required />
                                    </div>
                                    <button type="submit" className="w-full bg-space-orange text-white font-black py-5 rounded-2xl uppercase tracking-tighter shadow-2xl transition-all hover:scale-[1.02]">+ Inyectar Cloud</button>
                                </form>
                            </div>
                            <div className="lg:col-span-8 cyber-panel overflow-hidden border-white/5">
                                <table className="w-full text-left text-xs"><thead className="bg-[#1a1a24] text-space-orange uppercase font-black border-b border-white/5 tracking-widest"><tr><th className="p-6">Master SKU</th><th className="p-6">Nombre Comercial</th><th className="p-6 text-center">Stock Actual</th><th className="p-6 text-right">Borrar</th></tr></thead>
                                    <tbody className="divide-y divide-white/5">{inventarioActual.map(p => (
                                        <tr key={p.id} className="hover:bg-space-purple/5 transition-colors border-l-4 border-l-transparent hover:border-l-space-purple font-black"><td className="p-6 font-mono font-bold text-space-purple uppercase tracking-tighter">{p.sku}</td><td className="p-6 font-bold text-white uppercase italic">{p.nombre}</td><td className={`p-6 text-center font-black ${p.stockActual < 10 ? 'text-red-500 animate-pulse' : 'text-[#39ff14]'}`}>{p.stockActual} UNIDADES</td><td className="p-6 text-right"><button onClick={async ()=>{ if(confirm('¿Eliminar SKU?')) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'productos', p.id)); }} className="text-slate-800 hover:text-red-500 p-2 transition-transform hover:scale-125"><i data-lucide="trash-2" className="w-5 h-5"></i></button></td></tr>))}</tbody>
                                </table></div>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-10 animate-in fade-in duration-300">
                            <div className="lg:col-span-4 cyber-panel p-8 border-white/20">
                                <h2 className="text-xl font-black mb-8 italic uppercase text-white border-l-4 border-white pl-4">Nuevo Socio Aliado</h2>
                                <form onSubmit={async (e)=>{ e.preventDefault(); await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'distribuidores'), {...newDist, timestamp: Date.now()}); setNewDist({nombre:'',contacto:'',telefono:'',categoria:'Principal'}); }} className="space-y-5">
                                    <input value={newDist.nombre} onChange={e=>setNewDist({...newDist, nombre:e.target.value})} placeholder="Nombre Corporativo" className="w-full p-4 bg-black/50 rounded-2xl text-xs outline-none border border-white/5 focus:border-white text-white font-bold" required />
                                    <input value={newDist.contacto} onChange={e=>setNewDist({...newDist, contacto:e.target.value})} placeholder="Contacto Directo" className="w-full p-4 bg-black/50 rounded-2xl text-xs outline-none border border-white/5" />
                                    <input value={newDist.telefono} onChange={e=>setNewDist({...newDist, telefono:e.target.value})} placeholder="Uplink Celular" className="w-full p-4 bg-black/50 rounded-2xl text-xs outline-none border border-white/5" />
                                    <button type="submit" className="w-full bg-white text-black font-black py-5 rounded-2xl uppercase tracking-tighter shadow-2xl hover:scale-[1.02] transition-all">+ Registrar Socio</button>
                                </form>
                            </div>
                            <div className="lg:col-span-8 cyber-panel overflow-hidden border-white/5">
                                <table className="w-full text-left text-xs"><thead className="bg-[#1a1a24] text-white uppercase font-black border-b border-white/5 tracking-widest"><tr><th className="p-6">Socio de Negocio</th><th className="p-6">Contacto Directo</th><th className="p-6">Uplink</th><th className="p-6 text-right">Borrar</th></tr></thead>
                                    <tbody className="divide-y divide-white/5">{distribuidores.map(d => (
                                        <tr key={d.id} className="hover:bg-white/10 transition-colors border-l-4 border-l-transparent hover:border-l-white"><td className="p-6 font-bold text-white uppercase italic">{d.nombre}</td><td className="p-6 opacity-70">{d.contacto}</td><td className="p-6 font-mono text-space-purple">{d.telefono}</td><td className="p-6 text-right"><button onClick={async ()=>{ if(confirm('¿Eliminar?')) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'distribuidores', d.id)); }} className="text-slate-800 hover:text-red-500 p-2"><i data-lucide="trash-2" className="w-4 h-4"></i></button></td></tr>))}</tbody>
                                </table></div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
