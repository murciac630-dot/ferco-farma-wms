<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferco Farma | Galactic WMS Cloud</title>
    
    <!-- Tailwind CSS v4 (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React y Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style type="text/tailwindcss">
        @theme {
            --color-space-purple: #7c3aed;
            --color-space-orange: #f97316;
            --color-space-bg: #020205;
            --color-space-card: rgba(15, 15, 25, 0.85);
        }

        @layer base {
            body {
                @apply bg-[#020205] text-white font-sans selection:bg-[#f97316] selection:text-white overflow-x-hidden;
            }
        }

        /* Paneles con efecto Glassmorphism Industrial */
        .cyber-panel {
            @apply bg-[rgba(15,15,25,0.75)] border border-white/10 rounded-[2rem] backdrop-blur-2xl shadow-[0_20px_50px_rgba(0,0,0,0.5)];
        }

        .btn-galactic {
            @apply px-5 py-2.5 rounded-2xl font-black text-[10px] uppercase tracking-widest transition-all border flex items-center gap-2;
        }

        /* Animación de carga tipo NASA */
        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanline {
            @apply absolute inset-0 pointer-events-none opacity-[0.03] z-50;
            background: linear-gradient(to bottom, transparent 0%, #00f3ff 50%, transparent 100%);
            animation: scan 4s linear infinite;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #020205; }
        ::-webkit-scrollbar-thumb { background: #7c3aed44; border-radius: 10px; }
    </style>
</head>
<body>
    <!-- CAPA DE FONDO: LOGO TRASLÚCIDO (Efecto NASA Station) -->
    <div class="fixed inset-0 -z-10 overflow-hidden bg-[#020205]">
        <!-- Imagen de fondo escalada y oscurecida -->
        <img 
            src="logo.jpg" 
            alt="Background Watermark" 
            class="w-full h-full object-cover opacity-20 scale-110 blur-[2px] brightness-[0.3] contrast-[1.2]"
            onerror="this.style.display = 'none';"
        />
        <!-- Overlay degradado para profundidad -->
        <div class="absolute inset-0 bg-gradient-to-b from-[#020205]/90 via-transparent to-[#020205]/95"></div>
        <div class="scanline"></div>
    </div>
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, addDoc, deleteDoc, query } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Configuración Firebase Ferco Farma
        const firebaseConfig = {
            apiKey: "AIzaSyB8Ei-GTiqedjsFy09XVujGb94mzkBmVOU",
            authDomain: "ferco-farma.firebaseapp.com",
            projectId: "ferco-farma",
            storageBucket: "ferco-farma.firebasestorage.app",
            messagingSenderId: "974529589553",
            appId: "1:974529589553:web:a2944444e7689dec514010"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "ferco-farma-wms";

        const { useState, useEffect, useMemo } = React;

        const App = () => {
            const [user, setUser] = useState(null);
            const [productos, setProductos] = useState([]);
            const [ventas, setVentas] = useState([]);
            const [distribuidores, setDistribuidores] = useState([]);
            const [view, setView] = useState('despacho');
            const [searchTerm, setSearchTerm] = useState('');
            const [carrito, setCarrito] = useState([]);
            const [loading, setLoading] = useState(true);

            const [itemActual, setItemActual] = useState({ productoId: '', nombre: '', sku: '', cantidad: '', valorUnitario: '' });
            const [datosVenta, setDatosVenta] = useState({ entidad: 'Cliente', nombreEntidad: '', tipoCliente: 'Nuevo', descuento: 0, valorDomicilio: 0, estadoTransaccion: 'Pagado' });
            const [newProduct, setNewProduct] = useState({ sku: '', nombre: '', precio: '', stockInicial: '' });
            const [newDist, setNewDist] = useState({ nombre: '', contacto: '', telefono: '', categoria: 'Principal' });

            useEffect(() => {
                const init = async () => {
                    await signInAnonymously(auth);
                    onAuthStateChanged(auth, (u) => { setUser(u); if(u) setLoading(false); });
                };
                init();
            }, []);

            useEffect(() => {
                if (!user) return;
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'productos'), (s) => setProductos(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'ventas'), (s) => setVentas(s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0))));
                onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'distribuidores'), (s) => setDistribuidores(s.docs.map(d => ({ id: d.id, ...d.data() }))));
            }, [user]);

            useEffect(() => { if (!loading && window.lucide) window.lucide.createIcons(); }, [loading, view, productos, ventas, carrito, datosVenta.entidad]);

            const inventario = useMemo(() => productos.map(p => {
                const vendidas = ventas.reduce((acc, v) => {
                    const items = v.items?.filter(i => i.productoId === p.id) || [];
                    return acc + items.reduce((s, i) => s + (parseFloat(i.cantidad) || 0), 0);
                }, 0);
                return { ...p, stockActual: (p.stockInicial || 0) - vendidas };
            }), [productos, ventas]);

            const filtrados = useMemo(() => {
                const t = searchTerm.toLowerCase().trim();
                return t && !itemActual.productoId ? inventario.filter(p => p.nombre?.toLowerCase().includes(t) || p.sku?.includes(t)) : [];
            }, [searchTerm, inventario, itemActual.productoId]);

            const totalOperacion = useMemo(() => {
                const sub = carrito.reduce((s, i) => s + i.subtotal, 0);
                return Math.max(0, sub - (datosVenta.tipoCliente === 'Preferencial' ? parseFloat(datosVenta.descuento) || 0 : 0)) + (parseFloat(datosVenta.valorDomicilio) || 0);
            }, [carrito, datosVenta]);

            if (loading) return (
                <div className="flex h-screen items-center justify-center bg-[#020205]">
                    <div className="text-white font-black italic text-xl animate-pulse tracking-tighter">ESTABLECIENDO UPLINK NASA-FERCO...</div>
                </div>
            );

            return (
                <div className="max-w-7xl mx-auto p-4 md:p-8">
                    {/* Header Principal */}
                    <header className="flex flex-col lg:flex-row justify-between items-center mb-12 gap-8 border-b border-white/5 pb-10">
                        <div className="flex flex-col md:flex-row items-center gap-6 text-center md:text-left">
                            <img 
                                src="logo.jpg" 
                                alt="Ferco Logo" 
                                className="w-24 md:w-32 h-auto rounded-2xl shadow-[0_0_30px_rgba(124,58,237,0.3)] border border-white/10"
                                onError={(e) => { e.target.style.display = 'none'; }}
                            />
                            <div>
                                <h1 className="text-4xl font-black italic tracking-tighter text-white">
                                    FERCO <span className="text-space-orange">WMS</span>
                                </h1>
                                <p className="text-[9px] uppercase tracking-[0.4em] font-black text-space-purple mt-1">PRODUCTOS CERTIFICADOS NASA</p>
                            </div>
                        </div>
                        <nav className="flex flex-wrap gap-3 justify-center">
                            <button onClick={() => setView('despacho')} className={`btn-galactic ${view==='despacho'?'bg-space-purple text-white border-white/20 shadow-[0_0_20px_#7c3aed44]':'border-white/10 text-slate-500'}`}><i data-lucide="zap" className="w-3 h-3"></i> Despachos</button>
                            <button onClick={() => setView('gestion')} className={`btn-galactic ${view==='gestion'?'bg-space-orange text-white border-white/20 shadow-[0_0_20px_#f9731644]':'border-white/10 text-slate-500'}`}><i data-lucide="package" className="w-3 h-3"></i> Inventario</button>
                            <button onClick={() => setView('distribuidores')} className={`btn-galactic ${view==='distribuidores'?'bg-white text-black border-white/20':'border-white/10 text-slate-500'}`}><i data-lucide="users" className="w-3 h-3"></i> Aliados</button>
                        </nav>
                    </header>

                    {view === 'despacho' ? (
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 animate-in fade-in duration-700">
                            <div className="lg:col-span-5 xl:col-span-4 space-y-6">
                                <div className="cyber-panel p-8 space-y-8">
                                    {/* SELECTOR DE ENTIDAD TRIPLE */}
                                    <div className="flex p-1 bg-black/40 rounded-xl border border-white/10">
                                        {['Cliente', 'Distribuidor', 'Proveedor'].map(ent => (
                                            <button key={ent} onClick={() => setDatosVenta({...datosVenta, entidad: ent})} className={`flex-1 py-2.5 rounded-lg text-[9px] font-black uppercase transition-all ${datosVenta.entidad === ent ? (ent==='Proveedor'?'bg-space-purple text-white':ent==='Distribuidor'?'bg-space-orange text-white':'bg-white text-black') : 'text-slate-600'}`}>{ent}</button>
                                        ))}
                                    </div>

                                    <div className="space-y-4">
                                        <div className="relative">
                                            <i data-lucide="search" className="absolute left-3 top-3.5 w-4 h-4 text-slate-600"></i>
                                            <input type="text" value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} placeholder="Escanear Producto..." className="w-full pl-10 pr-4 py-3.5 bg-black/50 rounded-2xl text-xs outline-none border border-white/5 focus:border-space-purple transition-all" />
                                            {filtrados.length > 0 && (
                                                <div className="absolute z-50 w-full mt-2 bg-[#101015] border border-white/20 rounded-2xl shadow-2xl max-h-48 overflow-y-auto">
                                                    {filtrados.map(p => (
                                                        <div key={p.id} onClick={()=>{ setItemActual({...itemActual, productoId:p.id, nombre:p.nombre, sku:p.sku, valorUnitario:p.precio}); setSearchTerm(p.nombre); }} className="p-4 hover:bg-space-purple/10 cursor-pointer border-b border-white/5 last:border-0"><p className="text-[10px] font-black text-space-orange">{p.sku}</p><p className="text-xs font-bold text-white">{p.nombre} ({p.stockActual})</p></div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                        <div className="grid grid-cols-2 gap-3">
                                            <input type="number" value={itemActual.cantidad} onChange={e=>setItemActual({...itemActual, cantidad:e.target.value})} placeholder="Cant." className="bg-black/50 p-3.5 rounded-2xl text-xs outline-none border border-white/5 text-white font-bold" />
                                            <input type="number" value={itemActual.valorUnitario} onChange={e=>setItemActual({...itemActual, valorUnitario:e.target.value})} placeholder="Valor" className="bg-black/50 p-3.5 rounded-2xl text-xs text-[#39ff14] outline-none border border-white/5 font-black" />
                                        </div>
                                        <button onClick={()=>{ if(!itemActual.productoId || !itemActual.cantidad) return; setCarrito([...carrito, {...itemActual, idT:Date.now(), subtotal:parseFloat(itemActual.cantidad)*parseFloat(itemActual.valorUnitario)}]); setItemActual({productoId:'',nombre:'',sku:'',cantidad:'',valorUnitario:''}); setSearchTerm(''); }} className="w-full py-3.5 bg-space-purple/10 text-space-purple border border-space-purple/30 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-space-purple hover:text-white transition-all">+ Añadir Ítem</button>
                                    </div>

                                    <form onSubmit={async (e)=>{ e.preventDefault(); if (carrito.length === 0) return; await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'ventas'), {...datosVenta, items: carrito, totalVenta: totalOperacion, timestamp: Date.now(), estado: datosVenta.entidad === 'Proveedor' ? datosVenta.estadoTransaccion : 'Pendiente', fecha: new Date().toLocaleDateString(), hora: new Date().toLocaleTimeString()}); setCarrito([]); setDatosVenta({ ...datosVenta, nombreEntidad: '', descuento: 0, valorDomicilio: 0 }); }} className="space-y-5">
                                        <input type="text" value={datosVenta.nombreEntidad} onChange={e=>setDatosVenta({...datosVenta, nombreEntidad:e.target.value})} placeholder={`Identificación de ${datosVenta.entidad}`} className="w-full p-4 bg-black/50 rounded-2xl text-xs outline-none border border-white/5 focus:border-space-orange" required />
                                        
                                        <div className="bg-black/80 p-6 rounded-[2rem] border-2 border-space-purple/30 flex justify-between items-center shadow-inner">
                                            <span className="text-[10px] font-black uppercase tracking-widest opacity-40 italic">Balance Final:</span>
                                            <span className="text-3xl font-black text-[#39ff14]">${totalOperacion.toLocaleString()}</span>
                                        </div>
                                        
                                        <button type="submit" disabled={carrito.length===0} className={`w-full text-white font-black py-5 rounded-2xl italic uppercase tracking-tighter shadow-2xl active:scale-95 transition-all disabled:opacity-20 ${datosVenta.entidad==='Proveedor' ? 'bg-space-purple' : datosVenta.entidad==='Distribuidor' ? 'bg-space-orange' : 'bg-gradient-to-br from-space-purple to-space-orange'}`}>
                                            Confirmar Despacho Cloud
                                        </button>
                                    </form>
                                </div>
                            </div>

                            <div className="lg:col-span-7 xl:col-span-8">
                                <div className="cyber-panel overflow-hidden border-white/5">
                                    <div className="p-6 border-b border-white/5 bg-white/5 font-black uppercase italic text-[10px] tracking-widest flex items-center justify-between">
                                        <span className="flex items-center gap-2"><i data-lucide="activity" className="w-4 h-4 text-space-orange"></i> Monitor Logístico</span>
                                    </div>
                                    <div className="overflow-x-auto"><table className="w-full text-left text-[10px]"><thead className="bg-black/80 text-slate-500 uppercase font-black tracking-widest border-b border-white/5"><tr><th className="p-6">Tipo</th><th className="p-6">Sujeto</th><th className="p-6">Monto</th><th className="p-6 text-center">Estado</th><th className="p-6 text-right">Anular</th></tr></thead>
                                        <tbody className="divide-y divide-white/5">{ventas.map(v => (
                                            <tr key={v.id} className="hover:bg-white/5 transition-colors border-l-4 border-l-transparent hover:border-l-space-orange">
                                                <td className="p-6"><span className={`px-2 py-1 rounded text-[8px] font-black uppercase ${v.entidad === 'Proveedor' ? 'bg-space-purple/20 text-space-purple' : v.entidad === 'Distribuidor' ? 'bg-space-orange/20 text-space-orange' : 'bg-white/10 text-white'}`}>{v.entidad}</span></td>
                                                <td className="p-6 font-black uppercase text-white truncate max-w-[120px]">{v.nombreEntidad}</td>
                                                <td className="p-6 font-black text-[#39ff14] italic text-xs">${v.totalVenta.toLocaleString()}</td>
                                                <td className="p-6 text-center"><span className={`px-4 py-1.5 rounded-xl border text-[8px] font-black uppercase ${v.estado === 'Pagado' ? 'text-[#39ff14] border-[#39ff14]/30' : 'text-space-orange border-space-orange/30'}`}>{v.estado}</span></td>
                                                <td className="p-6 text-right"><button onClick={async ()=>{ if(confirm('¿Anular registro?')) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'ventas', v.id)); }} className="text-slate-800 hover:text-red-500 transition-colors"><i data-lucide="trash-2" className="w-4 h-4"></i></button></td>
                                            </tr>))}</tbody>
                                    </table></div>
                                </div>
                            </div>
                        </div>
                    ) : view === 'gestion' ? (
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-10 animate-in fade-in duration-500">
                            <div className="lg:col-span-4 cyber-panel p-8 border-space-orange/30">
                                <h2 className="text-xl font-black mb-8 italic uppercase text-white border-l-4 border-space-purple pl-4">Vincular SKU</h2>
                                <form onSubmit={async (e)=>{ e.preventDefault(); await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'productos'), { sku: newProduct.sku, nombre: newProduct.nombre, precio: parseFloat(newProduct.precio) || 0, stockInicial: parseInt(newProduct.stockInicial) || 0 }); setNewProduct({sku:'',nombre:'',precio:'',stockInicial:''}); }} className="space-y-5">
                                    <input value={newProduct.sku} onChange={e=>setNewProduct({...newProduct, sku:e.target.value})} placeholder="SKU" className="w-full p-4 bg-black/50 rounded-2xl text-xs outline-none border border-white/5 focus:border-space-purple text-white font-bold uppercase" required />
                                    <input value={newProduct.nombre} onChange={e=>setNewProduct({...newProduct, nombre:e.target.value})} placeholder="Nombre" className="w-full p-4 bg-black/50 rounded-2xl text-xs outline-none border border-white/5 focus:border-space-purple text-white font-bold" required />
                                    <div className="grid grid-cols-2 gap-4">
                                        <input type="number" value={newProduct.precio} onChange={e=>setNewProduct({...newProduct, precio:e.target.value})} placeholder="Precio" className="bg-black/50 p-4 rounded-2xl text-xs outline-none border border-white/5" required />
                                        <input type="number" value={newProduct.stockInicial} onChange={e=>setNewProduct({...newProduct, stockInicial:e.target.value})} placeholder="Stock" className="bg-black/50 p-4 rounded-2xl text-xs outline-none border border-white/5" required />
                                    </div>
                                    <button type="submit" className="w-full bg-space-orange text-white font-black py-5 rounded-2xl uppercase tracking-tighter shadow-2xl">+ Inyectar Cloud Master</button>
                                </form>
                            </div>
                            <div className="lg:col-span-8 cyber-panel overflow-hidden">
                                <table className="w-full text-left text-xs"><thead className="bg-black/50 text-slate-500 uppercase font-black tracking-widest border-b border-white/5"><tr><th className="p-6">SKU</th><th className="p-6">Producto</th><th className="p-6">Balance</th><th className="p-6 text-right">Borrar</th></tr></thead>
                                    <tbody className="divide-y divide-white/5">{inventario.map(p => (
                                        <tr key={p.id} className="hover:bg-space-purple/5 transition-colors"><td className="p-6 font-mono font-bold text-space-purple uppercase tracking-tighter">{p.sku}</td><td className="p-6 font-bold text-white uppercase italic">{p.nombre}</td><td className={`p-6 font-black ${p.stockActual < 10 ? 'text-space-orange animate-pulse' : 'text-[#39ff14]'}`}>{p.stockActual} UNIDADES</td><td className="p-6 text-right"><button onClick={async ()=>{ if(confirm('¿Eliminar?')) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'productos', p.id)); }} className="text-slate-800 hover:text-red-500 p-2"><i data-lucide="trash-2" className="w-5 h-5"></i></button></td></tr>))}</tbody>
                                </table></div>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-10 animate-in fade-in duration-500">
                            <div className="lg:col-span-4 cyber-panel p-8 border-white/20">
                                <h2 className="text-xl font-black mb-8 italic uppercase text-white border-l-4 border-white pl-4">Aliado Estratégico</h2>
                                <form onSubmit={async (e)=>{ e.preventDefault(); await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'distribuidores'), {...newDist, timestamp: Date.now()}); setNewDist({nombre:'',contacto:'',telefono:'',categoria:'Principal'}); }} className="space-y-5">
                                    <input value={newDist.nombre} onChange={e=>setNewDist({...newDist, nombre:e.target.value})} placeholder="Nombre / Razón Social" className="w-full p-4 bg-black/50 rounded-2xl text-xs outline-none border border-white/5 focus:border-white text-white font-bold" required />
                                    <input value={newDist.contacto} onChange={e=>setNewDist({...newDist, contacto:e.target.value})} placeholder="Persona de Contacto" className="w-full p-4 bg-black/50 rounded-2xl text-xs outline-none border border-white/5" />
                                    <input value={newDist.telefono} onChange={e=>setNewDist({...newDist, telefono:e.target.value})} placeholder="Teléfono" className="w-full p-4 bg-black/50 rounded-2xl text-xs outline-none border border-white/5" />
                                    <button type="submit" className="w-full bg-white text-black font-black py-5 rounded-2xl uppercase tracking-tighter">+ Registrar en Nube</button>
                                </form>
                            </div>
                            <div className="lg:col-span-8 cyber-panel overflow-hidden">
                                <table className="w-full text-left text-xs"><thead className="bg-black/50 text-slate-500 uppercase font-black tracking-widest border-b border-white/5"><tr><th className="p-6">Compañía</th><th className="p-6">Contacto</th><th className="p-6">Teléfono</th><th className="p-6 text-right">Acción</th></tr></thead>
                                    <tbody className="divide-y divide-white/5">{distribuidores.map(d => (
                                        <tr key={d.id} className="hover:bg-white/10 transition-colors"><td className="p-6 font-bold text-white uppercase italic">{d.nombre}</td><td className="p-6 opacity-70">{d.contacto}</td><td className="p-6 font-mono text-space-purple">{d.telefono}</td><td className="p-6 text-right"><button onClick={async ()=>{ if(confirm('¿Eliminar?')) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'distribuidores', d.id)); }} className="text-slate-800 hover:text-red-500 p-2"><i data-lucide="trash-2" className="w-4 h-4"></i></button></td></tr>))}</tbody>
                                </table></div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
