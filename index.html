<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FERCO FARMA | REGISTROS DE BODEGA v20.0</title>
    
    <!-- Motores de Estilo y UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- React y Dependencias de Datos -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Motores de Gráficos, Excel y Encriptación AES -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-apexcharts@1.4.1/dist/react-apexcharts.iife.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'space-purple': '#9333ea',
                        'space-orange': '#f97316',
                        'space-bg': '#020206',
                        'cyber-green': '#39ff14',

                    }
                }
            }
        }
    </script>

    <style type="text/css">
        body { background-color: #020206; color: white; margin: 0; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        #bg-nasa { z-index: 0; position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
        #root { z-index: 10; position: relative; min-height: 100vh; }

        .glass-panel { 
            background: rgba(10, 10, 18, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            backdrop-filter: blur(40px);
        }

        .btn-primary-nasa {
            width: 100%;
            background: linear-gradient(135deg, #9333ea 0%, #f97316 100%);
            color: white;
            font-weight: 900;
            padding: 1.25rem;
            border-radius: 0.75rem;
            text-transform: uppercase;
            font-style: italic;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 25px rgba(147, 51, 234, 0.3);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-primary-nasa:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(249, 115, 22, 0.5); border-color: white; }

        .scanline {
            position: fixed; inset: 0; pointer-events: none; opacity: 0.015; z-index: 50;
            background: linear-gradient(to bottom, transparent 0%, #9333ea 50%, transparent 100%);
            animation: scan 12s linear infinite;
        }
        @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #020206; }
        ::-webkit-scrollbar-thumb { background: #9333ea; border-radius: 10px; }

        .selectable-list { max-height: 200px; overflow-y: auto; border-radius: 0.75rem; background: rgba(0,0,0,0.9); border: 1px solid rgba(255,255,255,0.1); margin-top: 4px; position: absolute; width: 100%; z-index: 100; backdrop-filter: blur(10px); }
        .selectable-item { padding: 12px; font-size: 11px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.2s; text-transform: uppercase; font-weight: bold; color: white; }
        .selectable-item:hover { background: rgba(147, 51, 234, 0.4); color: #39ff14; }
        
        .hades-card { background: repeating-linear-gradient(45deg, #000, #000 10px, #1a1a24 10px, #1a1a24 20px); border: 1px solid #ffd70033; }
        .table-container { scrollbar-width: thin; scrollbar-color: #9333ea transparent; }
    </style>
</head>
<body>
    <div id="bg-nasa">
        <img src="logo.jpg" alt="Logo" style="width: 100%; height: 100%; object-fit: cover; opacity: 0.07; filter: blur(2px) brightness(0.3);" onerror="this.style.display='none';" />
        <div style="position: absolute; inset: 0; background: radial-gradient(circle at center, transparent 0%, #020206 90%);"></div>
        <div class="scanline"></div>
    </div>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        // REQUERIMIENTO: Importar métodos oficiales para autenticación segura de Firebase
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, addDoc, deleteDoc, query, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB8Ei-GTiqedjsFy09XVujGb94mzkBmVOU",
            authDomain: "ferco-farma.firebaseapp.com",
            projectId: "ferco-farma",
            storageBucket: "ferco-farma.firebasestorage.app",
            messagingSenderId: "974529589553",
            appId: "1:974529589553:web:a2944444e7689dec514010"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "ferco-farma-wms";

        const { useState, useEffect, useMemo, useRef } = React;
        const ReactApexChart = window.ReactApexCharts ? (window.ReactApexCharts.default || window.ReactApexCharts) : null;

        // --- ENCRIPTACIÓN simétrica (AES-256) ---
        const encryptVal = (val, key) => {
            if (val === undefined || val === null || val === '') return '';
            return CryptoJS.AES.encrypt(String(val), key).toString();
        };

        const decryptVal = (cipher, key, isNumeric = false) => {
            if (cipher === undefined || cipher === null || cipher === '') return isNumeric ? 0 : '';
            if (!key) return isNumeric ? (parseFloat(cipher) || 0) : String(cipher);
            try {
                if (typeof cipher !== 'string') return isNumeric ? (parseFloat(cipher) || 0) : cipher;
                const bytes = CryptoJS.AES.decrypt(cipher, key);
                const decrypted = bytes.toString(CryptoJS.enc.Utf8);
                if (decrypted !== '') return isNumeric ? (parseFloat(decrypted) || 0) : decrypted;
            } catch (e) {}
            return isNumeric ? (parseFloat(cipher) || 0) : String(cipher);
        };

        // REQUERIMIENTO: Normalizador de Categorías para evitar "Productos Fantasma" en base de datos
        const normalizarCategoria = (cat) => {
            if (!cat) return 'Producto Final';
            const clean = cat.trim().toLowerCase();
            if (clean.includes('final')) return 'Producto Final';
            if (clean.includes('insumo')) return 'Insumo';
            if (clean.includes('empaque')) return 'Empaque';
            return 'Producto Final'; // Fallback por defecto seguro
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [productos, setProductos] = useState([]);
            const [ventas, setVentas] = useState([]);
            const [sujetos, setSujetos] = useState([]);
            const [view, setView] = useState('dashboard');
            const [loading, setLoading] = useState(true);
            const [isSyncing, setIsSyncing] = useState(false);
            
            // Criptografía y Estados de Bóveda
            const [vaultKey, setVaultKey] = useState('');
            const [isVaultLocked, setIsVaultLocked] = useState(true);
            const [vaultAuthDoc, setVaultAuthDoc] = useState(null);
            
            // REQUERIMIENTO: Campos del formulario de Login con Firebase Auth + Clave Maestra
            const [loginEmail, setLoginEmail] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [inputKey, setInputKey] = useState('');
            const [vaultError, setVaultError] = useState('');

            // Notification State reactiva a errores
            const [notificacion, setNotificacion] = useState({ show: false, mensaje: '', tipo: 'success' });

            // Refs para archivos masivos
            const fileInvRef = useRef(null);
            const fileDespRef = useRef(null);
            const fileSujRef = useRef(null);

            // POS / Despacho States
            const [editingVentaId, setEditingVentaId] = useState(null);
            const [oldItems, setOldItems] = useState([]); 
            const [carrito, setCarrito] = useState([]);
            const [pagos, setPagos] = useState([]);
            const [itemActual, setItemActual] = useState({ productoId: '', sku: '', nombre: '', cantidad: 1, valorUnitario: 0, fraccion: 1 });
            const [metodoActual, setMetodoActual] = useState({ metodo: 'Efectivo', monto: '', fechaPago: '', comentario: '' });
            const [datosVenta, setDatosVenta] = useState({ 
                entidad: 'Cliente', nombreEntidad: '', entregaDomicilio: false, domiciliarioAsignado: 'Cris', 
                valorDomicilio: 0, canal: 'Ferco Farma', descontarStockHades: true, aplicarDescuento: false, valorDescuento: 0, 
                cuentaDestino: 'CRIS'
            });

            // UI Dropdown States
            const [showProductList, setShowProductList] = useState(false);
            const [showSubjectList, setShowSubjectList] = useState(false);

            // Modal Cartera State
            const [saldarModal, setSaldarModal] = useState({
                show: false, venta: null, nuevoMetodo: 'Efectivo', montoEfectivo: '', fechaEfectiva: '', observacionCierre: ''
            });

            // Management States
            const [newProduct, setNewProduct] = useState({ id: null, sku: '', nombre: '', precioCosto: '', precioCliente: '', precioSocio: '', stockInicial: '', categoria: 'Producto Final' });
            const [newSujeto, setNewSujeto] = useState({ id: null, nombre: '', tipo: 'Cliente', telefono: '' });

            const staffDomi = ['Cris', 'Pipe', 'Valentino', 'Jhon', 'Delivery App'];

            // Sincronización del estado de autenticación
            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    if (u) {
                        setLoading(false);
                    } else {
                        setIsVaultLocked(true);
                        setVaultKey('');
                        setLoading(false);
                    }
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubProd = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'productos'), (s) => setProductos(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubVentas = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'ventas'), (s) => setVentas(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubSujetos = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'sujetos'), (s) => setSujetos(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubVaultAuth = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'vault_control'), (snap) => {
                    const docAuth = snap.docs.find(d => d.id === 'auth');
                    if (docAuth) setVaultAuthDoc({ id: docAuth.id, ...docAuth.data() });
                    else setVaultAuthDoc(null);
                });
                return () => { unsubProd(); unsubVentas(); unsubSujetos(); unsubVaultAuth(); };
            }, [user]);

            const mostrarNotificacion = (mensaje, tipo = 'success') => {
                setNotificacion({ show: true, mensaje, tipo });
                setTimeout(() => setNotificacion({ show: false, mensaje: '', tipo: 'success' }), 4500);
            };

            // --- DECRYPTION IN MEMORY (TOLERANCIA A DATOS HEREDADOS Y SANEAMIENTO DE GHOSTS) ---
            const decryptedProductos = useMemo(() => {
                if (isVaultLocked || !vaultKey) return [];
                return productos.map(p => {
                    const catNorm = normalizarCategoria(p.categoria); // Sanitizar categoría en la lectura
                    return {
                        id: p.id, 
                        sku: p.sku || 'SIN-SKU', 
                        categoria: catNorm, 
                        stockActual: p.stockActual !== undefined ? p.stockActual : 0, 
                        stockInicial: p.stockInicial !== undefined ? p.stockInicial : 0,
                        nombre: decryptVal(p.nombre, vaultKey) || 'PRODUCTO DESCONOCIDO',
                        precioCosto: decryptVal(p.precioCosto, vaultKey, true),
                        precioCliente: decryptVal(p.precioCliente, vaultKey, true),
                        precioSocio: decryptVal(p.precioSocio, vaultKey, true)
                    };
                });
            }, [productos, isVaultLocked, vaultKey]);

            const decryptedVentas = useMemo(() => {
                if (isVaultLocked || !vaultKey) return [];
                return ventas.map(v => {
                    let decItems = []; let decPagos = []; let decSplit = { ferco: 0, hades: 0 };
                    if (v.items) {
                        if (Array.isArray(v.items)) decItems = v.items;
                        else {
                            try { const str = decryptVal(v.items, vaultKey); if (str) decItems = JSON.parse(str); } 
                            catch(e) { try { decItems = JSON.parse(v.items); } catch(err) {} }
                        }
                    }
                    if (v.pagos) {
                        if (Array.isArray(v.pagos)) decPagos = v.pagos;
                        else {
                            try { const str = decryptVal(v.pagos, vaultKey); if (str) decPagos = JSON.parse(str); } 
                            catch(e) { try { decPagos = JSON.parse(v.pagos); } catch(err) {} }
                        }
                    }
                    if (v.split) {
                        if (typeof v.split === 'object' && !v.split.ciphertext) decSplit = v.split;
                        else {
                            try { const str = decryptVal(v.split, vaultKey); if (str) decSplit = JSON.parse(str); } 
                            catch(e) { if (typeof v.split === 'object') decSplit = v.split; }
                        }
                    }
                    return {
                        id: v.id, entidad: v.entidad, canal: v.canal, estado: v.estado, cuentaDestino: v.cuentaDestino, timestamp: v.timestamp, fecha: v.fecha, hora: v.hora,
                        nombreEntidad: decryptVal(v.nombreEntidad, vaultKey),
                        responsable: decryptVal(v.responsable, vaultKey),
                        totalVenta: decryptVal(v.totalVenta, vaultKey, true),
                        items: decItems, pagos: decPagos, split: decSplit
                    };
                }).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
            }, [ventas, isVaultLocked, vaultKey]);

            const decryptedSujetos = useMemo(() => {
                if (isVaultLocked || !vaultKey) return [];
                return sujetos.map(s => ({
                    id: s.id, tipo: s.tipo,
                    nombre: decryptVal(s.nombre, vaultKey),
                    telefono: decryptVal(s.telefono, vaultKey)
                }));
            }, [sujetos, isVaultLocked, vaultKey]);

            // --- REFACTORIZACIÓN INVENTARIO ESTÁTICO (O(1) LECTURA) CON ORDEN NUMÉRICO NATURAL ASCENDENTE ---
            const inventarioActualizado = useMemo(() => {
                return [...decryptedProductos].sort((a, b) => {
                    const numA = parseInt(a.sku?.match(/\d+/)?.[0] || 0, 10);
                    const numB = parseInt(b.sku?.match(/\d+/)?.[0] || 0, 10);
                    if (numA !== numB) return numA - numB;
                    return (a.sku || '').localeCompare(b.sku || '');
                });
            }, [decryptedProductos]);

            // --- CONTROLES GENERALES DE CÁLCULO ---
            const totalOp = useMemo(() => {
                const sub = carrito.reduce((s, i) => s + (parseFloat(i.cantidad) * i.fraccion * parseFloat(i.valorUnitario) || 0), 0);
                const desc = (datosVenta.entidad === 'Cliente' && datosVenta.aplicarDescuento) ? (parseFloat(datosVenta.valorDescuento) || 0) : 0;
                const dom = (datosVenta.entregaDomicilio) ? (parseFloat(datosVenta.valorDomicilio) || 0) : 0;
                return Math.max(0, sub - desc) + dom;
            }, [carrito, datosVenta]);

            const totalAbonado = useMemo(() => pagos.reduce((s, p) => s + (parseFloat(p.monto) || 0), 0), [pagos]);

            const hadesSplit = useMemo(() => {
                if (datosVenta.canal !== 'Hades' || carrito.length === 0) return { ferco: 0, hades: 0 };
                let fercoShare = 0; let hadesShare = 0;
                carrito.forEach(it => {
                    const p = inventarioActualizado.find(x => x.id === it.productoId);
                    const costoSocioTotal = (p?.precioSocio || 0) * it.cantidad * it.fraccion;
                    const ventaTotalHades = it.valorUnitario * it.cantidad * it.fraccion;
                    fercoShare += costoSocioTotal;
                    hadesShare += (ventaTotalHades - costoSocioTotal);
                });
                const dom = datosVenta.entregaDomicilio ? (parseFloat(datosVenta.valorDomicilio) || 0) : 0;
                return { ferco: fercoShare + dom, hades: hadesShare };
            }, [carrito, datosVenta, inventarioActualizado]);

            const metrics = useMemo(() => {
                const res = decryptedVentas.reduce((acc, v) => {
                    const val = parseFloat(v.totalVenta) || 0;
                    if (v.entidad === 'Cliente') acc.cli += val;
                    else if (v.entidad === 'Distribuidor') acc.dist += val;
                    else if (v.entidad === 'Proveedor') acc.prov += val;
                    return acc;
                }, { cli: 0, dist: 0, prov: 0 });
                const valorBodega = inventarioActualizado.reduce((s,p) => s + ((parseFloat(p.stockActual) || 0) * (parseFloat(p.precioCosto) || 0)), 0);
                return { ...res, valorBodega, bajos: inventarioActualizado.filter(p => p.stockActual < 10).length };
            }, [decryptedVentas, inventarioActualizado]);

            const rankingClientes = useMemo(() => {
                const stats = decryptedVentas.filter(v => v.entidad === 'Cliente' && v.nombreEntidad).reduce((acc, v) => {
                    const id = v.nombreEntidad.toUpperCase();
                    if (!acc[id]) acc[id] = { nombre: v.nombreEntidad, count: 0, total: 0 };
                    acc[id].count += 1;
                    acc[id].total += parseFloat(v.totalVenta) || 0;
                    return acc;
                }, {});
                return Object.values(stats).sort((a,b) => b.total - a.total).slice(0, 5);
            }, [decryptedVentas]);

            // --- AUTO-LLENAR NOMBRE DE PRODUCTO EN DESPACHOS AL COINCIDIR SKU ---
            useEffect(() => {
                const term = itemActual.sku.trim().toUpperCase();
                if (term.length > 1) {
                    const p = inventarioActualizado.find(x => x.sku.toUpperCase() === term);
                    if (p && !itemActual.productoId) {
                        let v = 0;
                        if (datosVenta.entidad === 'Proveedor') v = p.precioCosto || 0;
                        else if (datosVenta.entidad === 'Distribuidor' || datosVenta.canal === 'Hades') v = p.precioSocio || 0;
                        else v = p.precioCliente || 0;
                        setItemActual(prev => ({ ...prev, productoId: p.id, nombre: p.nombre, valorUnitario: v }));
                    }
                }
            }, [itemActual.sku, datosVenta.entidad, datosVenta.canal, inventarioActualizado]);

            // --- AUTO-LLENAR CAMPOS EN INVENTARIO CUANDO SE SELECCIONA/ESCRIBE SKU EXISTENTE ---
            useEffect(() => {
                const skuTerm = newProduct.sku.trim().toUpperCase();
                if (skuTerm.length > 0) {
                    const p = inventarioActualizado.find(x => x.sku.toUpperCase() === skuTerm);
                    if (p && (!newProduct.id || newProduct.id !== p.id)) {
                        setNewProduct({
                            id: p.id,
                            sku: p.sku,
                            nombre: p.nombre,
                            precioCosto: p.precioCosto,
                            precioCliente: p.precioCliente,
                            precioSocio: p.precioSocio,
                            stockInicial: p.stockInicial,
                            categoria: p.categoria
                        });
                    }
                }
            }, [newProduct.sku, inventarioActualizado]);

            // --- AUTO-GENERACIÓN DE SKU AL ESCRIBIR NOMBRE EN INVENTARIO ---
            const handleNewProductNameChange = (nombreVal) => {
                let skuVal = newProduct.sku;
                if (!newProduct.id && (!newProduct.sku || newProduct.sku.trim() === '')) {
                    skuVal = getNextSKU(newProduct.categoria);
                }
                setNewProduct(prev => ({
                    ...prev,
                    nombre: nombreVal,
                    sku: skuVal
                }));
            };

            // Recalcular SKU al cambiar de categoría si es un producto nuevo
            const handleCategoryChange = (cat) => {
                let skuVal = newProduct.sku;
                if (!newProduct.id && (!newProduct.sku || newProduct.sku.startsWith('PFNASA-') || newProduct.sku.startsWith('INASA-') || newProduct.sku.startsWith('ENASA-') || newProduct.sku.trim() === '')) {
                    skuVal = getNextSKU(cat);
                }
                setNewProduct(prev => ({
                    ...prev,
                    categoria: cat,
                    sku: skuVal
                }));
            };

            // --- REQUERIMIENTO MAESTRO: INICIO DE SESIÓN INTEGRADO CON CONTRASEÑA EN FIREBASE + DESBLOQUEO CRIPTOGRÁFICO ---
            const handleUnlockVault = async (e) => {
                e.preventDefault();
                if (!loginEmail || !loginPassword || !inputKey) return;
                try {
                    // 1. Validar la cuenta del empleado en la nube de Google
                    const userCredential = await signInWithEmailAndPassword(auth, loginEmail, loginPassword);
                    const authenticatedUser = userCredential.user;

                    if (!vaultAuthDoc) {
                        // Crear token criptográfico inicial de forma excepcional
                        const verificationToken = encryptVal("FERCO_VAULT_ACTIVE", inputKey);
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'vault_control', 'auth'), {
                            token: verificationToken
                        });
                        setVaultKey(inputKey);
                        setIsVaultLocked(false);
                        mostrarNotificacion("Bóveda e inicio de sesión configurado correctamente.");
                    } else {
                        // 2. Validar que la Clave Maestra sea capaz de descifrar el token AES-256
                        const decryptedCheck = decryptVal(vaultAuthDoc.token, inputKey);
                        if (decryptedCheck === 'FERCO_VAULT_ACTIVE') {
                            setVaultKey(inputKey);
                            setIsVaultLocked(false);
                            setVaultError('');
                            mostrarNotificacion(`Uplink Seguro: ${authenticatedUser.email}`);
                        } else {
                            // Si la Clave Maestra falla, desconectamos Firebase por seguridad inmediata
                            await signOut(auth);
                            setVaultError("⚠️ Clave Maestra Incorrecta. Acceso bloqueado.");
                        }
                    }
                } catch (err) {
                    console.error("Error de Login:", err);
                    setVaultError("⚠️ Credenciales inválidas o falla de conexión con Google Cloud.");
                }
            };

            const handleSignOut = async () => {
                await signOut(auth);
                setIsVaultLocked(true);
                setVaultKey('');
                setLoginEmail('');
                setLoginPassword('');
                setInputKey('');
            };

            const selectProduct = (p) => {
                let v = 0;
                if (datosVenta.entidad === 'Proveedor') v = p.precioCosto || 0;
                else if (datosVenta.entidad === 'Distribuidor' || datosVenta.canal === 'Hades') v = p.precioSocio || 0;
                else v = p.precioCliente || 0;
                setItemActual({ ...itemActual, productoId: p.id, sku: p.sku, nombre: p.nombre, valorUnitario: v });
                setShowProductList(false);
            };

            const selectSubject = (s) => {
                setDatosVenta({...datosVenta, nombreEntidad: s.nombre});
                setShowSubjectList(false);
            };

            // --- CARGAR REGISTRO DE DESPACHO PARA EDICIÓN ---
            const iniciarEdicionDespacho = (v) => {
                setEditingVentaId(v.id);
                setCarrito(v.items || []);
                setOldItems(JSON.parse(JSON.stringify(v.items || []))); 
                setDatosVenta({
                    entidad: v.entidad || 'Cliente',
                    nombreEntidad: v.nombreEntidad || '',
                    canal: v.canal || 'Ferco Farma',
                    cuentaDestino: v.cuentaDestino || 'CRIS',
                    entregaDomicilio: v.entregaDomicilio || false,
                    valorDomicilio: v.valorDomicilio || 0,
                    domiciarioAsignado: v.domiciliarioAsignado || 'Cris',
                    aplicarDescuento: v.aplicarDescuento || false,
                    valorDescuento: v.valorDescuento || 0,
                    descontarStockHades: v.descontarStockHades !== undefined ? v.descontarStockHades : true
                });
                mostrarNotificacion(`Cargando despacho de ${v.nombreEntidad} para modificación.`);
            };

            // --- REGISTRO Y RE-CÁLCULO ATÓMICO NETO DE STOCK ---
            const registrarOActualizarDespacho = async (e) => {
                e.preventDefault();
                if (carrito.length === 0 || (totalAbonado < totalOp && datosVenta.entidad !== 'Proveedor')) return;
                
                try {
                    const tieneMetodosCredito = pagos.some(p => ['Crédito', 'Cruce', 'Artículo en Garantía'].includes(p.metodo));
                    const estadoInicial = tieneMetodosCredito ? 'Pendiente' : 'Pagado';

                    // REQUERIMIENTO DE AUDITORÍA: El "responsable" se inyecta cifrado con el Email autenticado real
                    const dataPayload = {
                        entidad: datosVenta.entidad, canal: datosVenta.canal, cuentaDestino: datosVenta.cuentaDestino,
                        nombreEntidad: encryptVal(datosVenta.nombreEntidad, vaultKey),
                        responsable: encryptVal(user ? user.email : 'CRIS_ADMIN', vaultKey),
                        totalVenta: encryptVal(totalOp, vaultKey),
                        items: encryptVal(JSON.stringify(carrito), vaultKey),
                        pagos: encryptVal(JSON.stringify(pagos), vaultKey),
                        split: encryptVal(JSON.stringify(hadesSplit), vaultKey)
                    };

                    if (editingVentaId) {
                        const netChanges = {};
                        
                        // Revertir items antiguos
                        oldItems.forEach(it => {
                            const pid = it.productoId;
                            const cant = parseFloat(it.cantidad) * (it.fraccion || 1);
                            if (!netChanges[pid]) netChanges[pid] = 0;
                            netChanges[pid] += datosVenta.entidad === 'Proveedor' ? -cant : cant;
                        });

                        // Aplicar los nuevos items
                        carrito.forEach(it => {
                            const pid = it.productoId;
                            const cant = parseFloat(it.cantidad) * (it.fraccion || 1);
                            if (!netChanges[pid]) netChanges[pid] = 0;
                            netChanges[pid] += datosVenta.entidad === 'Proveedor' ? cant : -cant;
                        });

                        // Sincronización transaccional de stock
                        for (const pid of Object.keys(netChanges)) {
                            const diff = netChanges[pid];
                            if (diff === 0) continue;

                            const pRef = doc(db, 'artifacts', appId, 'public', 'data', 'productos', pid);
                            const pData = inventarioActualizado.find(x => x.id === pid);
                            if (pData) {
                                const stockPrev = parseFloat(pData.stockActual) || 0;
                                await updateDoc(pRef, { stockActual: stockPrev + diff });
                            }
                        }

                        const ref = doc(db, 'artifacts', appId, 'public', 'data', 'ventas', editingVentaId);
                        await updateDoc(ref, {
                            ...dataPayload,
                            estado: estadoInicial,
                            auditLog: `MODIFICADO: ${user ? user.email : 'Admin'} el ${new Date().toLocaleDateString()}`
                        });

                        setEditingVentaId(null);
                        setOldItems([]);
                        mostrarNotificacion("Registro de despacho actualizado de forma segura.");
                    } else {
                        // Inyección de documento nuevo
                        const ahora = new Date();
                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'ventas'), {
                            ...dataPayload, 
                            estado: estadoInicial, 
                            timestamp: Date.now(),
                            fecha: ahora.toLocaleDateString(), hora: ahora.toLocaleTimeString(),
                            auditLog: `OP: ${user ? user.email : 'Admin'} | CANAL: ${datosVenta.canal}`
                        });

                        if (datosVenta.descontarStockHades || datosVenta.canal === 'Ferco Farma') {
                            for (const it of carrito) {
                                const pRef = doc(db, 'artifacts', appId, 'public', 'data', 'productos', it.productoId);
                                const pData = inventarioActualizado.find(x => x.id === it.productoId);
                                if (pData) {
                                    const stockPrev = parseFloat(pData.stockActual) || 0;
                                    const cambio = parseFloat(it.cantidad) * it.fraccion;
                                    const nuevoStock = datosVenta.entidad === 'Proveedor' ? (stockPrev + cambio) : (stockPrev - cambio);
                                    await updateDoc(pRef, { stockActual: nuevoStock });
                                }
                            }
                        }
                        mostrarNotificacion("Operación de despacho inyectada con éxito.");
                    }

                    setCarrito([]); setPagos([]);
                    setDatosVenta(prev => ({ ...prev, entidad: 'Cliente', nombreEntidad: '', entregaDomicilio: false, valorDomicilio: 0, canal: 'Ferco Farma', descontarStockHades: true, aplicarDescuento: false, valorDescuento: 0, cuentaDestino: 'CRIS' }));
                } catch (err) { mostrarNotificacion("Falla de enlace de datos cloud.", "error"); }
            };

            const getNextSKU = (cat, tempProductosList) => {
                const prefixMap = { 'Producto Final': 'PFNASA-', 'Insumo': 'INASA-', 'Empaque': 'ENASA-' };
                const prefix = prefixMap[cat] || 'PFNASA-';
                const listToScan = tempProductosList || inventarioActualizado;
                const nums = listToScan.filter(p => p.sku?.startsWith(prefix)).map(p => {
                    const m = p.sku.match(/\d+/);
                    return m ? parseInt(m[0], 10) : 0;
                });
                const next = Math.max(0, ...nums) + 1;
                return `${prefix}${String(next).padStart(3, '0')}`;
            };

            const uploadTemplate = (type) => downloadTemplate(type);
            
            // REQUERIMIENTO: Plantillas inteligentes con datos reales del catálogo para edición fluida
            const downloadTemplate = (type) => {
                let data = [];
                if (type === 'INVENTARIO') {
                    if (inventarioActualizado.length > 0) {
                        data = inventarioActualizado.map(p => ({

                            Precio_Cliente: p.precioCliente, Precio_Socio: p.precioSocio, Stock: p.stockActual

                    }
                }
                if (type === 'SUJETOS') {
                    if (decryptedSujetos.length > 0) {
                        data = decryptedSujetos.map(s => ({ Nombre: s.nombre, Tipo: s.tipo, Telefono: s.telefono }));
                    } else {
                        data = [{ Nombre: "JUAN PEREZ", Tipo: "Cliente", Telefono: "300123456" }];

                }
                if (type === 'DESPACHOS') {
                    if (decryptedVentas.length > 0) {
                        data = [];
                        decryptedVentas.forEach(v => {
                            (v.items || []).forEach(it => {
                                data.push({
                                    Fecha: v.fecha, Hora: v.hora, Sujeto: v.nombreEntidad, Tipo_Sujeto: v.entidad, Canal: v.canal,
                                    SKU: it.sku, Cantidad: it.cantidad, Valor_Uni: it.valorUnitario, Total: v.totalVenta,
                                    Metodo: v.pagos?.map(p => p.metodo).join(', ') || 'Efectivo',
                                    Obs: v.pagos?.map(p => p.comentario).filter(Boolean).join(' | ') || '',
                                    Cuenta_Ingreso: v.cuentaDestino || 'CRIS', Estado: v.estado || 'Pagado'
                                });
                            });
                        });
                    } else {
                        data = [{ Fecha: "15/05/2026", Hora: "09:00:00", Sujeto: "JUAN PEREZ", Tipo_Sujeto: "Cliente", Canal: "Ferco Farma", SKU: "PFNASA-001", Cantidad: 1, Valor_Uni: 1500, Total: 1500, Metodo: "Efectivo", Obs: "Carga", Cuenta_Ingreso: "CRIS", Estado: "Pendiente" }];
                    }
                }
                const ws = XLSX.utils.json_to_sheet(data); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Plantilla"); XLSX.writeFile(wb, `PLANTILLA_${type}.xlsx`);
            };
            const exportarPlantilla = () => downloadTemplate('INVENTARIO');

            const exportarVentas = () => {
                const ws = XLSX.utils.json_to_sheet(decryptedVentas.map(v => ({ ID: v.id, FECHA: v.fecha, HORA: v.hora, CANAL: v.canal, TIPO: v.entidad, SUJETO: v.nombreEntidad, CUENTA_INGRESO: v.cuentaDestino || 'CRIS', STATUS: v.estado, TOTAL: v.totalVenta })));
                const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Log"); XLSX.writeFile(wb, `FERCO_FINANCE_REPORT_${Date.now()}.xlsx`);
            };

            if (loading) return <div className="flex h-screen items-center justify-center bg-[#020206] text-space-purple font-black animate-pulse">Central FERCO FARMA Activo...</div>;

            // --- PORTAL CRYPTO LOCK + FORMULARIO DE ACCESO MULTI-USUARIO ---
            if (isVaultLocked) {
                return (
                    <div className="flex h-screen items-center justify-center bg-[#020206] p-4 text-white font-sans relative">
                        <div className="scanline"></div>
                        <div className="glass-panel max-w-md w-full p-8 space-y-6 border border-[#9333ea]/30 text-center shadow-[0_0_50px_rgba(147,51,234,0.15)] animate-in fade-in duration-300">

                                <div className="p-4 bg-space-purple/10 rounded-full border border-space-purple/20 animate-pulse"><i data-lucide="shield-alert" className="w-12 h-12 text-space-purple"></i></div>
                            </div>
                            <div>
                                <h2 className="text-xl font-black uppercase text-white tracking-tighter italic">{!vaultAuthDoc ? "ESTABLECER ACCESOS" : "PORTAL DE ACCESO SEGURO"}</h2>
                                <p className="text-[9px] uppercase tracking-widest text-slate-500 font-bold mt-1">
                                    {!vaultAuthDoc ? "Defina la clave maestra de encriptación de datos" : "Escriba sus credenciales de Google y la clave maestra"}
                                </p>
                            </div>
                            <form onSubmit={handleUnlockVault} className="space-y-4">
                                <input type="email" value={loginEmail} onChange={e => setLoginEmail(e.target.value)} placeholder="CORREO CORPORATIVO..." className="w-full p-3 bg-black/60 rounded-xl text-xs font-bold border border-white/10 text-center text-white placeholder-slate-700 outline-none" required />
                                <input type="password" value={loginPassword} onChange={e => setLoginPassword(e.target.value)} placeholder="CONTRASEÑA..." className="w-full p-3 bg-black/60 rounded-xl text-xs font-bold border border-white/10 text-center text-white placeholder-slate-700 outline-none" required />
                                <input type="password" value={inputKey} onChange={e => setInputKey(e.target.value)} placeholder="CLAVE MAESTRA BODEGA..." className="w-full p-3 bg-black/60 rounded-xl text-xs font-black border border-[#9333ea]/30 text-center text-[#39ff14] placeholder-slate-700 outline-none" required />
                                {vaultError && <p className="text-[10px] text-red-500 font-black uppercase">{vaultError}</p>}
                                <button type="submit" className="btn-primary-nasa text-xs tracking-widest uppercase italic font-black">Autenticar y Desbloquear</button>
                            </form>
                        </div>
                    </div>
                );

            return (

                                <form onSubmit={ejecutarSaldadoDespacho} className="space-y-4">

                    {/* Navigation Header */}

                    {view === 'dashboard' ? (

                                        {showSubjectList && (

                            <div className="lg:col-span-4 glass-panel p-8 border-white/10 shadow-2xl">
                                <h2 className="text-lg font-black mb-8 italic uppercase border-l-4 border-white pl-4 text-white tracking-widest">{newSujeto.id ? 'MODIFICAR SUJETO' : 'Directorio Maestro'}</h2>
                                <form onSubmit={async (e)=>{ e.preventDefault(); if(newSujeto.id) { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sujetos', newSujeto.id), { nombre: encryptVal(newSujeto.nombre.toUpperCase(), vaultKey), tipo: newSujeto.tipo, telefono: encryptVal(newSujeto.telefono, vaultKey) }); } else { await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'sujetos'), { nombre: encryptVal(newSujeto.nombre.toUpperCase(), vaultKey), tipo: newSujeto.tipo, telefono: encryptVal(newSujeto.telefono, vaultKey), timestamp: Date.now() }); } setNewSujeto({id:null, nombre:'', tipo:'Cliente', telefono:''}); mostrarNotificacion("Directorio Sincronizado."); }} className="space-y-6"><div className="grid grid-cols-3 gap-1.5 p-1.5 bg-black/40 rounded-xl border border-white/10 shadow-inner">{['Cliente', 'Proveedor', 'Distribuidor'].map(t => <button key={t} type="button" onClick={()=>setNewSujeto({...newSujeto, tipo:t})} className={`py-3 rounded-lg text-[8px] font-black uppercase transition-all ${newSujeto.tipo===t?'bg-white text-black shadow-xl':'text-slate-600'}`}>{t}</button>)}</div><input value={newSujeto.nombre} onChange={e=>setNewSujeto({...newSujeto, nombre:e.target.value})} placeholder="NOMBRE / ENTIDAD" className="w-full p-4 bg-black/60 rounded-xl text-xs font-black border border-white/5 outline-none uppercase" required /><input value={newSujeto.telefono} onChange={e=>setNewSujeto({...newSujeto, telefono:e.target.value})} placeholder="TELÉFONO / UPLINK" className="w-full p-4 bg-[#1a1a24] rounded-xl text-xs font-black border border-white/5 outline-none shadow-inner" /><button type="submit" className="w-full bg-white text-black font-black py-4 rounded-xl uppercase text-xs tracking-widest italic font-black">REGISTRAR SUJETO</button>{newSujeto.id && (<button type="button" onClick={() => setNewSujeto({ id: null, nombre: '', tipo: 'Cliente', telefono: '' })} className="w-full mt-2 bg-slate-800 text-white font-black py-2.5 rounded-xl uppercase text-[10px] border border-white/10 hover:bg-slate-700 italic">Cancelar</button>)}</form>
                                <div className="mt-8 pt-8 border-t border-white/5 space-y-4"><h3 className="text-[10px] font-black uppercase text-cyber-green italic text-center tracking-widest">ACTUALIZACION MASIVA</h3><input type="file" ref={fileSujRef} onChange={(e) => uploadExcel(e, 'SUJETOS')} className="hidden" accept=".xlsx, .xls, .csv" /><div className="grid grid-cols-2 gap-2"><button onClick={() => fileSujRef.current.click()} className="py-3 bg-cyber-green/10 border border-cyber-green/40 rounded-xl font-black uppercase text-[8px] text-cyber-green hover:bg-cyber-green hover:text-black transition-all">CARGAR ARCHIVO</button><button onClick={() => downloadTemplate('SUJETOS')} className="py-3 bg-white/5 border border-white/10 rounded-xl font-black uppercase text-[8px] text-white hover:bg-white/10 transition-all">PLANTILLA</button></div></div>
                            </div>
                            <div className="lg:col-span-8 glass-panel overflow-hidden h-[800px] flex flex-col border-white/5 text-white shadow-xl"><div className="p-6 bg-white/5 font-black uppercase text-[10px] border-b border-white/5 flex justify-between items-center"><span>Base de Datos Aliados</span><span className="opacity-40 italic font-mono">{sujetos.length} Registros</span></div><div className="overflow-x-auto flex-1 table-container"><table className="w-full text-left text-xs"><thead className="bg-[#101018] text-slate-500 uppercase font-black sticky top-0"><tr><th className="p-6 py-4 text-white">Tipo</th><th className="p-6 py-4 text-white font-white">Nombre de Entidad</th><th className="p-6 py-4 text-right text-white">ELIMINAR</th></tr></thead><tbody className="divide-y divide-white/5">{decryptedSujetos.map(s => (<tr key={s.id} className="hover:bg-white/10 font-black uppercase italic transition-all group border-l-4 border-l-transparent hover:border-l-space-purple"><td className="p-6"><span className={`px-3 py-1 rounded-md text-[7px] font-black border ${s.tipo==='Cliente'?'text-cyber-green border-cyber-green/30':s.tipo==='Proveedor'?'text-space-orange border-space-orange/30':'text-space-purple border-space-purple/30'}`}>{s.tipo}</span></td><td className="p-6 text-[11px] font-bold uppercase">{s.nombre}</td><td className="p-6 text-right flex justify-end gap-3 opacity-30 group-hover:opacity-100"><button onClick={()=>setNewSujeto({id:s.id, nombre:s.nombre, tipo:s.tipo, telefono:s.telefono})} className="text-blue-400 hover:scale-125 transition-all p-1"><i data-lucide="edit-3"></i></button><button onClick={async ()=>{ if(confirm('¿Anular?')) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sujetos', s.id)); }} className="text-red-500 hover:scale-125 transition-all p-1"><i data-lucide="trash-2"></i></button></td></tr>))}</tbody></table></div></div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        
        onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'productos'), () => {
             setTimeout(() => { if(window.lucide) lucide.createIcons(); }, 500);
        });
    </script>
</body>
</html>
