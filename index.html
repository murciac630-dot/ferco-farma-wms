        <!-- Indicador de carga nativo -->

    <!-- PASO 1: Descarga Nativa de Firebase (Evita bloqueos de GitHub Pages) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, addDoc, deleteDoc, query, updateDoc, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        window.FercoFirebase = {
            initializeApp, getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
            getFirestore, collection, doc, setDoc, onSnapshot, addDoc, deleteDoc, query, updateDoc, writeBatch, getDocs
        };
        // Notificamos a React que todo está listo
        window.dispatchEvent(new Event('firebase-listo'));
    </script>

    <!-- PASO 2: Motor React Puro (Sin type="module" conflictivo) -->
    <script type="text/babel">
        window.addEventListener('firebase-listo', () => {
            try {
                // Recuperamos las herramientas de la memoria
                const { initializeApp, getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, getFirestore, collection, doc, setDoc, onSnapshot, addDoc, deleteDoc, query, updateDoc, writeBatch, getDocs } = window.FercoFirebase;

                const firebaseConfig = {
                    apiKey: "AIzaSyB8Ei-GTiqedjsFy09XVujGb94mzkBmVOU",
                    authDomain: "ferco-farma.firebaseapp.com",
                    projectId: "ferco-farma",
                    storageBucket: "ferco-farma.firebasestorage.app",
                    messagingSenderId: "974529589553",
                    appId: "1:974529589553:web:a2944444e7689dec514010"
                };

                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const db = getFirestore(app);
                const appId = "ferco-farma-wms";

                const { useState, useEffect, useMemo, useRef } = React;
                const ReactApexChart = window.ReactApexCharts ? (window.ReactApexCharts.default || window.ReactApexCharts) : null;

                const encryptVal = (val, key) => {
                    if (val === undefined || val === null || val === '') return '';
                    return CryptoJS.AES.encrypt(String(val), key).toString();
                };

                const decryptVal = (cipher, key, isNumeric = false) => {
                    if (cipher === undefined || cipher === null || cipher === '') return isNumeric ? 0 : '';
                    if (!key) return isNumeric ? (parseFloat(cipher) || 0) : String(cipher);
                    try {
                        if (typeof cipher !== 'string') return isNumeric ? (parseFloat(cipher) || 0) : cipher;
                        const bytes = CryptoJS.AES.decrypt(cipher, key);
                        const decrypted = bytes.toString(CryptoJS.enc.Utf8);
                        if (decrypted !== '') return isNumeric ? (parseFloat(decrypted) || 0) : decrypted;
                    } catch (e) {}
                    return isNumeric ? (parseFloat(cipher) || 0) : String(cipher);
                };

                const normalizarCategoria = (cat) => {
                    if (!cat) return 'Producto Final';
                    const clean = cat.trim().toLowerCase();
                    if (clean.includes('final')) return 'Producto Final';
                    if (clean.includes('insumo')) return 'Insumo';
                    if (clean.includes('empaque')) return 'Empaque';
                    return 'Producto Final';
                };

                // ESCUDO DE ERRORES REACT
                class ErrorBoundary extends React.Component {
                    constructor(props) { super(props); this.state = { hasError: false, error: null }; }
                    static getDerivedStateFromError(error) { return { hasError: true, error }; }
                    render() {
                        if (this.state.hasError) {
                            return (
                                <div className="min-h-screen flex items-center justify-center p-6 text-center">
                                    <div className="glass-panel p-8 max-w-lg w-full border-red-500/30">
                                        <div className="text-red-500 mb-4 flex justify-center"><i data-lucide="alert-octagon" className="w-16 h-16"></i></div>
                                        <h2 className="text-xl font-black text-red-500 mb-2 uppercase">Error de Motor React</h2>
                                        <p className="text-xs text-slate-400 font-mono bg-black/50 p-4 rounded-xl text-left overflow-auto">{this.state.error?.toString()}</p>
                                        <button onClick={() => window.location.reload()} className="mt-6 w-full py-3 bg-red-500/20 text-red-500 font-black uppercase rounded-xl hover:bg-red-500 hover:text-white transition-all">Reiniciar Sistema</button>
                                    </div>
                                </div>
                            );
                        }
                        return this.props.children;
                    }
                }

                const App = () => {
                    const [user, setUser] = useState(null);
                    const [productos, setProductos] = useState([]);
                    const [ventas, setVentas] = useState([]);
                    const [sujetos, setSujetos] = useState([]);
                    const [caja, setCaja] = useState([]);
                    const [view, setView] = useState('dashboard');
                    const [loading, setLoading] = useState(true);
                    const [isSyncing, setIsSyncing] = useState(false);
                    
                    const [vaultKey, setVaultKey] = useState('');
                    const [isVaultLocked, setIsVaultLocked] = useState(true);
                    const [vaultAuthDoc, setVaultAuthDoc] = useState(null);
                    
                    const [loginEmail, setLoginEmail] = useState('');
                    const [loginPassword, setLoginPassword] = useState('');
                    const [inputKey, setInputKey] = useState('');
                    const [vaultError, setVaultError] = useState('');

                    const [notificacion, setNotificacion] = useState({ show: false, mensaje: '', tipo: 'success' });

                    const fileInvRef = useRef(null);
                    const fileDespRef = useRef(null);
                    const fileSujRef = useRef(null);

                    const [editingVentaId, setEditingVentaId] = useState(null);
                    const [oldItems, setOldItems] = useState([]); 
                    const [carrito, setCarrito] = useState([]);
                    const [pagos, setPagos] = useState([]);
                    const [itemActual, setItemActual] = useState({ productoId: '', sku: '', nombre: '', cantidad: 1, valorUnitario: 0, fraccion: 1, descontarStock: true });
                    const [metodoActual, setMetodoActual] = useState({ metodo: 'Efectivo', monto: '', fechaPago: '', comentario: '' });
                    const [datosVenta, setDatosVenta] = useState({ 
                        entidad: 'Cliente', nombreEntidad: '', entregaDomicilio: false, domiciliarioAsignado: 'Pipe', 
                        valorDomicilio: 0, canal: 'Ferco Farma', aplicarDescuento: false, valorDescuento: 0, 
                        cuentaDestino: 'CRIS'
                    });

                    const [showProductList, setShowProductList] = useState(false);
                    const [showSubjectList, setShowSubjectList] = useState(false);

                    const [saldarModal, setSaldarModal] = useState({
                        show: false, venta: null, nuevoMetodo: 'Efectivo', montoEfectivo: '', fechaEfectiva: '', observacionCierre: ''
                    });

                    const [newProduct, setNewProduct] = useState({ id: null, sku: '', nombre: '', precioCosto: '', precioCliente: '', precioSocio: '', stockInicial: '', categoria: 'Producto Final' });
                    const [newSujeto, setNewSujeto] = useState({ id: null, nombre: '', tipo: 'Cliente', telefono: '' });
                    
                    const [newMovCaja, setNewMovCaja] = useState({ id: null, tipo: 'Egreso', concepto: '', valor: '', metodo: 'Efectivo', banco: '' });

                    const staffDomi = ['Pipe', 'Havith', 'Valentino Rossi', 'Mono', 'Cris', 'JF', 'Delivery App'];

                    useEffect(() => {
                        const unsubscribe = onAuthStateChanged(auth, (u) => {
                            setUser(u);
                            if (u) {
                                setLoading(false);
                            } else {
                                setIsVaultLocked(true);
                                setVaultKey('');
                                setLoading(false);
                            }
                        });
                        return () => unsubscribe();
                    }, []);

                    useEffect(() => {
                        if (!user) return;
                        const unsubProd = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'productos'), (s) => setProductos(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                        const unsubVentas = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'ventas'), (s) => setVentas(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                        const unsubSujetos = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'sujetos'), (s) => setSujetos(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                        const unsubCaja = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'movimientos_caja'), (s) => setCaja(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                        const unsubVaultAuth = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'vault_control'), (snap) => {
                            const docAuth = snap.docs.find(d => d.id === 'auth');
                            if (docAuth) setVaultAuthDoc({ id: docAuth.id, ...docAuth.data() });
                            else setVaultAuthDoc(null);
                        });
                        return () => { unsubProd(); unsubVentas(); unsubSujetos(); unsubCaja(); unsubVaultAuth(); };
                    }, [user]);

                    const mostrarNotificacion = (mensaje, tipo = 'success') => {
                        setNotificacion({ show: true, mensaje, tipo });
                        setTimeout(() => setNotificacion({ show: false, mensaje: '', tipo: 'success' }), 4500);
                    };

                    const decryptedProductos = useMemo(() => {
                        if (isVaultLocked || !vaultKey) return [];
                        return productos.map(p => {
                            const catNorm = normalizarCategoria(p.categoria); 
                            return {
                                id: p.id, 
                                sku: p.sku || 'SIN-SKU', 
                                categoria: catNorm, 
                                stockActual: p.stockActual !== undefined ? p.stockActual : 0, 
                                stockInicial: p.stockInicial !== undefined ? p.stockInicial : 0,
                                nombre: decryptVal(p.nombre, vaultKey) || 'PRODUCTO DESCONOCIDO',
                                precioCosto: decryptVal(p.precioCosto, vaultKey, true),
                                precioCliente: decryptVal(p.precioCliente, vaultKey, true),
                                precioSocio: decryptVal(p.precioSocio, vaultKey, true)
                            };
                        });
                    }, [productos, isVaultLocked, vaultKey]);

                    const decryptedVentas = useMemo(() => {
                        if (isVaultLocked || !vaultKey) return [];
                        return ventas.map(v => {
                            let decItems = []; let decPagos = []; let decSplit = { ferco: 0, hades: 0 };
                            if (v.items) {
                                if (Array.isArray(v.items)) decItems = v.items;
                                else {
                                    try { const str = decryptVal(v.items, vaultKey); if (str) decItems = JSON.parse(str); } 
                                    catch(e) { try { decItems = JSON.parse(v.items); } catch(err) {} }
                                }
                            }
                            if (v.pagos) {
                                if (Array.isArray(v.pagos)) decPagos = v.pagos;
                                else {
                                    try { const str = decryptVal(v.pagos, vaultKey); if (str) decPagos = JSON.parse(str); } 
                                    catch(e) { try { decPagos = JSON.parse(v.pagos); } catch(err) {} }
                                }
                            }
                            if (v.split) {
                                if (typeof v.split === 'object' && !v.split.ciphertext) decSplit = v.split;
                                else {
                                    try { const str = decryptVal(v.split, vaultKey); if (str) decSplit = JSON.parse(str); } 
                                    catch(e) { if (typeof v.split === 'object') decSplit = v.split; }
                                }
                            }
                            return {
                                id: v.id, entidad: v.entidad, canal: v.canal, estado: v.estado, cuentaDestino: v.cuentaDestino, timestamp: v.timestamp, fecha: v.fecha, hora: v.hora,
                                nombreEntidad: decryptVal(v.nombreEntidad, vaultKey),
                                responsable: decryptVal(v.responsable, vaultKey),
                                totalVenta: decryptVal(v.totalVenta, vaultKey, true),
                                items: decItems, pagos: decPagos, split: decSplit
                            };
                        }).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
                    }, [ventas, isVaultLocked, vaultKey]);

                    const decryptedSujetos = useMemo(() => {
                        if (isVaultLocked || !vaultKey) return [];
                        return sujetos.map(s => ({
                            id: s.id, tipo: s.tipo,
                            nombre: decryptVal(s.nombre, vaultKey),
                            telefono: decryptVal(s.telefono, vaultKey)
                        }));
                    }, [sujetos, isVaultLocked, vaultKey]);

                    const decryptedCaja = useMemo(() => {
                        if (isVaultLocked || !vaultKey) return [];
                        return caja.map(m => ({
                            id: m.id,
                            tipo: m.tipo,
                            timestamp: m.timestamp,
                            metodo: m.metodo || 'Efectivo',
                            concepto: decryptVal(m.concepto, vaultKey),
                            valor: decryptVal(m.valor, vaultKey, true),
                            responsable: decryptVal(m.responsable, vaultKey),
                            banco: decryptVal(m.banco, vaultKey)
                        })).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
                    }, [caja, isVaultLocked, vaultKey]);

                    const inventarioActualizado = useMemo(() => {
                        return [...decryptedProductos].sort((a, b) => {
                            const numA = parseInt(a.sku?.match(/\d+/)?.[0] || 0, 10);
                            const numB = parseInt(b.sku?.match(/\d+/)?.[0] || 0, 10);
                            if (numA !== numB) return numA - numB;
                            return (a.sku || '').localeCompare(b.sku || '');
                        });
                    }, [decryptedProductos]);

                    const getNextSKU = (tempProductosList) => {
                        const prefix = 'NASA-';
                        const listToScan = tempProductosList || inventarioActualizado;
                        const nums = listToScan.filter(p => p.sku?.startsWith(prefix)).map(p => { const m = p.sku.match(/\d+/); return m ? parseInt(m[0], 10) : 0; });
                        const maxNum = nums.length > 0 ? Math.max(...nums) : 0;
                        return `${prefix}${String(maxNum + 1).padStart(3, '0')}`;
                    };

                    const totalOp = useMemo(() => {
                        const sub = carrito.reduce((s, i) => s + (parseFloat(i.cantidad) * i.fraccion * parseFloat(i.valorUnitario) || 0), 0);
                        const desc = (datosVenta.entidad === 'Cliente' && datosVenta.aplicarDescuento) ? (parseFloat(datosVenta.valorDescuento) || 0) : 0;
                        const dom = (datosVenta.entregaDomicilio) ? (parseFloat(datosVenta.valorDomicilio) || 0) : 0;
                        return Math.max(0, sub - desc) + dom;
                    }, [carrito, datosVenta]);

                    const totalAbonado = useMemo(() => pagos.reduce((s, p) => s + (parseFloat(p.monto) || 0), 0), [pagos]);

                    const hadesSplit = useMemo(() => {
                        if (datosVenta.canal !== 'Hades' || carrito.length === 0) return { ferco: 0, hades: 0 };
                        let fercoShare = 0; let hadesShare = 0;
                        
                        carrito.forEach(it => {
                            const p = inventarioActualizado.find(x => x.id === it.productoId);
                            const costoSocioTotal = (p?.precioSocio || 0) * parseFloat(it.cantidad) * it.fraccion;
                            const ventaTotalHades = parseFloat(it.valorUnitario) * parseFloat(it.cantidad) * it.fraccion;
                            
                            if (it.descontarStock !== false) {
                                fercoShare += costoSocioTotal;
                                hadesShare += (ventaTotalHades - costoSocioTotal);
                            } else {
                                hadesShare += ventaTotalHades;
                            }
                        });
                        
                        const dom = datosVenta.entregaDomicilio ? (parseFloat(datosVenta.valorDomicilio) || 0) : 0;
                        return { ferco: fercoShare + dom, hades: hadesShare };
                    }, [carrito, datosVenta, inventarioActualizado]);

                    const metrics = useMemo(() => {
                        const res = decryptedVentas.reduce((acc, v) => {
                            const val = parseFloat(v.totalVenta) || 0;
                            if (v.entidad === 'Cliente') acc.cli += val;
                            else if (v.entidad === 'Distribuidor') acc.dist += val;
                            else if (v.entidad === 'Proveedor') acc.prov += val;
                            return acc;
                        }, { cli: 0, dist: 0, prov: 0 });
                        const valorBodega = inventarioActualizado.reduce((s,p) => s + ((parseFloat(p.stockActual) || 0) * (parseFloat(p.precioCosto) || 0)), 0);
                        return { ...res, valorBodega, bajos: inventarioActualizado.filter(p => p.stockActual < 10).length };
                    }, [decryptedVentas, inventarioActualizado]);

                    const rankingClientes = useMemo(() => {
                        const stats = decryptedVentas.filter(v => v.entidad === 'Cliente' && v.nombreEntidad).reduce((acc, v) => {
                            const id = v.nombreEntidad.toUpperCase();
                            if (!acc[id]) acc[id] = { nombre: v.nombreEntidad, count: 0, total: 0 };
                            acc[id].count += 1;
                            acc[id].total += parseFloat(v.totalVenta) || 0;
                            return acc;
                        }, {});
                        return Object.values(stats).sort((a,b) => b.total - a.total).slice(0, 5);
                    }, [decryptedVentas]);

                    const cajaMetrics = useMemo(() => {
                        let ingresos = 0; let egresos = 0;
                        let efectivo = 0; let totalBancos = 0;
                        const bancosDetalle = {};

                        decryptedCaja.forEach(m => {
                            const val = parseFloat(m.valor) || 0;
                            const esIngreso = m.tipo === 'Ingreso';
                            const multiplicador = esIngreso ? 1 : -1;

                            if(esIngreso) ingresos += val;
                            else egresos += val;

                            if (m.metodo === 'Efectivo') {
                                efectivo += (val * multiplicador);
                            } else if (m.metodo === 'Banco') {
                                totalBancos += (val * multiplicador);
                                const nombreBanco = m.banco ? m.banco.toUpperCase() : 'OTROS BANCOS';
                                if (!bancosDetalle[nombreBanco]) bancosDetalle[nombreBanco] = 0;
                                bancosDetalle[nombreBanco] += (val * multiplicador);
                            }
                        });
                        return { ingresos, egresos, balance: ingresos - egresos, efectivo, totalBancos, bancosDetalle };
                    }, [decryptedCaja]);

                    useEffect(() => {
                        const term = itemActual.sku.trim().toUpperCase();
                        if (term.length > 1) {
                            const p = inventarioActualizado.find(x => x.sku.toUpperCase() === term);
                            if (p && !itemActual.productoId) {
                                let v = 0;
                                if (datosVenta.entidad === 'Proveedor') v = p.precioCosto || 0;
                                else if (datosVenta.entidad === 'Distribuidor' || datosVenta.canal === 'Hades') v = p.precioSocio || 0;
                                else v = p.precioCliente || 0;
                                setItemActual(prev => ({ ...prev, productoId: p.id, nombre: p.nombre, valorUnitario: v }));
                            }
                        }
                    }, [itemActual.sku, datosVenta.entidad, datosVenta.canal, inventarioActualizado]);

                    useEffect(() => {
                        const skuTerm = newProduct.sku.trim().toUpperCase();
                        if (skuTerm.length > 0) {
                            const p = inventarioActualizado.find(x => x.sku.toUpperCase() === skuTerm);
                            if (p && (!newProduct.id || newProduct.id !== p.id)) {

                                                        <th className="p-3 md:p-6 py-3 md:py-4 text-right text-white whitespace-nowrap">Valor</th>
                                                        <th className="p-3 md:p-6 py-3 md:py-4 text-right text-white whitespace-nowrap">Acción</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-white/5">
                                                    {decryptedCaja.map(m => {
                                                        const d = new Date(m.timestamp);
                                                        return (
                                                        <tr key={m.id} className="hover:bg-white/10 font-black uppercase italic transition-all group border-l-4 border-l-transparent hover:border-l-space-purple">
                                                            <td className="p-3 md:p-6 opacity-60 text-[9px] leading-tight whitespace-nowrap">
                                                                {d.toLocaleDateString()} {d.toLocaleTimeString()}<br/>
                                                                <span className="text-space-purple font-bold">OP: {m.responsable ? m.responsable.split('@')[0] : 'Admin'}</span>
                                                            </td>
                                                            <td className="p-3 md:p-6 text-[10px]">
                                                                {m.concepto}<br/>
                                                                <span className={`text-[8px] px-1.5 py-0.5 rounded border inline-block mt-1 ${m.metodo === 'Banco' ? 'text-[#00f3ff] border-[#00f3ff]/30 bg-[#00f3ff]/10' : 'text-slate-300 border-slate-500/30 bg-slate-500/10'}`}>
                                                                    {m.metodo === 'Banco' ? `🏦 ${m.banco}` : '💵 EFECTIVO'}
                                                                </span>
                                                            </td>
                                                            <td className={`p-3 md:p-6 text-right font-mono text-sm whitespace-nowrap ${m.tipo === 'Ingreso' ? 'text-cyber-green' : 'text-red-500'}`}>
                                                                {m.tipo === 'Ingreso' ? '+' : '-'} ${(parseFloat(m.valor) || 0).toLocaleString()}
                                                            </td>
                                                            <td className="p-3 md:p-6 text-right flex justify-end gap-3 md:opacity-30 group-hover:opacity-100 whitespace-nowrap">
                                                                <button onClick={()=>setNewMovCaja({id:m.id, tipo:m.tipo, concepto:m.concepto, valor:m.valor, metodo:m.metodo, banco:m.banco})} className="text-blue-400 hover:scale-125 transition-all p-2"><i data-lucide="edit-3" className="w-4 h-4"></i></button>
                                                                <button onClick={async ()=>{ if(confirm('¿Eliminar registro de caja?')) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'movimientos_caja', m.id)); }} className="text-red-500 hover:scale-125 transition-all p-2"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                                            </td>
                                                        </tr>
                                                    )})}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 animate-in fade-in duration-500 text-white">
                                    <div className="lg:col-span-4 glass-panel p-4 md:p-8 border-white/10 shadow-2xl">
                                        <h2 className="text-lg font-black mb-8 italic uppercase border-l-4 border-white pl-4 text-white tracking-widest">{newSujeto.id ? 'MODIFICAR SUJETO' : 'Directorio Maestro'}</h2>
                                        <form onSubmit={async (e)=>{ e.preventDefault(); if(newSujeto.id) { await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sujetos', newSujeto.id), { nombre: encryptVal(newSujeto.nombre.toUpperCase(), vaultKey), tipo: newSujeto.tipo, telefono: encryptVal(newSujeto.telefono, vaultKey) }); } else { await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'sujetos'), { nombre: encryptVal(newSujeto.nombre.toUpperCase(), vaultKey), tipo: newSujeto.tipo, telefono: encryptVal(newSujeto.telefono, vaultKey), timestamp: Date.now() }); } setNewSujeto({id:null, nombre:'', tipo:'Cliente', telefono:''}); mostrarNotificacion("Directorio Sincronizado."); }} className="space-y-6"><div className="grid grid-cols-1 sm:grid-cols-3 gap-1.5 p-1.5 bg-black/40 rounded-xl border border-white/10 shadow-inner">{['Cliente', 'Proveedor', 'Distribuidor'].map(t => <button key={t} type="button" onClick={()=>setNewSujeto({...newSujeto, tipo:t})} className={`py-3 rounded-lg text-[8px] font-black uppercase transition-all ${newSujeto.tipo===t?'bg-white text-black shadow-xl':'text-slate-600'}`}>{t}</button>)}</div><input value={newSujeto.nombre} onChange={e=>setNewSujeto({...newSujeto, nombre:e.target.value})} placeholder="NOMBRE / ENTIDAD" className="w-full p-4 bg-black/60 rounded-xl text-xs font-black border border-white/5 outline-none uppercase" required /><input value={newSujeto.telefono} onChange={e=>setNewSujeto({...newSujeto, telefono:e.target.value})} placeholder="TELÉFONO / UPLINK" className="w-full p-4 bg-[#1a1a24] rounded-xl text-xs font-black border border-white/5 outline-none shadow-inner" /><button type="submit" className="w-full bg-white text-black font-black py-4 rounded-xl uppercase text-xs tracking-widest italic font-black w-full">REGISTRAR SUJETO</button>{newSujeto.id && (<button type="button" onClick={() => setNewSujeto({ id: null, nombre: '', tipo: 'Cliente', telefono: '' })} className="w-full mt-2 bg-slate-800 text-white font-black py-2.5 rounded-xl uppercase text-[10px] border border-white/10 hover:bg-slate-700 italic w-full">Cancelar</button>)}</form>
                                        <div className="mt-8 pt-8 border-t border-white/5 space-y-4"><h3 className="text-[10px] font-black uppercase text-cyber-green italic text-center tracking-widest">CONCILIAR DIRECTORIO</h3><input type="file" ref={fileSujRef} onChange={(e) => uploadExcel(e, 'SUJETOS')} className="hidden" accept=".xlsx, .xls, .csv" /><div className="grid grid-cols-2 gap-2"><button type="button" onClick={() => { if(fileSujRef.current) fileSujRef.current.click(); }} className="py-3 bg-cyber-green/10 border border-cyber-green/40 rounded-xl font-black uppercase text-[8px] text-cyber-green hover:bg-cyber-green hover:text-black transition-all">Subir y Sincronizar</button><button onClick={() => downloadTemplate('SUJETOS')} className="py-3 bg-white/5 border border-white/10 rounded-xl font-black uppercase text-[8px] text-white hover:bg-white/10 transition-all">Plantilla Smart</button></div></div>
                                    </div>
                                    <div className="lg:col-span-8 glass-panel overflow-hidden h-[600px] lg:h-[800px] flex flex-col border-white/5 text-white shadow-xl"><div className="p-4 md:p-6 bg-white/5 font-black uppercase text-[10px] border-b border-white/5 flex justify-between items-center"><span>Base de Datos Aliados</span><span className="opacity-40 italic font-mono">{sujetos.length} Registros</span></div><div className="overflow-x-auto flex-1 table-container"><table className="w-full text-left text-xs min-w-[400px]"><thead className="bg-[#101018] text-slate-500 uppercase font-black sticky top-0"><tr><th className="p-3 md:p-6 py-3 md:py-4 text-white whitespace-nowrap">Tipo</th><th className="p-3 md:p-6 py-3 md:py-4 text-white font-white">Nombre de Entidad</th><th className="p-3 md:p-6 py-3 md:py-4 text-right text-white whitespace-nowrap">ELIMINAR</th></tr></thead><tbody className="divide-y divide-white/5">{decryptedSujetos.map(s => (<tr key={s.id} className="hover:bg-white/10 font-black uppercase italic transition-all group border-l-4 border-l-transparent hover:border-l-space-purple"><td className="p-3 md:p-6 whitespace-nowrap"><span className={`px-3 py-1 rounded-md text-[7px] font-black border ${s.tipo==='Cliente'?'text-cyber-green border-cyber-green/30':s.tipo==='Proveedor'?'text-space-orange border-space-orange/30':'text-space-purple border-space-purple/30'}`}>{s.tipo}</span></td><td className="p-3 md:p-6 text-[11px] font-bold uppercase truncate max-w-[150px]">{s.nombre}</td><td className="p-3 md:p-6 text-right flex justify-end gap-3 md:opacity-30 group-hover:opacity-100 whitespace-nowrap"><button onClick={()=>setNewSujeto({id:s.id, nombre:s.nombre, tipo:s.tipo, telefono:s.telefono})} className="text-blue-400 hover:scale-125 transition-all p-2"><i data-lucide="edit-3" className="w-4 h-4"></i></button><button onClick={async ()=>{ if(confirm('¿Anular?')) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sujetos', s.id)); }} className="text-red-500 hover:scale-125 transition-all p-2"><i data-lucide="trash-2" className="w-4 h-4"></i></button></td></tr>))}</tbody></table></div></div>
                                </div>
                            )}
                        </div>
                    );
                };

                const root = ReactDOM.createRoot(document.getElementById('root'));
                // Renderizado protegido por el Escudo de Errores
                root.render(<ErrorBoundary><App /></ErrorBoundary>);
                
                setTimeout(() => { if(window.lucide) window.lucide.createIcons(); }, 1000);

            } catch (e) {
                // Este bloque atrapa si Firebase o alguna variable global falla desde la línea 1
                const root = document.getElementById('root');
                if (root) {
                    root.innerHTML = `<div style="display:flex;height:100vh;align-items:center;justify-content:center;color:#ff5a5a;font-family:sans-serif;padding:20px;text-align:center;background:#020206;"><div><h2 style="font-size:24px;font-weight:900;margin-bottom:10px;">FALLO CRÍTICO DE SISTEMA</h2><p style="color:#9b8ec2;font-family:monospace;font-size:12px;">${e.message}</p></div></div>`;
                }
            }
        });

        // En caso de que el evento no dispare (ej. bloqueadores de red severos), mostramos el fallo
        setTimeout(() => {
            if (!window.FercoFirebase) {
                const root = document.getElementById('root');
                if(root && root.innerHTML.includes('Inicializando Motores')) {
                    root.innerHTML = `<div style="display:flex;height:100vh;align-items:center;justify-content:center;color:#ff5a5a;font-family:sans-serif;padding:20px;text-align:center;background:#020206;"><div><h2 style="font-size:24px;font-weight:900;margin-bottom:10px;">FALLO DE RED</h2><p style="color:#9b8ec2;font-size:14px;">No se pudieron descargar los módulos de Google Firebase.<br>Revisa tu conexión a internet o desactiva tu bloqueador de anuncios (AdBlock).</p></div></div>`;
                }
            }
        }, 8000);
    </script>
</body>
</html>
