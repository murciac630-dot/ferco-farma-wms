<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FERCO FARMA | REGISTROS DE BODEGA v17.4</title>
    
    <!-- Motores de Estilo y UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- React y Dependencias de Datos -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Motores de Gráficos y Excel -->
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-apexcharts@1.4.1/dist/react-apexcharts.iife.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'space-purple': '#9333ea',
                        'space-orange': '#f97316',
                        'space-bg': '#020206',
                        'cyber-green': '#39ff14',
                        'hades-gold': '#ffd700'
                    }
                }
            }
        }
    </script>

    <style type="text/css">
        body { background-color: #020206; color: white; margin: 0; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        #bg-nasa { z-index: 0; position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
        #root { z-index: 10; position: relative; min-height: 100vh; }

        .glass-panel { 
            background: rgba(10, 10, 18, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            backdrop-filter: blur(40px);
        }

        .btn-primary-nasa {
            width: 100%;
            background: linear-gradient(135deg, #9333ea 0%, #f97316 100%);
            color: white;
            font-weight: 900;
            padding: 1.25rem;
            border-radius: 0.75rem;
            text-transform: uppercase;
            font-style: italic;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 25px rgba(147, 51, 234, 0.3);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-primary-nasa:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(249, 115, 22, 0.5); border-color: white; }

        .scanline {
            position: fixed; inset: 0; pointer-events: none; opacity: 0.015; z-index: 50;
            background: linear-gradient(to bottom, transparent 0%, #9333ea 50%, transparent 100%);
            animation: scan 12s linear infinite;
        }
        @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #020206; }
        ::-webkit-scrollbar-thumb { background: #9333ea; border-radius: 10px; }

        .selectable-list { max-height: 200px; overflow-y: auto; border-radius: 0.75rem; background: rgba(0,0,0,0.85); border: 1px solid rgba(255,255,255,0.1); margin-top: 4px; position: absolute; width: 100%; z-index: 100; backdrop-filter: blur(10px); }
        .selectable-item { padding: 12px; font-size: 11px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.2s; text-transform: uppercase; font-weight: bold; color: white; }
        .selectable-item:hover { background: rgba(147, 51, 234, 0.4); color: #39ff14; }
        
        .hades-card { background: repeating-linear-gradient(45deg, #000, #000 10px, #1a1a24 10px, #1a1a24 20px); border: 1px solid #ffd70033; }
        .table-container { scrollbar-width: thin; scrollbar-color: #9333ea transparent; }
    </style>
</head>
<body>
    <div id="bg-nasa">
        <img src="logo.jpg" alt="Logo" style="width: 100%; height: 100%; object-fit: cover; opacity: 0.07; filter: blur(2px) brightness(0.3);" onerror="this.style.display='none';" />
        <div style="position: absolute; inset: 0; background: radial-gradient(circle at center, transparent 0%, #020206 90%);"></div>
        <div class="scanline"></div>
    </div>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, addDoc, deleteDoc, query, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB8Ei-GTiqedjsFy09XVujGb94mzkBmVOU",
            authDomain: "ferco-farma.firebaseapp.com",
            projectId: "ferco-farma",
            storageBucket: "ferco-farma.firebasestorage.app",
            messagingSenderId: "974529589553",
            appId: "1:974529589553:web:a2944444e7689dec514010"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "ferco-farma-wms";

        const { useState, useEffect, useMemo, useRef } = React;
        const ReactApexChart = window.ReactApexCharts ? (window.ReactApexCharts.default || window.ReactApexCharts) : null;

        const App = () => {
            const [user, setUser] = useState(null);
            const [productos, setProductos] = useState([]);
            const [ventas, setVentas] = useState([]);
            const [sujetos, setSujetos] = useState([]);
            const [view, setView] = useState('dashboard');
            const [loading, setLoading] = useState(true);
            const [isSyncing, setIsSyncing] = useState(false);
            
            // Notification State (No-Alert Guardrail)
            const [notificacion, setNotificacion] = useState({ show: false, mensaje: '', tipo: 'success' });

            // Refs para carga masiva
            const fileInvRef = useRef(null);
            const fileDespRef = useRef(null);
            const fileSujRef = useRef(null);

            // POS States
            const [carrito, setCarrito] = useState([]);
            const [pagos, setPagos] = useState([]);
            const [itemActual, setItemActual] = useState({ productoId: '', sku: '', nombre: '', cantidad: 1, valorUnitario: 0, fraccion: 1 });
            const [metodoActual, setMetodoActual] = useState({ metodo: 'Efectivo', monto: '', fechaPago: '', comentario: '' });
            const [datosVenta, setDatosVenta] = useState({ 
                entidad: 'Cliente', nombreEntidad: '', entregaDomicilio: false, domiciliarioAsignado: 'Cris', 
                valorDomicilio: 0, canal: 'Ferco Farma', descontarStockHades: true, aplicarDescuento: false, valorDescuento: 0, 
                responsable: 'Cristian / Admin', cuentaDestino: 'CRIS'
            });

            // UI Dropdown States
            const [showProductList, setShowProductList] = useState(false);
            const [showSubjectList, setShowSubjectList] = useState(false);

            // Management States
            const [newProduct, setNewProduct] = useState({ id: null, sku: '', nombre: '', precioCosto: '', precioCliente: '', precioSocio: '', stockInicial: '', categoria: 'Producto Final' });
            const [newSujeto, setNewSujeto] = useState({ id: null, nombre: '', tipo: 'Cliente', telefono: '' });

            const staffDomi = ['Cris', 'Pipe', 'Valentino', 'Jhon', 'Delivery App'];

            useEffect(() => {
                signInAnonymously(auth).then(() => {
                    onAuthStateChanged(auth, (u) => { if(u) { setUser(u); setLoading(false); } });
                });
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubProd = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'productos'), (s) => setProductos(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubVentas = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'ventas'), (s) => setVentas(s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0))));
                const unsubSujetos = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'sujetos'), (s) => setSujetos(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                return () => { unsubProd(); unsubVentas(); unsubSujetos(); };
            }, [user]);

            // Toast Helper
            const mostrarNotificacion = (mensaje, tipo = 'success') => {
                setNotificacion({ show: true, mensaje, tipo });
                setTimeout(() => setNotificacion({ show: false, mensaje: '', tipo: 'success' }), 4500);
            };

            // --- CÁLCULOS CRÍTICOS ---
            const totalOp = useMemo(() => {
                const sub = carrito.reduce((s, i) => s + (parseFloat(i.cantidad) * i.fraccion * parseFloat(i.valorUnitario) || 0), 0);
                const desc = (datosVenta.entidad === 'Cliente' && datosVenta.aplicarDescuento) ? (parseFloat(datosVenta.valorDescuento) || 0) : 0;
                const dom = (datosVenta.entregaDomicilio) ? (parseFloat(datosVenta.valorDomicilio) || 0) : 0;
                return Math.max(0, sub - desc) + dom;
            }, [carrito, datosVenta]);

            const totalAbonado = useMemo(() => pagos.reduce((s, p) => s + (parseFloat(p.monto) || 0), 0), [pagos]);

            const hadesSplit = useMemo(() => {
                if (datosVenta.canal !== 'Hades' || carrito.length === 0) return { ferco: 0, hades: 0 };
                let fercoShare = 0; let hadesShare = 0;
                carrito.forEach(it => {
                    const p = productos.find(x => x.id === it.productoId);
                    const costoSocioTotal = (p?.precioSocio || 0) * it.cantidad * it.fraccion;
                    const ventaTotalHades = it.valorUnitario * it.cantidad * it.fraccion;
                    fercoShare += costoSocioTotal;
                    hadesShare += (ventaTotalHades - costoSocioTotal);
                });
                const dom = datosVenta.entregaDomicilio ? (parseFloat(datosVenta.valorDomicilio) || 0) : 0;
                return { ferco: fercoShare + dom, hades: hadesShare };
            }, [carrito, datosVenta, productos]);

            const metrics = useMemo(() => {
                const res = ventas.reduce((acc, v) => {
                    const val = parseFloat(v.totalVenta) || 0;
                    if (v.entidad === 'Cliente') acc.cli += val;
                    else if (v.entidad === 'Distribuidor') acc.dist += val;
                    else if (v.entidad === 'Proveedor') acc.prov += val;
                    return acc;
                }, { cli: 0, dist: 0, prov: 0 });
                const valorBodega = productos.reduce((s,p) => s + ((parseFloat(p.stockActual) || 0) * (parseFloat(p.precioCosto) || 0)), 0);
                return { ...res, valorBodega };
            }, [ventas, productos]);

            const rankingClientes = useMemo(() => {
                const stats = ventas.filter(v => v.entidad === 'Cliente' && v.nombreEntidad).reduce((acc, v) => {
                    const id = v.nombreEntidad.toUpperCase();
                    if (!acc[id]) acc[id] = { nombre: v.nombreEntidad, count: 0, total: 0 };
                    acc[id].count += 1;
                    acc[id].total += parseFloat(v.totalVenta) || 0;
                    return acc;
                }, {});
                return Object.values(stats).sort((a,b) => b.total - a.total).slice(0, 5);
            }, [ventas]);

            // --- LÓGICA DE INTERFAZ ---
            const getNextSKU = (cat, tempProductosList) => {
                const prefixMap = { 'Producto Final': 'PFNASA-', 'Insumo': 'INASA-', 'Empaque': 'ENASA-' };
                const prefix = prefixMap[cat] || 'PFNASA-';
                const listToScan = tempProductosList || productos;
                const nums = listToScan.filter(p => p.sku?.startsWith(prefix)).map(p => {
                    const m = p.sku.match(/\d+/);
                    return m ? parseInt(m[0]) : 0;
                });
                const next = Math.max(0, ...nums) + 1;
                return `${prefix}${String(next).padStart(3, '0')}`;
            };

            const selectProduct = (p) => {
                let v = 0;
                if (datosVenta.entidad === 'Proveedor') v = p.precioCosto || 0;
                else if (datosVenta.entidad === 'Distribuidor' || datosVenta.canal === 'Hades') v = p.precioSocio || 0;
                else v = p.precioCliente || 0;
                setItemActual({ ...itemActual, productoId: p.id, sku: p.sku, nombre: p.nombre, valorUnitario: v });
                setShowProductList(false);
            };

            const selectSubject = (s) => {
                setDatosVenta({...datosVenta, nombreEntidad: s.nombre});
                setShowSubjectList(false);
            };

            const confirmarDespacho = async (e) => {
                e.preventDefault();
                if (carrito.length === 0 || (totalAbonado < totalOp && datosVenta.entidad !== 'Proveedor')) return;
                try {
                    const ahora = new Date();
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'ventas'), {
                        ...datosVenta, items: carrito, pagos, totalVenta: totalOp, split: hadesSplit,
                        timestamp: Date.now(), fecha: ahora.toLocaleDateString(), hora: ahora.toLocaleTimeString(),
                        auditLog: `OP: ${datosVenta.responsable} | CANAL: ${datosVenta.canal}`
                    });
                    if (datosVenta.descontarStockHades || datosVenta.canal === 'Ferco Farma') {
                        for (const it of carrito) {
                            const pRef = doc(db, 'artifacts', appId, 'public', 'data', 'productos', it.productoId);
                            const pData = productos.find(x => x.id === it.productoId);
                            if (pData) {
                                const stockPrev = parseFloat(pData.stockActual) || 0;
                                const cambio = parseFloat(it.cantidad) * it.fraccion;
                                const nuevoStock = datosVenta.entidad === 'Proveedor' ? (stockPrev + cambio) : (stockPrev - cambio);
                                await updateDoc(pRef, { stockActual: nuevoStock });
                            }
                        }
                    }
                    setCarrito([]); setPagos([]);
                    setDatosVenta(prev => ({ ...prev, entidad: 'Cliente', nombreEntidad: '', entregaDomicilio: false, valorDomicilio: 0, canal: 'Ferco Farma', descontarStockHades: true, aplicarDescuento: false, valorDescuento: 0, cuentaDestino: 'CRIS' }));
                    mostrarNotificacion("Operación de despacho registrada con éxito en la nube.");
                } catch (err) { mostrarNotificacion("Falla de sincronización.", "error"); }
            };

            const upsertProd = async (e) => {
                e.preventDefault();
                const skuF = newProduct.sku.trim() || getNextSKU(newProduct.categoria);
                const data = { 
                    sku: skuF, nombre: newProduct.nombre.toUpperCase(), 
                    precioCosto: parseFloat(newProduct.precioCosto) || 0,
                    precioCliente: newProduct.categoria === 'Empaque' ? 0 : parseFloat(newProduct.precioCliente) || 0,
                    precioSocio: parseFloat(newProduct.precioSocio) || 0,
                    stockActual: parseFloat(newProduct.stockInicial) || 0, stockInicial: parseFloat(newProduct.stockInicial) || 0, 
                    categoria: newProduct.categoria, timestamp: Date.now()
                };
                if (newProduct.id) {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'productos', newProduct.id), data);
                    mostrarNotificacion(`Producto ${skuF} actualizado con éxito.`);
                } else {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'productos'), data);
                    mostrarNotificacion(`Producto ${skuF} inyectado al catálogo cloud.`);
                }
                setNewProduct({ id: null, sku: '', text: '', nombre: '', precioCosto: '', precioCliente: '', precioSocio: '', stockInicial: '', categoria: 'Producto Final' });
            };

            // --- MOTOR DE CARGA MASIVA OPTIMIZADO ---
            const uploadExcel = async (e, type) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsSyncing(true);
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                        
                        if (type === 'INVENTARIO') {
                            let currentProductsInBatch = [...productos];
                            let creados = 0;
                            let actualizados = 0;

                            for (const row of data) {
                                let skuE = String(row.SKU || "").trim().toUpperCase();
                                const cat = row.Categoria || 'Producto Final';
                                
                                if (!skuE) {
                                    skuE = getNextSKU(cat, currentProductsInBatch);
                                }
                                
                                const exist = currentProductsInBatch.find(p => p.sku.toUpperCase() === skuE);
                                const parsedStock = parseFloat(row.Stock) || 0;
                                const prodData = {
                                    sku: skuE,
                                    nombre: String(row.Nombre || "PRODUCTO MASIVO").toUpperCase(),
                                    categoria: cat,
                                    precioCosto: parseFloat(row.Costo) || 0,
                                    precioCliente: parseFloat(row.Precio_Cliente) || 0,
                                    precioSocio: parseFloat(row.Precio_Socio) || 0,
                                    stockActual: parsedStock,
                                    stockInicial: parsedStock,
                                    timestamp: Date.now()
                                };

                                if (exist) {
                                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'productos', exist.id), { 
                                        stockActual: parsedStock, 
                                        precioCosto: prodData.precioCosto,
                                        precioCliente: prodData.precioCliente,
                                        precioSocio: prodData.precioSocio,
                                        categoria: cat,
                                        nombre: prodData.nombre
                                    });
                                    actualizados++;
                                } else {
                                    const docRef = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'productos'), prodData);
                                    currentProductsInBatch.push({ id: docRef.id, ...prodData });
                                    creados++;
                                }
                            }
                            mostrarNotificacion(`Sincronización Completa: ${creados} SKUs creados, ${actualizados} actualizados.`);
                        } else if (type === 'SUJETOS') {
                            let creados = 0;
                            for (const row of data) {
                                if (row.Nombre) {
                                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'sujetos'), {
                                        nombre: row.Nombre.toUpperCase(), tipo: row.Tipo || 'Cliente', telefono: row.Telefono || '', timestamp: Date.now()
                                    });
                                    creados++;
                                }
                            }
                            mostrarNotificacion(`Éxito: ${creados} nuevos sujetos registrados masivamente.`);
                        } else if (type === 'DESPACHOS') {
                            let creados = 0;
                            for (const row of data) {
                                const p = productos.find(x => x.sku === row.SKU);
                                if (p && row.Sujeto) {
                                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'ventas'), {
                                        cuentaDestino: row.Cuenta_Ingreso || 'CRIS',
                                        entidad: row.Tipo_Sujeto || 'Cliente', nombreEntidad: row.Sujeto.toUpperCase(), canal: row.Canal || 'Ferco Farma',
                                        totalVenta: parseFloat(row.Total) || 0, items: [{ productoId: p.id, sku: p.sku, nombre: p.nombre, cantidad: row.Cantidad || 1, valorUnitario: row.Valor_Uni || 0, fraccion: 1 }],
                                        pagos: [{ metodo: row.Metodo || 'Efectivo', monto: row.Total || 0, comentario: row.Obs || '' }],
                                        fecha: row.Fecha || new Date().toLocaleDateString(), hora: row.Hora || new Date().toLocaleTimeString(),
                                        responsable: 'CARGA_MASIVA', timestamp: Date.now()
                                    });
                                    const pRef = doc(db, 'artifacts', appId, 'public', 'data', 'productos', p.id);
                                    await updateDoc(pRef, { stockActual: (parseFloat(p.stockActual) || 0) - (parseFloat(row.Cantidad) || 0) });
                                    creados++;
                                }
                            }
                            mostrarNotificacion(`Éxito: ${creados} despachos del log histórico integrados.`);
                        }
                    } catch (err) { mostrarNotificacion("Error en el mapeo de columnas del archivo.", "error"); }
                    finally { setIsSyncing(false); e.target.value = null; }
                };
                reader.readAsBinaryString(file);
            };

            const downloadTemplate = (type) => {
                let data = [];
                if (type === 'INVENTARIO') data = [{ SKU: "", Nombre: "ACETAMINOFEN", Categoria: "Producto Final", Costo: 1000, Precio_Cliente: 1500, Precio_Socio: 1200, Stock: 50 }];
                if (type === 'SUJETOS') data = [{ Nombre: "JUAN PEREZ", Tipo: "Cliente", Telefono: "300123456" }];
                if (type === 'DESPACHOS') data = [{ Fecha: "15/05/2026", Hora: "09:00:00", Sujeto: "JUAN PEREZ", Tipo_Sujeto: "Cliente", Canal: "Ferco Farma", SKU: "PFNASA-001", Cantidad: 1, Valor_Uni: 1500, Total: 1500, Metodo: "Efectivo", Obs: "Carga de Saldos", Cuenta_Ingreso: "CRIS" }];
                
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Plantilla");
                XLSX.writeFile(wb, `PLANTILLA_${type}.xlsx`);
            };

            // Función puente alias para descargar plantilla
            const exportarPlantilla = () => {
                downloadTemplate('INVENTARIO');
            };

            const exportarVentas = () => {
                const ws = XLSX.utils.json_to_sheet(ventas.map(v => ({
                    ID: v.id, FECHA: v.fecha, HORA: v.hora, CANAL: v.canal, TIPO: v.entidad, SUJETO: v.nombreEntidad,
                    CUENTA_INGRESO: v.cuentaDestino || 'CRIS',
                    VALOR_FERCO: v.split?.ferco || v.totalVenta, VALOR_HADES: v.split?.hades || 0, TOTAL: v.totalVenta,
                    AUDIT: v.auditLog
                })));
                const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Log");
                XLSX.writeFile(wb, `FERCO_FINANCE_REPORT_${Date.now()}.xlsx`);
            };

            // --- REGLA: Sincronización Correcta de Iconos en Cambios de Estado ---
            useEffect(() => { 
                if (!loading && window.lucide) window.lucide.createIcons(); 
            }, [loading, view, productos, ventas, carrito, datosVenta, sujetos, pagos, metodoActual, newProduct, newSujeto, showProductList, showSubjectList]);

            if (loading) return <div className="flex h-screen items-center justify-center bg-[#020206] text-space-purple font-black animate-pulse uppercase tracking-[0.5em]">Central FERCO FARMA Activo...</div>;

            return (
                <div className="max-w-[1600px] mx-auto p-4 md:p-6 lg:p-8">
                    {/* Notification Toast */}
                    {notificacion.show && (
                        <div className={`fixed bottom-6 right-6 z-50 p-4 rounded-xl shadow-2xl animate-bounce border text-xs font-black uppercase flex items-center gap-3 transition-all duration-300 ${notificacion.tipo === 'success' ? 'bg-black border-cyber-green text-cyber-green' : 'bg-black border-red-500 text-red-500'}`}>
                            <i data-lucide={notificacion.tipo === 'success' ? "check-circle" : "alert-triangle"}></i>
                            <span>{notificacion.mensaje}</span>
                        </div>
                    )}

                    {/* Header Principal */}
                    <header className="flex flex-col lg:flex-row justify-between items-center mb-8 gap-6 border-b border-white/5 pb-6">
                        <div className="flex items-center gap-4 text-white">
                            <img src="logo.jpg" alt="L" className="w-12 h-12 rounded-xl shadow-xl border border-white/10" />
                            <div>
                                <h1 className="text-3xl font-black italic tracking-tighter uppercase">FERCO <span className="text-space-orange">FARMA</span></h1>
                                <p className="text-[7px] uppercase tracking-[0.5em] font-black text-space-purple opacity-60">REGISTROS DE BODEGA v17.4</p>

                                        <div className="relative text-white">
                                            <input list="mSkus" value={newProduct.sku} onChange={e=>setNewProduct({...newProduct, sku:e.target.value})} placeholder="SKU (AUTO-CONSECUTIVO)" className="w-full p-3 bg-black/60 rounded-xl text-xs border border-white/10 text-white font-bold uppercase focus:border-white shadow-inner" />
                                            <datalist id="mSkus">{productos.map(p => <option key={p.id} value={p.sku}>{p.nombre}</option>)}</datalist>
                                        </div>
                                        <input value={newProduct.nombre} onChange={e=>setNewProduct({...newProduct, nombre:e.target.value})} placeholder="PRODUCTO" className="w-full p-3 bg-black/60 rounded-xl text-xs border border-white/10 font-black uppercase focus:border-white shadow-inner text-white shadow-inner" required />
                                        <div className="space-y-2 bg-white/5 p-4 rounded-2xl border border-white/10 shadow-inner">
                                            <input type="number" value={newProduct.precioCosto} onChange={e=>setNewProduct({...newProduct, precioCosto:e.target.value})} placeholder="PRECIO DE COSTO $" className="w-full bg-black/60 p-2.5 rounded-lg text-xs font-black border border-white/5 text-cyber-green outline-none" required />
                                            {newProduct.categoria !== 'Empaque' && (
                                                <input type="number" value={newProduct.precioCliente} onChange={e=>setNewProduct({...newProduct, precioCliente:e.target.value})} placeholder="PRECIO VENTA CLIENTE $" className="w-full bg-black/60 p-2.5 rounded-lg text-xs font-black border border-white/5 text-white outline-none focus:border-white shadow-inner" required />
                                            )}
                                            <input type="number" value={newProduct.precioSocio} onChange={e=>setNewProduct({...newProduct, precioSocio:e.target.value})} placeholder="PRECIO A ALIADOS $" className="w-full bg-black/60 p-2.5 rounded-lg text-xs font-black border border-white/5 text-white outline-none focus:border-white shadow-inner text-white" required />
                                        </div>
                                        <input type="number" value={newProduct.stockInicial} onChange={e=>setNewProduct({...newProduct, stockInicial:e.target.value})} placeholder="CANTIDAD A INGRESAR" className="w-full bg-black/60 p-3.5 rounded-xl text-xs font-black border border-white/10 text-white shadow-inner shadow-inner" required />
                                        
                                        <button type="submit" className="w-full bg-space-orange text-white font-black py-4 rounded-xl uppercase shadow-xl hover:scale-105 active:scale-95 transition-all text-[10px] tracking-widest italic uppercase">
                                            {newProduct.id ? 'ACTUALIZAR DATOS' : 'ACTUALIZAR STOCK'}
                                        </button>
                                        
                                        {/* REQUERIMIENTO: Botón para Cancelar Edición si está activo */}
                                        {newProduct.id && (
                                            <button 
                                                type="button" 
                                                onClick={() => setNewProduct({ id: null, sku: '', text: '', nombre: '', precioCosto: '', precioCliente: '', precioSocio: '', stockInicial: '', categoria: 'Producto Final' })} 
                                                className="w-full mt-2 bg-slate-800 text-white font-black py-2.5 rounded-xl uppercase transition-all text-[10px] tracking-widest border border-white/10 hover:bg-slate-700 italic"
                                            >
                                                Cancelar Edición
                                            </button>
                                        )}
                                    </form>
                                </div>
                                <div className="glass-panel p-6 border-cyber-green/30 text-center space-y-4">
                                    <h3 className="text-[10px] font-black uppercase text-cyber-green italic tracking-widest flex items-center justify-center gap-2"><i data-lucide="upload-cloud"></i> ACTUALIZACION MASIVA</h3>
                                    <input type="file" ref={fileInvRef} onChange={(e) => uploadExcel(e, 'INVENTARIO')} className="hidden" accept=".xlsx, .xls" />
                                    <div className="grid grid-cols-2 gap-2 text-white">
                                        <button onClick={() => fileInvRef.current.click()} disabled={isSyncing} className="py-3 bg-cyber-green/10 border border-cyber-green/40 rounded-xl font-black uppercase text-[8px] text-cyber-green hover:bg-cyber-green hover:text-black transition-all">CARGAR ARCHIVO</button>
                                        <button onClick={() => exportarPlantilla()} className="py-3 bg-white/5 border border-white/10 rounded-xl font-black uppercase text-[8px] text-white hover:bg-white/10 transition-all">DESCARGAR PLANTILLA</button>
                                    </div>
                                </div>
                            </div>
                            <div className="lg:col-span-8 space-y-6 h-[850px] overflow-y-auto pr-2 table-container text-white">
                                {['Producto Final', 'Insumo', 'Empaque'].map(cat => (
                                    <div key={cat} className="glass-panel overflow-hidden border-white/5 mb-6 shadow-xl text-white">
                                        <div className="p-4 bg-white/5 font-black uppercase text-[10px] border-b border-white/5 flex justify-between text-white">
                                            <span>Master Feed: {cat}</span>
                                            <span className="text-space-purple opacity-40 font-mono">{productos.filter(p=>p.categoria===cat).length} Items</span>
                                        </div>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left text-xs text-white">
                                                <thead className="bg-black/50 text-space-orange uppercase font-black text-[9px]"><tr><th className="p-4 text-white">SKU</th><th className="p-4 text-white">Nombre</th><th className="p-4 text-center text-white">Stock</th><th className="p-4 text-right text-white">ELIMINAR</th></tr></thead>
                                                <tbody className="divide-y divide-white/5">
                                                    {productos.filter(p => p.categoria === cat).map(p => (
                                                        <tr key={p.id} className="hover:bg-white/5 transition-all text-white">
                                                            <td className="p-4 font-mono text-space-purple text-[10px] font-bold text-white">{p.sku}</td>
                                                            <td className="p-4 italic text-white text-[10px] truncate max-w-[200px] uppercase text-white">{p.nombre}</td>
                                                            <td className={`p-4 text-center font-black ${p.stockActual<10?'text-red-500 animate-pulse':'text-cyber-green'}`}>{p.stockActual}</td>
                                                            <td className="p-4 text-right flex justify-end gap-2 text-white">
                                                                {/* REQUERIMIENTO: Botones corregidos con contraste legible sin text-white sobreescrito */}
                                                                <button 
                                                                    onClick={() => setNewProduct({id:p.id, sku:p.sku, nombre:p.nombre, precioCosto:p.precioCosto, precioCliente:p.precioCliente, precioSocio:p.precioSocio, stockInicial:p.stockActual, categoria:p.categoria})} 
                                                                    className="text-blue-400 hover:text-blue-300 hover:scale-125 transition-all p-1"
                                                                    title="Editar Producto"
                                                                >
                                                                    <i data-lucide="edit-3"></i>
                                                                </button>
                                                                <button 
                                                                    onClick={async () => { if(confirm('¿Borrar registro?')) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'productos', p.id)); }} 
                                                                    className="text-red-500 hover:text-red-400 hover:scale-125 transition-all p-1"
                                                                    title="Eliminar Producto"
                                                                >
                                                                    <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                                </button>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 animate-in fade-in duration-500 text-white">
                            <div className="lg:col-span-4 glass-panel p-8 border-white/10 text-white shadow-2xl">
                                <h2 className="text-lg font-black mb-8 italic uppercase border-l-4 border-white pl-4 text-white tracking-widest">
                                    {newSujeto.id ? 'MODIFICAR SUJETO' : 'Directorio Maestro'}
                                </h2>
                                <form onSubmit={async (e)=>{ 
                                    e.preventDefault(); 
                                    if(newSujeto.id) {
                                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sujetos', newSujeto.id), {nombre:newSujeto.nombre.toUpperCase(), tipo:newSujeto.tipo, telefono:newSujeto.telefono}); 
                                        mostrarNotificacion("Socio actualizado en el directorio central.");
                                    } else {
                                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'sujetos'), {nombre:newSujeto.nombre.toUpperCase(), tipo:newSujeto.tipo, telefono:newSujeto.tipo==='Cliente'?newSujeto.telefono:'', timestamp: Date.now()}); 
                                        mostrarNotificacion("Sujeto registrado en el directorio central.");
                                    }
                                    setNewSujeto({id:null, nombre:'', tipo:'Cliente', telefono:''}); 
                                }} className="space-y-6">
                                    <div className="grid grid-cols-3 gap-1.5 p-1.5 bg-black/40 rounded-xl border border-white/10 shadow-inner">
                                        {['Cliente', 'Proveedor', 'Distribuidor'].map(t => <button key={t} type="button" onClick={()=>setNewSujeto({...newSujeto, tipo:t})} className={`py-3 rounded-lg text-[8px] font-black uppercase transition-all ${newSujeto.tipo===t?'bg-white text-black shadow-xl':'text-slate-600'}`}>{t}</button>)}
                                    </div>
                                    <input value={newSujeto.nombre} onChange={e=>setNewSujeto({...newSujeto, nombre:e.target.value})} placeholder="NOMBRE / ENTIDAD COMERCIAL" className="w-full p-4 bg-black/60 rounded-xl text-xs font-black border border-white/5 focus:border-white shadow-inner text-white outline-none uppercase" required />
                                    <input value={newSujeto.telefono} onChange={e=>setNewSujeto({...newSujeto, telefono:e.target.value})} placeholder="TELÉFONO / UPLINK" className="w-full p-4 bg-[#1a1a24] rounded-xl text-xs font-black border border-white/5 focus:border-white shadow-inner text-white outline-none shadow-inner" />
                                    <button type="submit" className="w-full bg-white text-black font-black py-4 rounded-xl uppercase tracking-widest shadow-2xl hover:scale-105 active:scale-95 transition-all text-xs tracking-widest italic uppercase">REGISTRAR SUJETO</button>
                                    
                                    {newSujeto.id && (
                                        <button 
                                            type="button" 
                                            onClick={() => setNewSujeto({ id: null, nombre: '', tipo: 'Cliente', telefono: '' })} 
                                            className="w-full mt-2 bg-slate-800 text-white font-black py-2.5 rounded-xl uppercase transition-all text-[10px] tracking-widest border border-white/10 hover:bg-slate-700 italic"
                                        >
                                            Cancelar Edición
                                        </button>
                                    )}
                                </form>
                                <div className="mt-8 pt-8 border-t border-white/5 space-y-4">
                                    <h3 className="text-[10px] font-black uppercase text-cyber-green italic text-center tracking-widest">ACTUALIZACION MASIVA</h3>
                                    <input type="file" ref={fileSujRef} onChange={(e) => uploadExcel(e, 'SUJETOS')} className="hidden" accept=".xlsx, .xls" />
                                    <div className="grid grid-cols-2 gap-2 text-white">
                                        <button onClick={() => fileSujRef.current.click()} disabled={isSyncing} className="py-3 bg-cyber-green/10 border border-cyber-green/40 rounded-xl font-black uppercase text-[8px] text-cyber-green hover:bg-cyber-green hover:text-black transition-all">CARGAR ARCHIVO</button>
                                        <button onClick={() => downloadTemplate('SUJETOS')} className="py-3 bg-white/5 border border-white/10 rounded-xl font-black uppercase text-[8px] text-white hover:bg-white/10 transition-all">PLANTILLA</button>
                                    </div>
                                </div>
                            </div>
                            <div className="lg:col-span-8 glass-panel overflow-hidden h-[800px] flex flex-col border-white/5 text-white shadow-xl">
                                <div className="p-6 bg-white/5 font-black uppercase text-[10px] border-b border-white/5 flex justify-between items-center text-white"><span>Base de Datos Aliados</span><span className="opacity-40 italic font-mono text-white">{sujetos.length} Registros</span></div>
                                <div className="overflow-x-auto flex-1 table-container text-white">
                                    <table className="w-full text-left text-xs text-white">
                                        <thead className="bg-[#101018] text-slate-500 uppercase font-black sticky top-0 text-white"><tr><th className="p-6 py-4 text-white">Tipo</th><th className="p-6 py-4 text-white font-white">Nombre de Entidad</th><th className="p-6 py-4 text-right text-white">ELIMINAR</th></tr></thead>
                                        <tbody className="divide-y divide-white/5 text-white">
                                            {sujetos.map(s => (
                                                <tr key={s.id} className="hover:bg-white/10 font-black uppercase italic transition-all group border-l-4 border-l-transparent hover:border-l-space-purple text-white">
                                                    <td className="p-6 text-white text-white"><span className={`px-3 py-1 rounded-md text-[7px] font-black border ${s.tipo==='Cliente'?'text-cyber-green border-cyber-green/30':s.tipo==='Proveedor'?'text-space-orange border-space-orange/30':'text-space-purple border-space-purple/30'}`}>{s.tipo}</span></td>
                                                    <td className="p-6 text-white text-[11px] font-bold transition-all text-white uppercase text-white">{s.nombre}</td>
                                                    <td className="p-6 text-right flex justify-end gap-3 opacity-30 group-hover:opacity-100 transition-opacity">
                                                        <button onClick={()=>setNewSujeto({id:s.id, nombre:s.nombre, tipo:s.tipo, telefono:s.telefono})} className="text-blue-400 hover:scale-125 transition-transform text-white"><i data-lucide="edit-3"></i></button>
                                                        <button onClick={async ()=>{ if(confirm('¿Anular registro permanentemente?')) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sujetos', s.id)); }} className="text-red-600 hover:scale-125 transition-transform text-white"><i data-lucide="trash-2" className="w-4 h-4 text-white"></i></button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />); // Corrección del cierre de renderizado de React 18
        
        onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'productos'), () => {
             setTimeout(() => { if(window.lucide) lucide.createIcons(); }, 500);
        });
    </script>
</body>
</html>
