    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FERCO FARMA | REGISTROS DE BODEGA v21.0</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <script>
        tailwind.config = {

                    }
                }
            }
        }
    </script>

    <style type="text/css">
        body { background-color: #020206; color: white; margin: 0; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        #bg-nasa { z-index: 0; position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
        #root { z-index: 10; position: relative; min-height: 100vh; }

        .glass-panel { 
            background: rgba(10, 10, 18, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1rem;
            backdrop-filter: blur(40px);
        }

        .btn-primary-nasa {
            width: 100%;
            background: linear-gradient(135deg, #9333ea 0%, #f97316 100%);
            color: white;
            font-weight: 900;
            padding: 1.25rem;
            border-radius: 0.75rem;
            text-transform: uppercase;
            font-style: italic;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 25px rgba(147, 51, 234, 0.3);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-primary-nasa:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(249, 115, 22, 0.5); border-color: white; }

        .scanline {
            position: fixed; inset: 0; pointer-events: none; opacity: 0.015; z-index: 50;
            background: linear-gradient(to bottom, transparent 0%, #9333ea 50%, transparent 100%);
            animation: scan 12s linear infinite;
        }
        @keyframes scan { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #020206; }
        ::-webkit-scrollbar-thumb { background: #9333ea; border-radius: 10px; }

        .selectable-list { max-height: 200px; overflow-y: auto; border-radius: 0.75rem; background: rgba(0,0,0,0.9); border: 1px solid rgba(255,255,255,0.1); margin-top: 4px; position: absolute; width: 100%; z-index: 100; backdrop-filter: blur(10px); }
        .selectable-item { padding: 12px; font-size: 11px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); transition: background 0.2s; text-transform: uppercase; font-weight: bold; color: white; }
        .selectable-item:hover { background: rgba(147, 51, 234, 0.4); color: #39ff14; }
        
        .hades-card { background: repeating-linear-gradient(45deg, #000, #000 10px, #1a1a24 10px, #1a1a24 20px); border: 1px solid #ffd70033; }
        .table-container { scrollbar-width: thin; scrollbar-color: #9333ea transparent; }
    </style>
</head>
<body>
    <div id="bg-nasa">
        <img src="logo.jpg" alt="Logo" style="width: 100%; height: 100%; object-fit: cover; opacity: 0.07; filter: blur(2px) brightness(0.3);" onerror="this.style.display='none';" />
        <div style="position: absolute; inset: 0; background: radial-gradient(circle at center, transparent 0%, #020206 90%);"></div>
        <div class="scanline"></div>
    </div>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, addDoc, deleteDoc, query, updateDoc, writeBatch, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB8Ei-GTiqedjsFy09XVujGb94mzkBmVOU",
            authDomain: "ferco-farma.firebaseapp.com",
            projectId: "ferco-farma",
            storageBucket: "ferco-farma.firebasestorage.app",
            messagingSenderId: "974529589553",
            appId: "1:974529589553:web:a2944444e7689dec514010"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = "ferco-farma-wms";

        const { useState, useEffect, useMemo, useRef } = React;
        const ReactApexChart = window.ReactApexCharts ? (window.ReactApexCharts.default || window.ReactApexCharts) : null;

        // --- ENCRIPTACIÓN simétrica (AES-256) ---
        const encryptVal = (val, key) => {
            if (val === undefined || val === null || val === '') return '';
            return CryptoJS.AES.encrypt(String(val), key).toString();
        };

        const decryptVal = (cipher, key, isNumeric = false) => {
            if (cipher === undefined || cipher === null || cipher === '') return isNumeric ? 0 : '';
            if (!key) return isNumeric ? (parseFloat(cipher) || 0) : String(cipher);
            try {
                if (typeof cipher !== 'string') return isNumeric ? (parseFloat(cipher) || 0) : cipher;
                const bytes = CryptoJS.AES.decrypt(cipher, key);
                const decrypted = bytes.toString(CryptoJS.enc.Utf8);
                if (decrypted !== '') return isNumeric ? (parseFloat(decrypted) || 0) : decrypted;
            } catch (e) {}
            return isNumeric ? (parseFloat(cipher) || 0) : String(cipher);
        };

        // REQUERIMIENTO SANEAMIENTO: Normalizador de Categorías estricto
        const normalizarCategoria = (cat) => {
            if (!cat) return 'Producto Final';
            const clean = cat.trim().toLowerCase();
            if (clean.includes('final')) return 'Producto Final';
            if (clean.includes('insumo')) return 'Insumo';
            if (clean.includes('empaque')) return 'Empaque';
            return 'Producto Final';
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [productos, setProductos] = useState([]);
            const [ventas, setVentas] = useState([]);
            const [sujetos, setSujetos] = useState([]);
            const [view, setView] = useState('dashboard');
            const [loading, setLoading] = useState(true);
            const [isSyncing, setIsSyncing] = useState(false);
            
            // Criptografía y Estados de Bóveda
            const [vaultKey, setVaultKey] = useState('');
            const [isVaultLocked, setIsVaultLocked] = useState(true);
            const [vaultAuthDoc, setVaultAuthDoc] = useState(null);
            
            // Campos del formulario de Login
            const [loginEmail, setLoginEmail] = useState('');
            const [loginPassword, setLoginPassword] = useState('');
            const [inputKey, setInputKey] = useState('');
            const [vaultError, setVaultError] = useState('');

            // Notification State reactiva
            const [notificacion, setNotificacion] = useState({ show: false, mensaje: '', tipo: 'success' });

            // Refs para archivos masivos
            const fileInvRef = useRef(null);
            const fileDespRef = useRef(null);
            const fileSujRef = useRef(null);

            // POS / Despacho States
            const [editingVentaId, setEditingVentaId] = useState(null);
            const [oldItems, setOldItems] = useState([]); 
            const [carrito, setCarrito] = useState([]);
            const [pagos, setPagos] = useState([]);
            const [itemActual, setItemActual] = useState({ productoId: '', sku: '', nombre: '', cantidad: 1, valorUnitario: 0, fraccion: 1 });
            const [metodoActual, setMetodoActual] = useState({ metodo: 'Efectivo', monto: '', fechaPago: '', comentario: '' });
            const [datosVenta, setDatosVenta] = useState({ 
                entidad: 'Cliente', nombreEntidad: '', entregaDomicilio: false, domiciliarioAsignado: 'Pipe', 
                valorDomicilio: 0, canal: 'Ferco Farma', descontarStockHades: true, aplicarDescuento: false, valorDescuento: 0, 
                cuentaDestino: 'CRIS'
            });

            // UI Dropdown States
            const [showProductList, setShowProductList] = useState(false);
            const [showSubjectList, setShowSubjectList] = useState(false);

            // Modal Cartera State
            const [saldarModal, setSaldarModal] = useState({
                show: false, venta: null, nuevoMetodo: 'Efectivo', montoEfectivo: '', fechaEfectiva: '', observacionCierre: ''
            });

            // Management States
            const [newProduct, setNewProduct] = useState({ id: null, sku: '', nombre: '', precioCosto: '', precioCliente: '', precioSocio: '', stockInicial: '', categoria: 'Producto Final' });
            const [newSujeto, setNewSujeto] = useState({ id: null, nombre: '', tipo: 'Cliente', telefono: '' });

            const staffDomi = ['Pipe', 'André', 'César', 'David'];

            // Sincronización del estado de autenticación
            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    if (u) {
                        setLoading(false);
                    } else {
                        setIsVaultLocked(true);
                        setVaultKey('');
                        setLoading(false);
                    }
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!user) return;
                const unsubProd = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'productos'), (s) => setProductos(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubVentas = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'ventas'), (s) => setVentas(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubSujetos = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'sujetos'), (s) => setSujetos(s.docs.map(d => ({ id: d.id, ...d.data() }))));
                const unsubVaultAuth = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'vault_control'), (snap) => {
                    const docAuth = snap.docs.find(d => d.id === 'auth');
                    if (docAuth) setVaultAuthDoc({ id: docAuth.id, ...docAuth.data() });
                    else setVaultAuthDoc(null);
                });
                return () => { unsubProd(); unsubVentas(); unsubSujetos(); unsubVaultAuth(); };
            }, [user]);

            const mostrarNotificacion = (mensaje, tipo = 'success') => {
                setNotificacion({ show: true, mensaje, tipo });
                setTimeout(() => setNotificacion({ show: false, mensaje: '', tipo: 'success' }), 4500);
            };

            // --- DECRYPTION IN MEMORY ---
            const decryptedProductos = useMemo(() => {
                if (isVaultLocked || !vaultKey) return [];
                return productos.map(p => {
                    const catNorm = normalizarCategoria(p.categoria); 
                    return {
                        id: p.id, 
                        sku: p.sku || 'SIN-SKU', 
                        categoria: catNorm, 
                        stockActual: p.stockActual !== undefined ? p.stockActual : 0, 
                        stockInicial: p.stockInicial !== undefined ? p.stockInicial : 0,
                        nombre: decryptVal(p.nombre, vaultKey) || 'PRODUCTO DESCONOCIDO',
                        precioCosto: decryptVal(p.precioCosto, vaultKey, true),
                        precioCliente: decryptVal(p.precioCliente, vaultKey, true),
                        precioSocio: decryptVal(p.precioSocio, vaultKey, true)
                    };
                });
            }, [productos, isVaultLocked, vaultKey]);

            const decryptedVentas = useMemo(() => {
                if (isVaultLocked || !vaultKey) return [];
                return ventas.map(v => {
                    let decItems = []; let decPagos = []; let decSplit = { ferco: 0, hades: 0 };
                    if (v.items) {
                        if (Array.isArray(v.items)) decItems = v.items;
                        else {
                            try { const str = decryptVal(v.items, vaultKey); if (str) decItems = JSON.parse(str); } 
                            catch(e) { try { decItems = JSON.parse(v.items); } catch(err) {} }
                        }
                    }
                    if (v.pagos) {
                        if (Array.isArray(v.pagos)) decPagos = v.pagos;
                        else {
                            try { const str = decryptVal(v.pagos, vaultKey); if (str) decPagos = JSON.parse(str); } 
                            catch(e) { try { decPagos = JSON.parse(v.pagos); } catch(err) {} }
                        }
                    }
                    if (v.split) {
                        if (typeof v.split === 'object' && !v.split.ciphertext) decSplit = v.split;
                        else {
                            try { const str = decryptVal(v.split, vaultKey); if (str) decSplit = JSON.parse(str); } 
                            catch(e) { if (typeof v.split === 'object') decSplit = v.split; }
                        }
                    }
                    return {
                        id: v.id, entidad: v.entidad, canal: v.canal, estado: v.estado, cuentaDestino: v.cuentaDestino, timestamp: v.timestamp, fecha: v.fecha, hora: v.hora,
                        nombreEntidad: decryptVal(v.nombreEntidad, vaultKey),
                        responsable: decryptVal(v.responsable, vaultKey),
                        totalVenta: decryptVal(v.totalVenta, vaultKey, true),
                        items: decItems, pagos: decPagos, split: decSplit
                    };
                }).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
            }, [ventas, isVaultLocked, vaultKey]);

            const decryptedSujetos = useMemo(() => {
                if (isVaultLocked || !vaultKey) return [];
                return sujetos.map(s => ({
                    id: s.id, tipo: s.tipo,
                    nombre: decryptVal(s.nombre, vaultKey),
                    telefono: decryptVal(s.telefono, vaultKey)
                }));
            }, [sujetos, isVaultLocked, vaultKey]);

            const inventarioActualizado = useMemo(() => {
                return [...decryptedProductos].sort((a, b) => {
                    const numA = parseInt(a.sku?.match(/\d+/)?.[0] || 0, 10);
                    const numB = parseInt(b.sku?.match(/\d+/)?.[0] || 0, 10);
                    if (numA !== numB) return numA - numB;
                    return (a.sku || '').localeCompare(b.sku || '');
                });
            }, [decryptedProductos]);

            // --- REFACTORIZACIÓN: NUEVA LÓGICA DE SKU (GLOBAL Y UNIFICADA) ---
            const getNextSKU = (tempProductosList) => {
                const prefix = 'NASA-';
                const listToScan = tempProductosList || inventarioActualizado;
                
                const nums = listToScan
                    .filter(p => p.sku?.startsWith(prefix))
                    .map(p => {
                        const m = p.sku.match(/\d+/);
                        return m ? parseInt(m[0], 10) : 0;
                    });
                
                const maxNum = nums.length > 0 ? Math.max(...nums) : 0;
                const next = maxNum + 1;
                
                return `${prefix}${String(next).padStart(3, '0')}`;
            };

            const totalOp = useMemo(() => {
                const sub = carrito.reduce((s, i) => s + (parseFloat(i.cantidad) * i.fraccion * parseFloat(i.valorUnitario) || 0), 0);
                const desc = (datosVenta.entidad === 'Cliente' && datosVenta.aplicarDescuento) ? (parseFloat(datosVenta.valorDescuento) || 0) : 0;
                const dom = (datosVenta.entregaDomicilio) ? (parseFloat(datosVenta.valorDomicilio) || 0) : 0;
                return Math.max(0, sub - desc) + dom;
            }, [carrito, datosVenta]);

            const totalAbonado = useMemo(() => pagos.reduce((s, p) => s + (parseFloat(p.monto) || 0), 0), [pagos]);

            const hadesSplit = useMemo(() => {
                if (datosVenta.canal !== 'Hades' || carrito.length === 0) return { ferco: 0, hades: 0 };
                let fercoShare = 0; let hadesShare = 0;
                carrito.forEach(it => {
                    const p = inventarioActualizado.find(x => x.id === it.productoId);
                    const costoSocioTotal = (p?.precioSocio || 0) * it.cantidad * it.fraccion;
                    const ventaTotalHades = it.valorUnitario * it.cantidad * it.fraccion;
                    fercoShare += costoSocioTotal;
                    hadesShare += (ventaTotalHades - costoSocioTotal);
                });
                const dom = datosVenta.entregaDomicilio ? (parseFloat(datosVenta.valorDomicilio) || 0) : 0;
                return { ferco: fercoShare + dom, hades: hadesShare };
            }, [carrito, datosVenta, inventarioActualizado]);

            const metrics = useMemo(() => {
                const res = decryptedVentas.reduce((acc, v) => {
                    const val = parseFloat(v.totalVenta) || 0;
                    if (v.entidad === 'Cliente') acc.cli += val;
                    else if (v.entidad === 'Distribuidor') acc.dist += val;
                    else if (v.entidad === 'Proveedor') acc.prov += val;
                    return acc;
                }, { cli: 0, dist: 0, prov: 0 });
                const valorBodega = inventarioActualizado.reduce((s,p) => s + ((parseFloat(p.stockActual) || 0) * (parseFloat(p.precioCosto) || 0)), 0);
                return { ...res, valorBodega, bajos: inventarioActualizado.filter(p => p.stockActual < 10).length };
            }, [decryptedVentas, inventarioActualizado]);

            const rankingClientes = useMemo(() => {
                const stats = decryptedVentas.filter(v => v.entidad === 'Cliente' && v.nombreEntidad).reduce((acc, v) => {
                    const id = v.nombreEntidad.toUpperCase();
                    if (!acc[id]) acc[id] = { nombre: v.nombreEntidad, count: 0, total: 0 };
                    acc[id].count += 1;
                    acc[id].total += parseFloat(v.totalVenta) || 0;
                    return acc;
                }, {});
                return Object.values(stats).sort((a,b) => b.total - a.total).slice(0, 5);
            }, [decryptedVentas]);

            useEffect(() => {
                const term = itemActual.sku.trim().toUpperCase();
                if (term.length > 1) {
                    const p = inventarioActualizado.find(x => x.sku.toUpperCase() === term);
                    if (p && !itemActual.productoId) {
                        let v = 0;
                        if (datosVenta.entidad === 'Proveedor') v = p.precioCosto || 0;
                        else if (datosVenta.entidad === 'Distribuidor' || datosVenta.canal === 'Hades') v = p.precioSocio || 0;
                        else v = p.precioCliente || 0;
                        setItemActual(prev => ({ ...prev, productoId: p.id, nombre: p.nombre, valorUnitario: v }));
                    }
                }
            }, [itemActual.sku, datosVenta.entidad, datosVenta.canal, inventarioActualizado]);

            useEffect(() => {
                const skuTerm = newProduct.sku.trim().toUpperCase();
                if (skuTerm.length > 0) {
                    const p = inventarioActualizado.find(x => x.sku.toUpperCase() === skuTerm);
                    if (p && (!newProduct.id || newProduct.id !== p.id)) {
                        setNewProduct({
                            id: p.id,
                            sku: p.sku,
                            nombre: p.nombre,
                            precioCosto: p.precioCosto,
                            precioCliente: p.precioCliente,
                            precioSocio: p.precioSocio,
                            stockInicial: p.stockInicial,
                            categoria: p.categoria
                        });
                    }
                }
            }, [newProduct.sku, inventarioActualizado]);

            // --- AUTO-GENERACIÓN DE SKU AL ESCRIBIR NOMBRE EN INVENTARIO ---
            const handleNewProductNameChange = (nombreVal) => {
                let skuVal = newProduct.sku;
                if (!newProduct.id && (!newProduct.sku || newProduct.sku.trim() === '')) {
                    skuVal = getNextSKU();
                }
                setNewProduct(prev => ({
                    ...prev,
                    nombre: nombreVal,
                    sku: skuVal
                }));
            };

            const handleCategoryChange = (cat) => {
                let skuVal = newProduct.sku;
                if (!newProduct.id && (!newProduct.sku || newProduct.sku.startsWith('PFNASA-') || newProduct.sku.startsWith('INASA-') || newProduct.sku.startsWith('ENASA-') || newProduct.sku.trim() === '')) {
                    skuVal = getNextSKU();
                }
                setNewProduct(prev => ({
                    ...prev,
                    categoria: cat,
                    sku: skuVal
                }));
            };

            const selectProduct = (p) => {
                let v = 0;
                if (datosVenta.entidad === 'Proveedor') v = p.precioCosto || 0;
                else if (datosVenta.entidad === 'Distribuidor' || datosVenta.canal === 'Hades') v = p.precioSocio || 0;
                else v = p.precioCliente || 0;
                setItemActual(prev => ({ ...prev, productoId: p.id, sku: p.sku, nombre: p.nombre, valorUnitario: v }));
                setShowProductList(false);
            };

            const selectSubject = (s) => {
                setDatosVenta(prev => ({ ...prev, nombreEntidad: s.nombre }));
                setShowSubjectList(false);
            };

            const handleUnlockVault = async (e) => {
                e.preventDefault();
                if (!loginEmail || !loginPassword || !inputKey) return;
                try {
                    const userCredential = await signInWithEmailAndPassword(auth, loginEmail, loginPassword);
                    const authenticatedUser = userCredential.user;

                    if (!vaultAuthDoc) {
                        const verificationToken = encryptVal("FERCO_VAULT_ACTIVE", inputKey);
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'vault_control', 'auth'), {
                            token: verificationToken
                        });
                        setVaultKey(inputKey);
                        setIsVaultLocked(false);
                        mostrarNotificacion("Bóveda e inicio de sesión configurado correctamente.");
                    } else {
                        const decryptedCheck = decryptVal(vaultAuthDoc.token, inputKey);
                        if (decryptedCheck === 'FERCO_VAULT_ACTIVE') {
                            setVaultKey(inputKey);
                            setIsVaultLocked(false);
                            setVaultError('');
                            mostrarNotificacion(`Uplink Seguro: ${authenticatedUser.email}`);
                        } else {
                            await signOut(auth);
                            setVaultError("⚠️ Clave Maestra de Bodega incorrecta. Acceso denegado.");
                        }
                    }
                } catch (err) {
                    console.error("Error de Login:", err);
                    if (err.code === 'auth/invalid-credential') {
                        setVaultError("⚠️ Credenciales inválidas. El correo o la contraseña son incorrectos.");
                    } else if (err.code === 'auth/invalid-email') {
                        setVaultError("⚠️ Formato de correo electrónico inválido.");
                    } else if (err.code === 'auth/user-not-found') {
                        setVaultError("⚠️ Usuario no registrado en la base de datos de autenticación.");
                    } else {
                        setVaultError("⚠️ Error de autenticación: " + err.message);
                    }
                }
            };

            const handleSignOut = async () => {
                await signOut(auth);
                setIsVaultLocked(true);
                setVaultKey('');
                setLoginEmail('');
                setLoginPassword('');
                setInputKey('');
            };

            const iniciarEdicionDespacho = (v) => {
                setEditingVentaId(v.id);
                setCarrito(v.items || []);
                setOldItems(JSON.parse(JSON.stringify(v.items || []))); 
                setDatosVenta({
                    entidad: v.entidad || 'Cliente',
                    nombreEntidad: v.nombreEntidad || '',
                    canal: v.canal || 'Ferco Farma',
                    cuentaDestino: v.cuentaDestino || 'CRIS',
                    entregaDomicilio: v.entregaDomicilio || false,
                    valorDomicilio: v.valorDomicilio || 0,
